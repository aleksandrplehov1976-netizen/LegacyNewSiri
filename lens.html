<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Search</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    gap: 20px;
    overflow: hidden;
  }

  /* ── PERMISSION ── */
  #permission-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
  }
  #permission-overlay.hidden { display: none; }

  .perm-card {
    background: rgba(30,30,32,0.97);
    border-radius: 14px;
    width: 270px;
    overflow: hidden;
  }
  .perm-body { padding: 20px 16px 4px; text-align: center; }
  .perm-icon {
    width: 56px; height: 56px;
    background: rgba(255,255,255,0.07);
    border-radius: 14px;
    margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .perm-icon svg { width: 30px; height: 30px; }
  .perm-card h3 { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 6px; line-height: 1.4; }
  .perm-card p  { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.4; margin-bottom: 16px; }
  .perm-divider { height: 0.5px; background: rgba(255,255,255,0.15); }
  .perm-btns { display: flex; }
  .perm-btn {
    flex: 1; padding: 14px 0;
    background: none; border: none;
    font-family: inherit; font-size: 17px;
    cursor: pointer; color: #0a84ff;
  }
  .perm-btn.deny { border-right: 0.5px solid rgba(255,255,255,0.15); font-weight: 400; }
  .perm-btn.allow { font-weight: 600; }

  /* ── VIEWFINDER BOX ── */
  .viewfinder-box {
    position: relative;
    width: 340px;
    height: 680px;
    border-radius: 44px;
    overflow: hidden;
    background: #111;
    opacity: 0;
    transform: scale(0.3) translateY(120px);
    transition: none;
  }
  .viewfinder-box.animate-in {
    animation: zoomFadeIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes zoomFadeIn {
    0%   { opacity: 0; transform: scale(0.3) translateY(120px); }
    100% { opacity: 1; transform: scale(1) translateY(0px); }
  }

  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  canvas#preview {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }

  /* ── BUTTONS ROW ── */
  .buttons-row {
    position: absolute;
    bottom: 36px; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .buttons-row.show { opacity: 1; }
  @keyframes fadeIn { to { opacity: 1; } }

  .side-btn {
    position: relative;
    width: 56px; height: 56px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .side-btn img.btn-texture {
    width: 100%; height: 100%;
    object-fit: contain; display: block;
  }
  .side-btn .icon-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .side-btn .icon-overlay svg { width: 22px; height: 22px; }
  .side-btn:active { transform: scale(0.92); transition: transform .1s; }

  .shutter-btn {
    width: 80px; height: 80px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    padding: 0; background: none; border: none;
    user-select: none;
  }
  .shutter-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .shutter-btn:active { transform: scale(0.94); transition: transform .1s; }

  /* ── FLASH ── */
  .flash-overlay {
    position: absolute; inset: 0;
    background: #fff; opacity: 0;
    pointer-events: none; z-index: 10;
  }
  .flash-overlay.go { animation: flashGo 0.3s ease-out forwards; }
  @keyframes flashGo { 0% { opacity: 0.9; } 100% { opacity: 0; } }

  /* ── CLOSE PILL ── */
  .close-pill {
    background: rgba(26,26,26,0.92);
    border: none; border-radius: 30px;
    color: #fff; font-family: inherit;
    font-size: 17px; font-weight: 400;
    padding: 12px 56px; cursor: pointer;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .close-pill.show { opacity: 1; }

  /* ── RESULTS SHEET ── */
  #results-sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(16,16,16,0.97);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 20px 20px 44px 44px;
    padding: 14px 18px 36px;
    display: none;
    flex-direction: column;
    gap: 12px;
    z-index: 20;
    transform: translateY(100%);
    transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #results-sheet.visible { display: flex; }
  #results-sheet.up { transform: translateY(0); }

  .sheet-handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.18);
    border-radius: 2px; margin: 0 auto 4px;
  }
  .sheet-thumb {
    width: 100%; height: 110px;
    border-radius: 12px; object-fit: cover;
    background: #222;
  }
  .sheet-title { font-size: 14px; font-weight: 600; color: #fff; }
  .sheet-sub   { font-size: 12px; color: rgba(255,255,255,0.38); margin-top: 2px; }

  .engines {
    display: flex; flex-direction: column;
    border-radius: 12px; overflow: hidden;
    background: rgba(255,255,255,0.05);
  }
  .engine-row {
    display: flex; align-items: center;
    padding: 13px 14px;
    color: #fff; font-size: 15px; font-weight: 400;
    border-bottom: 0.5px solid rgba(255,255,255,0.07);
    cursor: pointer; user-select: none;
    transition: background .1s;
  }
  .engine-row:last-child { border-bottom: none; }
  .engine-row span { flex: 1; }
  .engine-row .chev { color: rgba(255,255,255,0.22); font-size: 13px; }
  .engine-row:active { background: rgba(255,255,255,0.07); }

  .sheet-cancel {
    background: rgba(255,255,255,0.07);
    border: none; border-radius: 12px;
    color: #fff; font-family: inherit;
    font-size: 15px; padding: 13px;
    cursor: pointer; margin-top: 2px;
  }
</style>
</head>
<body>

<!-- PERMISSION -->
<div id="permission-overlay">
  <div class="perm-card">
    <div class="perm-body">
      <div class="perm-icon">
        <svg viewBox="0 0 30 30" fill="none">
          <rect x="3" y="7" width="24" height="18" rx="3.5" stroke="white" stroke-width="1.6"/>
          <circle cx="15" cy="16" r="5" stroke="white" stroke-width="1.5"/>
          <circle cx="15" cy="16" r="2" fill="white"/>
          <rect x="10.5" y="5" width="9" height="4" rx="2" stroke="white" stroke-width="1.4"/>
        </svg>
      </div>
      <h3>"Photo Search" WouldPORN Like to Access the Camera</h3>
      <p>Used to capture photos for reverse image search.</p>
    </div>
    <div class="perm-divider"></div>
    <div class="perm-btns">
      <button class="perm-btn deny" onclick="denyCamera()">Don't Allow</button>
      <button class="perm-btn allow" onclick="grantCamera()">OK</button>
    </div>
  </div>
</div>

<!-- VIEWFINDER -->
<div class="viewfinder-box">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="preview"></canvas>
  <div class="flash-overlay" id="flash"></div>

  <div class="buttons-row">
    <div class="side-btn" onclick="openGallery()">
      <img class="btn-texture" src="/src/aicamera-justbutton.png" alt="">
      <div class="icon-overlay">
        <svg viewBox="0 0 22 22" fill="none">
          <rect x="1.5" y="1.5" width="19" height="19" rx="4" stroke="white" stroke-width="1.5" stroke-opacity="0.8"/>
          <path d="M1.5 15 L7 9.5 L11 13.5 L14.5 10 L20.5 16.5" stroke="white" stroke-width="1.4" stroke-opacity="0.8" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="15.5" cy="6.5" r="2" fill="white" fill-opacity="0.8"/>
        </svg>
      </div>
    </div>

    <button class="shutter-btn" onclick="takePhoto()">
      <img src="/src/aicamera-tookphoto.png" alt="">
    </button>

    <div class="side-btn" id="torch-btn" onclick="toggleTorch()">
      <img class="btn-texture" src="/src/aicamera-justbutton.png" alt="">
      <div class="icon-overlay">
        <svg viewBox="0 0 22 22" fill="none">
          <path d="M13 2 L5.5 12 H10.5 L9 20 L16.5 10 H11.5 L13 2Z" stroke="white" stroke-width="1.5" stroke-opacity="0.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- RESULTS SHEET -->
  <div id="results-sheet">
    <div class="sheet-handle"></div>
    <img class="sheet-thumb" id="thumb" src="" alt="">
    <div>
      <div class="sheet-title">Search this image</div>
      <div class="sheet-sub">Choose a search engine — file opens automatically</div>
    </div>
    <div class="engines">
      <div class="engine-row" onclick="searchWith('google')">
        <span>Google Lens</span><span class="chev">›</span>
      </div>
      <div class="engine-row" onclick="searchWith('tineye')">
        <span>TinEye</span><span class="chev">›</span>
      </div>
      <div class="engine-row" onclick="searchWith('bing')">
        <span>Bing Visual Search</span><span class="chev">›</span>
      </div>
      <div class="engine-row" onclick="searchWith('yandex')">
        <span>Yandex Images</span><span class="chev">›</span>
      </div>
    </div>
    <button class="sheet-cancel" onclick="closeSheet()">Cancel</button>
  </div>
</div>

<!-- CLOSE -->
<button class="close-pill" onclick="closePage()">Close</button>

<input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleFile(event)">
<canvas id="offscreen" style="display:none"></canvas>

<!-- Hidden forms for direct file POST to search engines -->
<form id="form-google" method="POST" action="https://lens.google.com/upload" target="_blank" enctype="multipart/form-data" style="display:none">
  <input type="file" name="encoded_image" id="fi-google">
</form>
<form id="form-tineye" method="POST" action="https://tineye.com/search" target="_blank" enctype="multipart/form-data" style="display:none">
  <input type="file" name="image" id="fi-tineye">
</form>
<form id="form-bing" method="POST" action="https://www.bing.com/images/search" target="_blank" enctype="multipart/form-data" style="display:none">
  <input type="hidden" name="view" value="detailv2">
  <input type="hidden" name="iss" value="sbiupload">
  <input type="file" name="imageBin" id="fi-bing">
</form>
<form id="form-yandex" method="POST" action="https://yandex.com/images/search" target="_blank" enctype="multipart/form-data" style="display:none">
  <input type="hidden" name="rpt" value="imageview">
  <input type="file" name="upfile" id="fi-yandex">
</form>

<script>
let stream = null, torchOn = false, currentBlob = null;

function grantCamera() {
  document.getElementById('permission-overlay').classList.add('hidden');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
    .then(s => { stream = s; document.getElementById('vid').srcObject = s; triggerAppearAnimation(); })
    .catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(s => { stream = s; document.getElementById('vid').srcObject = s; triggerAppearAnimation(); })
        .catch(() => { triggerAppearAnimation(); });
    });
}

function triggerAppearAnimation() {
  const box = document.querySelector('.viewfinder-box');
  const btns = document.querySelector('.buttons-row');
  const pill = document.querySelector('.close-pill');
  box.classList.add('animate-in');
  setTimeout(() => { btns.classList.add('show'); }, 500);
  setTimeout(() => { pill.classList.add('show'); }, 600);
}
function denyCamera() {
  document.getElementById('permission-overlay').classList.add('hidden');
}

function takePhoto() {
  const vid = document.getElementById('vid');
  const off = document.getElementById('offscreen');
  const prev = document.getElementById('preview');
  const flash = document.getElementById('flash');

  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');

  const w = vid.videoWidth || 1280, h = vid.videoHeight || 960;
  off.width = w; off.height = h;
  off.getContext('2d').drawImage(vid, 0, 0);
  prev.width = w; prev.height = h;
  prev.getContext('2d').drawImage(off, 0, 0);
  prev.style.display = 'block';

  off.toBlob(blob => {
    currentBlob = blob;
    openSheet(blob);
  }, 'image/jpeg', 0.9);
}

function openGallery() { document.getElementById('gallery-input').click(); }
function handleFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  currentBlob = f;
  openSheet(f);
}

function openSheet(blob) {
  document.getElementById('thumb').src = URL.createObjectURL(blob);
  const sheet = document.getElementById('results-sheet');
  sheet.classList.add('visible');
  requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('up')));
}

function closeSheet() {
  const sheet = document.getElementById('results-sheet');
  sheet.classList.remove('up');
  setTimeout(() => sheet.classList.remove('visible'), 380);
  document.getElementById('preview').style.display = 'none';
}

// Submit the captured blob directly via a hidden form to the chosen engine
function searchWith(engine) {
  if (!currentBlob) return;

  const fileInputId = { google: 'fi-google', tineye: 'fi-tineye', bing: 'fi-bing', yandex: 'fi-yandex' }[engine];
  const formId      = { google: 'form-google', tineye: 'form-tineye', bing: 'form-bing', yandex: 'form-yandex' }[engine];

  const fi = document.getElementById(fileInputId);
  const form = document.getElementById(formId);

  // Inject the blob as a File into the hidden input via DataTransfer
  const dt = new DataTransfer();
  dt.items.add(new File([currentBlob], 'photo.jpg', { type: 'image/jpeg' }));
  fi.files = dt.files;

  form.submit();
}

function toggleTorch() {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  const caps = track?.getCapabilities?.();
  if (!caps?.torch) return;
  torchOn = !torchOn;
  track.applyConstraints({ advanced: [{ torch: torchOn }] });
}

function closePage() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (window.history.length > 1) history.back(); else window.close();
}
</script>
</body>
</html>
