<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Search</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    gap: 20px;
  }

  /* ── PERMISSION OVERLAY ── */
  #permission-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
  }
  #permission-overlay.hidden { display: none; }

  .perm-card {
    background: rgba(28,28,30,0.95);
    border-radius: 14px;
    width: 270px;
    overflow: hidden;
    text-align: center;
  }
  .perm-body { padding: 20px 16px 4px; }
  .perm-icon {
    width: 56px; height: 56px;
    background: #1c1c1e;
    border-radius: 14px;
    margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .perm-icon svg { width: 30px; height: 30px; }
  .perm-card h3 { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 6px; }
  .perm-card p { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.4; margin-bottom: 16px; }
  .perm-divider { height: 1px; background: rgba(255,255,255,0.1); }
  .perm-btns { display: flex; }
  .perm-btn {
    flex: 1; padding: 14px 0;
    background: none; border: none;
    font-family: inherit; font-size: 17px;
    cursor: pointer;
    color: #0a84ff;
  }
  .perm-btn.deny { color: #0a84ff; border-right: 1px solid rgba(255,255,255,0.1); font-weight: 400; }
  .perm-btn.allow { font-weight: 600; }

  /* ── VIEWFINDER BOX ── */
  .viewfinder-box {
    position: relative;
    width: 340px;
    height: 680px;
    border-radius: 44px;
    overflow: hidden;
    background: #111;
  }

  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  canvas#preview {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }

  /* ── BUTTONS ROW (inside viewfinder, bottom) ── */
  .buttons-row {
    position: absolute;
    bottom: 36px;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }

  /* side buttons: img from /src + icon overlay */
  .side-btn {
    position: relative;
    width: 56px; height: 56px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .side-btn img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .side-btn .icon-overlay {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .side-btn .icon-overlay svg {
    width: 22px; height: 22px;
  }

  /* main shutter */
  .shutter-btn {
    width: 80px; height: 80px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    padding: 0; background: none; border: none;
  }
  .shutter-btn img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .shutter-btn:active { transform: scale(0.96); }
  .side-btn:active { transform: scale(0.93); }

  /* ── CLOSE PILL ── */
  .close-pill {
    background: rgba(28,28,28,0.92);
    border: none;
    border-radius: 30px;
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    font-weight: 400;
    padding: 12px 56px;
    cursor: pointer;
    letter-spacing: -0.2px;
  }

  /* ── FLASH ── */
  .flash {
    position: absolute; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    border-radius: 44px;
  }
  .flash.go { animation: flashAnim 0.3s ease-out forwards; }
  @keyframes flashAnim {
    0% { opacity: 0.85; }
    100% { opacity: 0; }
  }

  /* ── RESULTS SHEET ── */
  #results-sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(18,18,18,0.97);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 20px 20px 44px 44px;
    padding: 16px 20px 40px;
    display: none;
    flex-direction: column;
    gap: 12px;
    z-index: 20;
  }
  #results-sheet.show { display: flex; }

  .sheet-handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    margin: 0 auto 8px;
  }
  .sheet-thumb {
    width: 100%; height: 120px;
    border-radius: 12px;
    object-fit: cover;
    background: #222;
  }
  .sheet-title {
    font-size: 13px; font-weight: 600; color: #fff;
    letter-spacing: -0.1px;
  }
  .sheet-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .65s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255,255,255,0.45); }

  .engines { display: flex; flex-direction: column; gap: 1px; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.06); }
  .engine-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px;
    text-decoration: none; color: #fff;
    font-size: 15px; font-weight: 400;
    background: rgba(255,255,255,0.03);
    transition: background .1s;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .engine-row:last-child { border-bottom: none; }
  .engine-row:active { background: rgba(255,255,255,0.08); }
  .engine-row span { flex: 1; }
  .engine-row .chevron { color: rgba(255,255,255,0.25); font-size: 12px; }

  .sheet-close {
    background: rgba(255,255,255,0.08);
    border: none; border-radius: 10px;
    color: #fff; font-family: inherit;
    font-size: 15px; padding: 13px;
    cursor: pointer; margin-top: 4px;
  }
</style>
</head>
<body>

<!-- PERMISSION -->
<div id="permission-overlay">
  <div class="perm-card">
    <div class="perm-body">
      <div class="perm-icon">
        <svg viewBox="0 0 30 30" fill="none">
          <rect x="3" y="7" width="24" height="18" rx="3.5" stroke="white" stroke-width="1.6"/>
          <circle cx="15" cy="16" r="5" stroke="white" stroke-width="1.5"/>
          <circle cx="15" cy="16" r="2" fill="white"/>
          <rect x="10.5" y="5" width="9" height="4" rx="2" stroke="white" stroke-width="1.4"/>
        </svg>
      </div>
      <h3>"Photo Search" Would Like to<br>Access the Camera</h3>
      <p>Used to capture photos for reverse image search.</p>
    </div>
    <div class="perm-divider"></div>
    <div class="perm-btns">
      <button class="perm-btn deny" onclick="denyCamera()">Don't Allow</button>
      <button class="perm-btn allow" onclick="grantCamera()">OK</button>
    </div>
  </div>
</div>

<!-- VIEWFINDER BOX -->
<div class="viewfinder-box">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="preview"></canvas>
  <div class="flash" id="flash"></div>

  <div class="buttons-row">
    <!-- Left side btn: gallery -->
    <div class="side-btn" onclick="openGallery()">
      <img src="/src/aicamera-justbutton.png" alt="">
      <div class="icon-overlay">
        <svg viewBox="0 0 22 22" fill="none">
          <rect x="1.5" y="1.5" width="19" height="19" rx="4" stroke="white" stroke-width="1.5" stroke-opacity="0.85"/>
          <path d="M1.5 14.5 L6.5 9.5 L10.5 13.5 L14 10 L20.5 16.5" stroke="white" stroke-width="1.4" stroke-opacity="0.85" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="15" cy="6.5" r="2" fill="white" fill-opacity="0.85"/>
        </svg>
      </div>
    </div>

    <!-- Center shutter -->
    <button class="shutter-btn" onclick="takePhoto()">
      <img src="/src/aicamera-tookphoto.png" alt="">
    </button>

    <!-- Right side btn: flash/torch -->
    <div class="side-btn" onclick="toggleFlash()" id="flash-side">
      <img src="/src/aicamera-justbutton.png" alt="">
      <div class="icon-overlay">
        <svg viewBox="0 0 22 22" fill="none">
          <path d="M13 2 L6 12 H11 L9 20 L16 10 H11 L13 2Z" stroke="white" stroke-width="1.5" stroke-opacity="0.85" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- RESULTS SHEET -->
  <div id="results-sheet">
    <div class="sheet-handle"></div>
    <img class="sheet-thumb" id="thumb" src="" alt="">
    <div>
      <div class="sheet-title">Search this image</div>
      <div class="sheet-sub" id="sheet-sub">Uploading…</div>
    </div>
    <div class="loading-row" id="loading-row"><div class="spinner"></div> Uploading image…</div>
    <div class="engines" id="engines" style="display:none">
      <a class="engine-row" id="l-google" href="#" target="_blank">
        <span>Google Lens</span><span class="chevron">›</span>
      </a>
      <a class="engine-row" id="l-tineye" href="#" target="_blank">
        <span>TinEye</span><span class="chevron">›</span>
      </a>
      <a class="engine-row" id="l-bing" href="#" target="_blank">
        <span>Bing Visual Search</span><span class="chevron">›</span>
      </a>
      <a class="engine-row" id="l-yandex" href="#" target="_blank">
        <span>Yandex Images</span><span class="chevron">›</span>
      </a>
    </div>
    <div id="err-row" style="display:none; font-size:13px; color:rgba(255,100,100,0.8);">Upload failed. Check connection.</div>
    <button class="sheet-close" onclick="closeSheet()">Cancel</button>
  </div>
</div>

<!-- CLOSE PILL -->
<button class="close-pill" onclick="closePage()">Close</button>

<input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleFile(event)">
<canvas id="offscreen" style="display:none"></canvas>

<script>
let stream = null, torchOn = false;

function grantCamera() {
  document.getElementById('permission-overlay').classList.add('hidden');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then(s => { stream = s; document.getElementById('vid').srcObject = s; })
    .catch(() => navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(s => { stream = s; document.getElementById('vid').srcObject = s; }));
}
function denyCamera() {
  document.getElementById('permission-overlay').classList.add('hidden');
}

function takePhoto() {
  const vid = document.getElementById('vid');
  const off = document.getElementById('offscreen');
  const prev = document.getElementById('preview');
  const flash = document.getElementById('flash');

  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');

  off.width = vid.videoWidth || 1280;
  off.height = vid.videoHeight || 960;
  off.getContext('2d').drawImage(vid, 0, 0);

  prev.width = off.width; prev.height = off.height;
  prev.getContext('2d').drawImage(off, 0, 0);
  prev.style.display = 'block';

  off.toBlob(blob => openSheet(blob), 'image/jpeg', 0.9);
}

function openGallery() { document.getElementById('gallery-input').click(); }
function handleFile(e) { const f = e.target.files[0]; if (f) openSheet(f); }

function openSheet(blob) {
  const sheet = document.getElementById('results-sheet');
  const thumb = document.getElementById('thumb');
  const loadingRow = document.getElementById('loading-row');
  const engines = document.getElementById('engines');
  const errRow = document.getElementById('err-row');
  const sub = document.getElementById('sheet-sub');

  thumb.src = URL.createObjectURL(blob);
  loadingRow.style.display = 'flex';
  engines.style.display = 'none';
  errRow.style.display = 'none';
  sub.textContent = 'Uploading…';
  sheet.classList.add('show');

  const fd = new FormData();
  fd.append('image', blob);
  fd.append('expiration', '600');

  fetch('https://api.imgbb.com/1/upload?key=2b98a5ad499ebbc8c75b8c19d6d48f50', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(data => {
      const url = data?.data?.url;
      if (!url) throw new Error();
      const enc = encodeURIComponent(url);
      document.getElementById('l-google').href = `https://lens.google.com/uploadbyurl?url=${enc}`;
      document.getElementById('l-tineye').href = `https://tineye.com/search?url=${enc}`;
      document.getElementById('l-bing').href   = `https://www.bing.com/images/searchbyimage?imgurl=${enc}`;
      document.getElementById('l-yandex').href = `https://yandex.com/images/search?rpt=imageview&url=${enc}`;
      loadingRow.style.display = 'none';
      engines.style.display = 'flex';
      sub.textContent = 'Choose a search engine';
    })
    .catch(() => {
      loadingRow.style.display = 'none';
      errRow.style.display = 'block';
      sub.textContent = 'Upload failed';
    });
}

function closeSheet() {
  document.getElementById('results-sheet').classList.remove('show');
  document.getElementById('preview').style.display = 'none';
}

function toggleFlash() {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  const caps = track?.getCapabilities?.();
  if (!caps?.torch) return;
  torchOn = !torchOn;
  track.applyConstraints({ advanced: [{ torch: torchOn }] });
}

function closePage() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (window.history.length > 1) history.back(); else window.close();
}
</script>
</body>
</html>
