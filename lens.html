<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поиск по фото</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    gap: 18px;
    overflow: hidden;
  }

  /* ── VIEWFINDER BOX ── */
  .viewfinder-box {
    position: relative;
    width: 380px;
    height: 680px;
    border-radius: 52px;
    overflow: hidden;
    background: #000;
    opacity: 0;
    transform: scale(0.28) translateY(160px);
    will-change: transform, opacity;
  }
  .viewfinder-box.animate-in {
    animation: boxIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .viewfinder-box.animate-out {
    animation: boxOut 0.55s cubic-bezier(0.4, 0, 1, 1) forwards;
  }
  @keyframes boxIn {
    0%   { opacity: 0; transform: scale(0.28) translateY(160px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes boxOut {
    0%   { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(0.28) translateY(160px); }
  }

  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    /* kill any browser default controls overlay */
    pointer-events: none;
  }
  video::-webkit-media-controls { display: none !important; }
  video::-webkit-media-controls-enclosure { display: none !important; }
  video::-webkit-media-controls-panel { display: none !important; }
  video::--webkit-media-controls-play-button { display: none !important; }

  canvas#preview {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }

  /* ── BUTTONS ROW ── */
  .buttons-row {
    position: absolute;
    bottom: 40px; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .buttons-row.show {
    opacity: 1;
    transform: scale(1);
  }
  .buttons-row.hide {
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.4, 0, 1, 1);
  }

  .side-btn {
    position: relative;
    width: 60px; height: 60px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .side-btn img.btn-texture {
    width: 100%; height: 100%;
    object-fit: contain; display: block;
  }
  .side-btn .icon-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .side-btn .icon-overlay svg { width: 24px; height: 24px; }
  .side-btn:active { transform: scale(0.9); transition: transform .1s; }

  .shutter-btn {
    width: 88px; height: 88px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    padding: 0; background: none; border: none;
    user-select: none;
  }
  .shutter-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .shutter-btn:active { transform: scale(0.93); transition: transform .1s; }

  /* ── FLASH ── */
  .flash-overlay {
    position: absolute; inset: 0;
    background: #fff; opacity: 0;
    pointer-events: none; z-index: 10;
  }
  .flash-overlay.go { animation: flashGo 0.3s ease-out forwards; }
  @keyframes flashGo { 0% { opacity: 0.9; } 100% { opacity: 0; } }

  /* ── CLOSE PILL ── */
  .close-pill {
    background: rgba(26,26,26,0.92);
    border: none; border-radius: 30px;
    color: #fff; font-family: inherit;
    font-size: 17px; font-weight: 400;
    padding: 13px 60px; cursor: pointer;
    letter-spacing: -0.1px;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .close-pill.show { opacity: 1; transform: scale(1); }
  .close-pill.hide {
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  /* ── RESULTS SHEET ── */
  #results-sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(14,14,14,0.97);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 24px 24px 52px 52px;
    padding: 14px 18px 40px;
    display: none;
    flex-direction: column;
    gap: 12px;
    z-index: 20;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #results-sheet.visible { display: flex; }
  #results-sheet.up { transform: translateY(0); }

  .sheet-handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.18);
    border-radius: 2px; margin: 0 auto 4px;
  }
  .sheet-thumb {
    width: 100%; height: 120px;
    border-radius: 14px; object-fit: cover;
    background: #222;
  }
  .sheet-title { font-size: 15px; font-weight: 600; color: #fff; }
  .sheet-sub   { font-size: 12px; color: rgba(255,255,255,0.38); margin-top: 2px; }

  .engines {
    display: flex; flex-direction: column;
    border-radius: 14px; overflow: hidden;
    background: rgba(255,255,255,0.05);
  }
  .engine-row {
    display: flex; align-items: center;
    padding: 14px 16px;
    color: #fff; font-size: 16px; font-weight: 400;
    border-bottom: 0.5px solid rgba(255,255,255,0.07);
    cursor: pointer; user-select: none;
    transition: background .1s;
  }
  .engine-row:last-child { border-bottom: none; }
  .engine-row span { flex: 1; }
  .engine-row .chev { color: rgba(255,255,255,0.2); font-size: 14px; }
  .engine-row:active { background: rgba(255,255,255,0.07); }

  .sheet-cancel {
    background: rgba(255,255,255,0.07);
    border: none; border-radius: 14px;
    color: #fff; font-family: inherit;
    font-size: 16px; padding: 14px;
    cursor: pointer; margin-top: 2px;
  }
</style>
</head>
<body>

<div class="viewfinder-box" id="vbox">
  <video id="vid" autoplay playsinline muted disablepictureinpicture></video>
  <canvas id="preview"></canvas>
  <div class="flash-overlay" id="flash"></div>

  <div class="buttons-row" id="btns">
    <div class="side-btn" onclick="openGallery()">
      <img class="btn-texture" src="/src/aicamera-justbutton.png" alt="">
      <div class="icon-overlay">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="1.5" y="1.5" width="21" height="21" rx="4.5" stroke="white" stroke-width="1.5" stroke-opacity="0.85"/>
          <path d="M1.5 16.5 L7.5 10.5 L12 15 L16 11 L22.5 18" stroke="white" stroke-width="1.4" stroke-opacity="0.85" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="16.5" cy="7" r="2.2" fill="white" fill-opacity="0.85"/>
        </svg>
      </div>
    </div>

    <button class="shutter-btn" onclick="takePhoto()">
      <img src="/src/aicamera-tookphoto.png" alt="">
    </button>

    <div class="side-btn" onclick="toggleTorch()">
      <img class="btn-texture" src="/src/aicamera-justbutton.png" alt="">
      <div class="icon-overlay">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M14 2 L6 13 H12 L10 22 L18 11 H12 L14 2Z" stroke="white" stroke-width="1.5" stroke-opacity="0.85" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <div id="results-sheet">
    <div class="sheet-handle"></div>
    <img class="sheet-thumb" id="thumb" src="" alt="">
    <div>
      <div class="sheet-title">Поиск по изображению</div>
      <div class="sheet-sub">Выберите поисковик</div>
    </div>
    <div class="engines">
      <div class="engine-row" onclick="searchWith('google')"><span>Google Lens</span><span class="chev">›</span></div>
      <div class="engine-row" onclick="searchWith('tineye')"><span>TinEye</span><span class="chev">›</span></div>
      <div class="engine-row" onclick="searchWith('bing')"><span>Bing Visual Search</span><span class="chev">›</span></div>
      <div class="engine-row" onclick="searchWith('yandex')"><span>Яндекс Картинки</span><span class="chev">›</span></div>
    </div>
    <button class="sheet-cancel" onclick="closeSheet()">Отмена</button>
  </div>
</div>

<button class="close-pill" id="pill" onclick="closePage()">Закрыть</button>

<input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleFile(event)">
<canvas id="offscreen" style="display:none"></canvas>

<form id="form-google" method="POST" action="https://lens.google.com/upload" target="_blank" enctype="multipart/form-data" style="display:none">
  <input type="file" name="encoded_image" id="fi-google">
</form>
<form id="form-tineye" method="POST" action="https://tineye.com/search" target="_blank" enctype="multipart/form-data" style="display:none">
  <input type="file" name="image" id="fi-tineye">
</form>
<form id="form-bing" method="POST" action="https://www.bing.com/images/search" target="_blank" enctype="multipart/form-data" style="display:none">
  <input type="hidden" name="view" value="detailv2">
  <input type="hidden" name="iss" value="sbiupload">
  <input type="file" name="imageBin" id="fi-bing">
</form>
<form id="form-yandex" method="POST" action="https://yandex.com/images/search" target="_blank" enctype="multipart/form-data" style="display:none">
  <input type="hidden" name="rpt" value="imageview">
  <input type="file" name="upfile" id="fi-yandex">
</form>

<script>
let stream = null, torchOn = false, currentBlob = null;

(async function init() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } },
      audio: false
    });
  } catch {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    } catch { return; }
  }

  const vid = document.getElementById('vid');
  vid.srcObject = stream;

  // Force-remove any controls the browser might inject
  vid.controls = false;
  vid.removeAttribute('controls');

  vid.oncanplay = () => {
    vid.oncanplay = null;
    // ensure playing
    vid.play().catch(() => {});
    startAnimation();
  };
  setTimeout(() => {
    if (!document.getElementById('vbox').classList.contains('animate-in')) {
      vid.play().catch(() => {});
      startAnimation();
    }
  }, 900);
})();

function startAnimation() {
  const box  = document.getElementById('vbox');
  const btns = document.getElementById('btns');
  const pill = document.getElementById('pill');
  box.classList.add('animate-in');
  setTimeout(() => btns.classList.add('show'), 520);
  setTimeout(() => pill.classList.add('show'), 620);
}

function closePage() {
  const box  = document.getElementById('vbox');
  const btns = document.getElementById('btns');
  const pill = document.getElementById('pill');

  // hide buttons and pill first
  btns.classList.remove('show');
  btns.classList.add('hide');
  pill.classList.remove('show');
  pill.classList.add('hide');

  // slight delay then animate box out
  setTimeout(() => {
    box.classList.remove('animate-in');
    box.classList.add('animate-out');
  }, 80);

  // stop camera and navigate
  setTimeout(() => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    window.location.href = '/index.html';
  }, 650);
}

function takePhoto() {
  const vid   = document.getElementById('vid');
  const off   = document.getElementById('offscreen');
  const prev  = document.getElementById('preview');
  const flash = document.getElementById('flash');

  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');

  const w = vid.videoWidth || 1280, h = vid.videoHeight || 960;
  off.width = w; off.height = h;
  off.getContext('2d').drawImage(vid, 0, 0);
  prev.width = w; prev.height = h;
  prev.getContext('2d').drawImage(off, 0, 0);
  prev.style.display = 'block';

  off.toBlob(blob => { currentBlob = blob; openSheet(blob); }, 'image/jpeg', 0.9);
}

function openGallery() { document.getElementById('gallery-input').click(); }
function handleFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  currentBlob = f;
  openSheet(f);
}

function openSheet(blob) {
  document.getElementById('thumb').src = URL.createObjectURL(blob);
  const sheet = document.getElementById('results-sheet');
  sheet.classList.add('visible');
  requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('up')));
}

function closeSheet() {
  const sheet = document.getElementById('results-sheet');
  sheet.classList.remove('up');
  setTimeout(() => sheet.classList.remove('visible'), 400);
  document.getElementById('preview').style.display = 'none';
}

function searchWith(engine) {
  if (!currentBlob) return;
  const ids   = { google: 'fi-google', tineye: 'fi-tineye', bing: 'fi-bing', yandex: 'fi-yandex' };
  const forms = { google: 'form-google', tineye: 'form-tineye', bing: 'form-bing', yandex: 'form-yandex' };
  const fi   = document.getElementById(ids[engine]);
  const form = document.getElementById(forms[engine]);
  const dt = new DataTransfer();
  dt.items.add(new File([currentBlob], 'photo.jpg', { type: 'image/jpeg' }));
  fi.files = dt.files;
  form.submit();
}

function toggleTorch() {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  const caps  = track?.getCapabilities?.();
  if (!caps?.torch) return;
  torchOn = !torchOn;
  track.applyConstraints({ advanced: [{ torch: torchOn }] });
}
</script>
</body>
</html>
