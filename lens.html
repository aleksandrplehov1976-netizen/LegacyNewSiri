<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Search</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    gap: 20px;
    overflow: hidden;
  }

  /* ── PERMISSION ── */
  #permission-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
  }
  #permission-overlay.hidden { display: none; }

  .perm-card {
    background: rgba(30,30,32,0.97);
    border-radius: 14px;
    width: 270px;
    overflow: hidden;
  }
  .perm-body { padding: 20px 16px 4px; text-align: center; }
  .perm-icon {
    width: 56px; height: 56px;
    background: rgba(255,255,255,0.07);
    border-radius: 14px;
    margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .perm-icon svg { width: 30px; height: 30px; }
  .perm-card h3 { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 6px; line-height: 1.4; }
  .perm-card p  { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.4; margin-bottom: 16px; }
  .perm-divider { height: 0.5px; background: rgba(255,255,255,0.15); }
  .perm-btns { display: flex; }
  .perm-btn {
    flex: 1; padding: 14px 0;
    background: none; border: none;
    font-family: inherit; font-size: 17px;
    cursor: pointer; color: #0a84ff;
  }
  .perm-btn.deny { border-right: 0.5px solid rgba(255,255,255,0.15); font-weight: 400; }
  .perm-btn.allow { font-weight: 600; }

  /* ── VIEWFINDER BOX ── */
  .viewfinder-box {
    position: relative;
    width: 340px;
    height: 680px;
    border-radius: 44px;
    overflow: hidden;
    background: #111;

    /* start state: slightly zoomed out, invisible */
    opacity: 0;
    transform: scale(0.88);
    animation: zoomFadeIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
  }

  @keyframes zoomFadeIn {
    to { opacity: 1; transform: scale(1); }
  }

  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  canvas#preview {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }

  /* ── BUTTONS ROW ── */
  .buttons-row {
    position: absolute;
    bottom: 36px;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;

    opacity: 0;
    animation: fadeInBtns 0.4s ease 0.55s forwards;
  }
  @keyframes fadeInBtns {
    to { opacity: 1; }
  }

  .side-btn {
    position: relative;
    width: 56px; height: 56px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .side-btn img.btn-texture {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }
  .side-btn .icon-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .side-btn .icon-overlay svg { width: 22px; height: 22px; }
  .side-btn:active { transform: scale(0.92); transition: transform .1s; }

  .shutter-btn {
    width: 80px; height: 80px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    padding: 0; background: none; border: none;
    user-select: none;
  }
  .shutter-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .shutter-btn:active { transform: scale(0.94); transition: transform .1s; }

  /* ── FLASH ── */
  .flash-overlay {
    position: absolute; inset: 0;
    background: #fff; opacity: 0;
    pointer-events: none; z-index: 10;
  }
  .flash-overlay.go { animation: flashGo 0.3s ease-out forwards; }
  @keyframes flashGo { 0% { opacity: 0.9; } 100% { opacity: 0; } }

  /* ── CLOSE PILL ── */
  .close-pill {
    background: rgba(26,26,26,0.92);
    border: none; border-radius: 30px;
    color: #fff; font-family: inherit;
    font-size: 17px; font-weight: 400;
    padding: 12px 56px; cursor: pointer;
    letter-spacing: -0.2px;

    opacity: 0;
    animation: fadeInBtns 0.4s ease 0.65s forwards;
  }

  /* ── RESULTS SHEET ── */
  #results-sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(16,16,16,0.97);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 20px 20px 44px 44px;
    padding: 14px 18px 36px;
    display: none;
    flex-direction: column;
    gap: 12px;
    z-index: 20;
    transform: translateY(100%);
    transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #results-sheet.show {
    display: flex;
    transform: translateY(0);
  }
  /* force display before transition kicks in */
  #results-sheet.animating { display: flex; }

  .sheet-handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.18);
    border-radius: 2px; margin: 0 auto 4px;
  }
  .sheet-thumb {
    width: 100%; height: 110px;
    border-radius: 12px; object-fit: cover;
    background: #222;
  }
  .sheet-title { font-size: 14px; font-weight: 600; color: #fff; }
  .sheet-sub   { font-size: 12px; color: rgba(255,255,255,0.38); margin-top: 2px; }

  .spinner {
    width: 16px; height: 16px; flex-shrink: 0;
    border: 1.8px solid rgba(255,255,255,0.15);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: rgba(255,255,255,0.4);
  }

  .engines {
    display: flex; flex-direction: column; gap: 0;
    border-radius: 12px; overflow: hidden;
    background: rgba(255,255,255,0.05);
  }
  .engine-row {
    display: flex; align-items: center;
    padding: 13px 14px;
    text-decoration: none; color: #fff;
    font-size: 15px; font-weight: 400;
    border-bottom: 0.5px solid rgba(255,255,255,0.07);
    transition: background .1s;
  }
  .engine-row:last-child { border-bottom: none; }
  .engine-row span { flex: 1; }
  .engine-row .chev { color: rgba(255,255,255,0.22); font-size: 13px; }
  .engine-row:active { background: rgba(255,255,255,0.07); }

  .sheet-cancel {
    background: rgba(255,255,255,0.07);
    border: none; border-radius: 12px;
    color: #fff; font-family: inherit;
    font-size: 15px; padding: 13px;
    cursor: pointer; margin-top: 2px;
  }
  .err-text { font-size: 13px; color: rgba(255,80,80,0.85); }
</style>
</head>
<body>

<!-- PERMISSION -->
<div id="permission-overlay">
  <div class="perm-card">
    <div class="perm-body">
      <div class="perm-icon">
        <svg viewBox="0 0 30 30" fill="none">
          <rect x="3" y="7" width="24" height="18" rx="3.5" stroke="white" stroke-width="1.6"/>
          <circle cx="15" cy="16" r="5" stroke="white" stroke-width="1.5"/>
          <circle cx="15" cy="16" r="2" fill="white"/>
          <rect x="10.5" y="5" width="9" height="4" rx="2" stroke="white" stroke-width="1.4"/>
        </svg>
      </div>
      <h3>"Photo Search" Would Like to Access the Camera</h3>
      <p>Used to capture photos for reverse image search.</p>
    </div>
    <div class="perm-divider"></div>
    <div class="perm-btns">
      <button class="perm-btn deny" onclick="denyCamera()">Don't Allow</button>
      <button class="perm-btn allow" onclick="grantCamera()">OK</button>
    </div>
  </div>
</div>

<!-- VIEWFINDER -->
<div class="viewfinder-box">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="preview"></canvas>
  <div class="flash-overlay" id="flash"></div>

  <div class="buttons-row">
    <!-- Gallery -->
    <div class="side-btn" onclick="openGallery()">
      <img class="btn-texture" src="/src/aicamera-justbutton.png" alt="">
      <div class="icon-overlay">
        <svg viewBox="0 0 22 22" fill="none">
          <rect x="1.5" y="1.5" width="19" height="19" rx="4" stroke="white" stroke-width="1.5" stroke-opacity="0.8"/>
          <path d="M1.5 15 L7 9.5 L11 13.5 L14.5 10 L20.5 16.5" stroke="white" stroke-width="1.4" stroke-opacity="0.8" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="15.5" cy="6.5" r="2" fill="white" fill-opacity="0.8"/>
        </svg>
      </div>
    </div>

    <!-- Shutter -->
    <button class="shutter-btn" onclick="takePhoto()">
      <img src="/src/aicamera-tookphoto.png" alt="">
    </button>

    <!-- Torch -->
    <div class="side-btn" id="torch-btn" onclick="toggleTorch()">
      <img class="btn-texture" src="/src/aicamera-justbutton.png" alt="">
      <div class="icon-overlay">
        <svg viewBox="0 0 22 22" fill="none">
          <path d="M13 2 L5.5 12 H10.5 L9 20 L16.5 10 H11.5 L13 2Z" stroke="white" stroke-width="1.5" stroke-opacity="0.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- RESULTS SHEET -->
  <div id="results-sheet">
    <div class="sheet-handle"></div>
    <img class="sheet-thumb" id="thumb" src="" alt="">
    <div>
      <div class="sheet-title">Search this image</div>
      <div class="sheet-sub" id="sheet-sub">Uploading…</div>
    </div>
    <div class="loading-row" id="loading-row">
      <div class="spinner"></div> Uploading image…
    </div>
    <div class="engines" id="engines" style="display:none">
      <a class="engine-row" id="l-google" href="#" target="_blank" rel="noopener">
        <span>Google Lens</span><span class="chev">›</span>
      </a>
      <a class="engine-row" id="l-tineye" href="#" target="_blank" rel="noopener">
        <span>TinEye</span><span class="chev">›</span>
      </a>
      <a class="engine-row" id="l-bing" href="#" target="_blank" rel="noopener">
        <span>Bing Visual Search</span><span class="chev">›</span>
      </a>
      <a class="engine-row" id="l-yandex" href="#" target="_blank" rel="noopener">
        <span>Yandex Images</span><span class="chev">›</span>
      </a>
    </div>
    <div id="err-row" style="display:none" class="err-text">Upload failed. Check your connection and try again.</div>
    <button class="sheet-cancel" onclick="closeSheet()">Cancel</button>
  </div>
</div>

<!-- CLOSE -->
<button class="close-pill" onclick="closePage()">Close</button>

<input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleFile(event)">
<canvas id="offscreen" style="display:none"></canvas>

<script>
let stream = null, torchOn = false;

// ── CAMERA ──
function grantCamera() {
  document.getElementById('permission-overlay').classList.add('hidden');
  const constraints = { video: { facingMode: { ideal: 'environment' } }, audio: false };
  navigator.mediaDevices.getUserMedia(constraints)
    .then(s => { stream = s; document.getElementById('vid').srcObject = s; })
    .catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(s => { stream = s; document.getElementById('vid').srcObject = s; })
        .catch(() => {});
    });
}
function denyCamera() {
  document.getElementById('permission-overlay').classList.add('hidden');
}

// ── SHUTTER ──
function takePhoto() {
  const vid = document.getElementById('vid');
  const off = document.getElementById('offscreen');
  const prev = document.getElementById('preview');
  const flash = document.getElementById('flash');

  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');

  const w = vid.videoWidth || 1280, h = vid.videoHeight || 960;
  off.width = w; off.height = h;
  off.getContext('2d').drawImage(vid, 0, 0);
  prev.width = w; prev.height = h;
  prev.getContext('2d').drawImage(off, 0, 0);
  prev.style.display = 'block';

  off.toBlob(blob => openSheet(blob), 'image/jpeg', 0.88);
}

function openGallery() { document.getElementById('gallery-input').click(); }
function handleFile(e) { const f = e.target.files[0]; if (f) openSheet(f); }

// ── TORCH ──
function toggleTorch() {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  const caps = track?.getCapabilities?.();
  if (!caps?.torch) return;
  torchOn = !torchOn;
  track.applyConstraints({ advanced: [{ torch: torchOn }] });
}

// ── SHEET ──
function openSheet(blob) {
  const sheet = document.getElementById('results-sheet');
  document.getElementById('thumb').src = URL.createObjectURL(blob);
  document.getElementById('loading-row').style.display = 'flex';
  document.getElementById('engines').style.display = 'none';
  document.getElementById('err-row').style.display = 'none';
  document.getElementById('sheet-sub').textContent = 'Uploading…';

  // animate in
  sheet.classList.add('animating');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { sheet.classList.add('show'); });
  });

  uploadImgur(blob).then(url => {
    if (!url) throw new Error('no url');
    const enc = encodeURIComponent(url);
    document.getElementById('l-google').href = `https://lens.google.com/uploadbyurl?url=${enc}`;
    document.getElementById('l-tineye').href = `https://tineye.com/search?url=${enc}`;
    document.getElementById('l-bing').href   = `https://www.bing.com/images/searchbyimage?imgurl=${enc}`;
    document.getElementById('l-yandex').href = `https://yandex.com/images/search?rpt=imageview&url=${enc}`;
    document.getElementById('loading-row').style.display = 'none';
    document.getElementById('engines').style.display = 'flex';
    document.getElementById('sheet-sub').textContent = 'Choose a search engine';
  }).catch(() => {
    document.getElementById('loading-row').style.display = 'none';
    document.getElementById('err-row').style.display = 'block';
    document.getElementById('sheet-sub').textContent = 'Failed';
  });
}

function closeSheet() {
  const sheet = document.getElementById('results-sheet');
  sheet.classList.remove('show');
  document.getElementById('preview').style.display = 'none';
}

function closePage() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (window.history.length > 1) history.back(); else window.close();
}

// ── UPLOAD: Imgur anonymous (no key required for client-side) ──
async function uploadImgur(blob) {
  // Convert to base64
  const base64 = await blobToBase64(blob);
  const b64data = base64.split(',')[1];

  const fd = new FormData();
  fd.append('image', b64data);
  fd.append('type', 'base64');

  const res = await fetch('https://api.imgur.com/3/image', {
    method: 'POST',
    headers: {
      'Authorization': 'Client-ID 546c25a59c58ad7'  // Imgur public anonymous client ID
    },
    body: fd
  });
  if (!res.ok) throw new Error('imgur fail');
  const data = await res.json();
  if (!data.success) throw new Error('imgur fail');
  return data.data.link;
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
</script>
</body>
</html>
