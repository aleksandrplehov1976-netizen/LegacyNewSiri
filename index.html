<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Siri">
<link rel="apple-touch-icon" href="/yri.png">
<link rel="manifest" href="/manifest.json">
<title>Siri</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

@font-face {
  font-family: 'CustomFont';
  src: url('/1.ttf') format('truetype');
  font-weight: normal; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'AppBold';
  src: url('/bold.otf') format('opentype');
  font-weight: 700; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'AppMono';
  src: url('/mono.ttf') format('opentype');
  font-weight: normal; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'AppBookworm';
  src: url('/bookworm.ttf') format('truetype');
  font-weight: normal; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'AppThin';
  src: url('/thin.otf') format('opentype');
  font-weight: 100; font-style: normal; font-display: swap;
}

html, body {
  height: 100%; width: 100%;
  background: #000;
  font-family: 'CustomFont', -apple-system, 'SF Pro Text', BlinkMacSystemFont, sans-serif;
  color: #fff;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
.bubble-user, .bubble-ai-content, .input-field { user-select: text; -webkit-user-select: text; }

/* ── preloader ── */
#preloader {
  position: fixed; inset: 0; z-index: 10000;
  background: #000; display: flex;
  align-items: center; justify-content: center; pointer-events: none;
}
.logo-preloader {
  width: 80px; height: 80px; margin-top: -12vh;
  opacity: 0; transform: scale(0.72);
  will-change: opacity, transform;
}
.logo-preloader img { width: 100%; height: 100%; border-radius: 20px; object-fit: contain; }

/* Apple HIG spring enter */
.logo-preloader.enter {
  animation: logoSpringIn 0.52s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes logoSpringIn {
  0%   { opacity: 0; transform: scale(0.72); }
  60%  { opacity: 1; transform: scale(1.06); }
  80%  { transform: scale(0.97); }
  100% { opacity: 1; transform: scale(1); }
}
/* Apple HIG exit: fade + gentle zoom out */
.logo-preloader.exit {
  animation: logoFadeOut 0.38s cubic-bezier(0.4, 0, 1, 1) forwards;
}
@keyframes logoFadeOut {
  0%   { opacity: 1; transform: scale(1); filter: blur(0px); }
  100% { opacity: 0; transform: scale(1.18); filter: blur(4px); }
}

/* ── screens ── */
.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: #000;
  opacity: 0; pointer-events: none;
  transition: opacity 0.26s cubic-bezier(0.4, 0, 0.2, 1);
}
.screen.active { opacity: 1; pointer-events: all; }

/* Staggered entrance for home items */
.home-header { animation: none; }
.app-loaded .home-header  { animation: slideUp 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.1) both; animation-delay: 0.05s; }
.app-loaded .cards-grid   { animation: slideUp 0.48s cubic-bezier(0.175, 0.885, 0.32, 1.1) both; animation-delay: 0.12s; }
.app-loaded .home-bottom  { animation: slideUp 0.44s cubic-bezier(0.175, 0.885, 0.32, 1.1) both; animation-delay: 0.18s; }

@keyframes slideUp {
  0%   { opacity: 0; transform: translateY(18px) scale(0.97); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ══ HOME ══ */
#home { display: flex; flex-direction: column; }
.home-header {
  flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 12px;
}
.home-title { font-size: 32px; font-weight: 700; letter-spacing: -0.6px; }
.home-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  padding: 10px 12px 130px;
}
.home-scroll::-webkit-scrollbar { display: none; }
.cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.card {
  position: relative;
  background-image: url('/src/cardtexturefinal.png');
  background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
  aspect-ratio: 1 / 0.9; cursor: pointer;
  display: flex; flex-direction: column; justify-content: flex-end;
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s;
  padding: 14px 12px;
}
.card:active:not(.editing-mode .card) { transform: scale(0.96); opacity: 0.75; }
.card.wobble { animation: wobble 0.10s ease-in-out infinite alternate; }
@keyframes wobble {
  0%   { transform: rotate(-1.5deg) scale(0.97); }
  100% { transform: rotate(1.5deg)  scale(0.97); }
}
.card-delete {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; border-radius: 50%;
  background: url('/src/texture-btnssmall.png') center/100% 100% no-repeat;
  border: none; cursor: pointer;
  display: none; align-items: center; justify-content: center; z-index: 10;
}
.card-delete svg { width: 12px; height: 12px; }
.editing-mode .card-delete { display: flex; }
.card-date { font-size: 12px; color: rgba(255,255,255,0.55); margin-bottom: 4px; }
.card-title { font-size: 14px; font-weight: 600; line-height: 1.3; color: #fff; margin-bottom: 4px; letter-spacing: -0.2px; }
.card-preview { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.35; }

.home-bottom {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  height: 120px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 32px 32px;
  background: linear-gradient(to top, #000 60%, transparent);
  pointer-events: none;
}
.home-bottom button { pointer-events: all; }

/* ══ BUTTONS — Liquid Glass style ══ */
.txbtn {
  border-radius: 1000px;
  background: url('/src/texture-btnssmall.png') center/100% 100% no-repeat;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  box-shadow:
    0 2px 8px rgba(0,0,0,0.55),
    0 6px 24px rgba(0,0,0,0.38),
    0 1px 2px rgba(0,0,0,0.7);
  /* Button frame: only subtle scale, no brightness */
  transition: transform 0.055s cubic-bezier(0.2, 0, 0.3, 1);
  will-change: transform;
}

/* SVG icon inside: dim at rest, brightens on press */
.txbtn svg {
  filter: brightness(0.72);
  transition: filter 0.055s ease, drop-shadow 0.055s ease;
  will-change: filter;
}

/* Press: frame scales up, icon goes full bright + glow */
.txbtn:active {
  transform: scale(1.13);
  transition: transform 0.055s cubic-bezier(0.2, 0, 0.3, 1);
}
.txbtn:active svg {
  filter:
    brightness(1.0)
    drop-shadow(0 0 4px rgba(255,255,255,0.9))
    drop-shadow(0 0 8px rgba(255,255,255,0.5));
  transition: filter 0.04s ease;
}

/* Release — frame returns, icon brightness decays */
.txbtn.releasing {
  animation: btnFrameReturn 0.36s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
.txbtn.releasing svg {
  animation: iconGlowDecay 0.52s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes btnFrameReturn {
  0%   { transform: scale(1.13); }
  100% { transform: scale(1); }
}
@keyframes iconGlowDecay {
  0%   { filter: brightness(1.0) drop-shadow(0 0 4px rgba(255,255,255,0.9)) drop-shadow(0 0 8px rgba(255,255,255,0.5)); }
  35%  { filter: brightness(0.95) drop-shadow(0 0 2px rgba(255,255,255,0.3)); }
  100% { filter: brightness(0.72) drop-shadow(0 0 0px rgba(255,255,255,0)); }
}

.txbtn-sm { width: 44px; height: 44px; }
.txbtn-sm svg { width: 19px; height: 19px; }
.txbtn-md { width: 44px; height: 44px; }
.txbtn-md svg { width: 19px; height: 19px; }
.txbtn-lg { width: 68px; height: 68px; }
.txbtn-lg svg { width: 26px; height: 26px; }

/* ══ SETTINGS ══ */
.settings-overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity 0.38s cubic-bezier(0.4,0,0.2,1);
}
.settings-overlay.open { opacity: 1; pointer-events: all; }
.settings-backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.settings-sheet {
  position: relative; z-index: 1; width: 100%; height: 85vh;
  background: #1a1a1a; border-radius: 28px 28px 0 0; padding: 0 0 48px;
  transform: translateY(100%);
  transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
  display: flex; flex-direction: column; overflow: hidden;
}
.settings-overlay.open .settings-sheet { transform: translateY(0); }
.settings-topbar {
  display: flex; align-items: center; justify-content: center;
  padding: 18px 20px 14px; position: relative; flex-shrink: 0;
}
.settings-heading { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: -0.2px; }
.settings-close { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); }
.settings-body { flex: 1; overflow-y: auto; padding: 6px 16px 20px; scrollbar-width: none; }
.settings-body::-webkit-scrollbar { display: none; }
.settings-section-label { font-size: 13px; color: #888; padding: 16px 4px 8px; }
.settings-group { background: #2c2c2e; border-radius: 16px; overflow: hidden; margin-bottom: 10px; }
.settings-item {
  display: flex; align-items: center; padding: 14px 16px; gap: 12px;
  text-decoration: none; color: #fff;
}
.settings-item + .settings-item { border-top: 1px solid rgba(255,255,255,0.07); }
.settings-item-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.settings-item-icon svg { width: 18px; height: 18px; }
.settings-item-label { font-size: 17px; color: #fff; flex: 1; }
.settings-item-value { font-size: 15px; color: #888; }
.settings-item-chevron svg { width: 14px; height: 14px; }

/* ══ CHAT ══ */
#chat { display: flex; flex-direction: column; overflow: hidden; }

.chat-top-texture {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 56px;
  background: url('/src/texture-always-on-top_onlyonchats_.png') top center / 100% 100% no-repeat;
  z-index: 30;
  pointer-events: none;
  flex-shrink: 0;
}

.tts-bar {
  position: absolute;
  top: 56px; left: 0; right: 0;
  z-index: 9;
  display: none;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
}
.tts-bar.active { display: flex; }

/* Floating back button — no black backing, just shadow */
.chat-header {
  position: absolute;
  top: 8px; left: 12px;
  z-index: 32;
  pointer-events: none;
}
.chat-header button {
  pointer-events: all;
  border-radius: 1000px !important;
  /* Override bg so it's truly floating — uses texture but with strong shadow */
  box-shadow:
    0 3px 12px rgba(0,0,0,0.65),
    0 8px 28px rgba(0,0,0,0.45),
    0 1px 3px rgba(0,0,0,0.8) !important;
}

/* Messages scroll area — the key fix */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  /* padding: top accounts for floating header + texture, bottom for input bar */
  padding: 64px 0 110px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  /* Mask: fade to black at top and bottom */
  -webkit-mask-image: linear-gradient(
    to bottom,
    transparent 0px,
    black 72px,
    black calc(100% - 80px),
    transparent 100%
  );
  mask-image: linear-gradient(
    to bottom,
    transparent 0px,
    black 72px,
    black calc(100% - 80px),
    transparent 100%
  );
}
.chat-messages::-webkit-scrollbar { display: none; }

.chat-input-area {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 10px 14px 36px;
  z-index: 20; pointer-events: none;
  background: linear-gradient(to top, #000 55%, transparent);
}
.chat-input-area .input-row { pointer-events: all; }
.input-row { display: flex; align-items: center; gap: 10px; position: relative; }
.input-bar {
  flex: 1; height: 44px; position: relative;
  display: flex; align-items: center; border-radius: 22px; overflow: hidden;
}
.input-bar-bg {
  position: absolute; inset: 0;
  background: url('/src/texture-enterprompt.png') center/100% 100% no-repeat;
  transition: opacity 0.32s ease;
}
.input-bar-thinking {
  position: absolute; inset: 0;
  background: url('/src/texture-enterprompt-thinking.png') center/100% 100% no-repeat;
  opacity: 0; transition: opacity 0.32s ease;
}
.input-bar.thinking .input-bar-bg { opacity: 0; }
.input-bar.thinking .input-bar-thinking { opacity: 1; }
.input-field {
  position: relative; z-index: 2; flex: 1;
  background: transparent; border: none; outline: none;
  color: #fff; font-size: 16px;
  font-family: 'CustomFont', -apple-system, 'SF Pro Text', BlinkMacSystemFont, sans-serif;
  padding: 0 14px; caret-color: #fff;
}
.input-field::placeholder { color: rgba(255,255,255,0.42); }
.btn-send { display: none; }

/* ── Input tap ripple glow ── */
.input-tap-glow {
  position: absolute;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.08) 40%, transparent 70%);
  transform: translate(-50%, -50%) scale(0);
  pointer-events: none;
  z-index: 3;
  animation: inputGlow 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes inputGlow {
  0%   { transform: translate(-50%, -50%) scale(0);   opacity: 1; }
  55%  { transform: translate(-50%, -50%) scale(1.8); opacity: 0.7; }
  100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
}

/* ── Bubbles ── */
/* Gap between message groups */
.bubble-user-wrap {
  display: flex; justify-content: flex-end;
  padding: 2px 16px 2px;
  animation: bubbleIn 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.1) both;
}
.bubble-user-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 78%; }
.bubble-user {
  background: #3a3a3c; color: #fff;
  padding: 11px 16px; border-radius: 20px;
  font-size: 17px; line-height: 1.4;
}

/* Larger gap before AI reply */
.bubble-ai-wrap {
  display: flex; flex-direction: column;
  align-self: flex-start; width: 100%;
  padding: 8px 16px 2px;
  animation: bubbleIn 0.34s cubic-bezier(0.175, 0.885, 0.32, 1.1) both;
}

/* Consecutive same-sender: tighter */
.bubble-user-wrap + .bubble-user-wrap { padding-top: 1px; }
.bubble-ai-wrap + .bubble-ai-wrap { padding-top: 1px; }
/* Cross-sender: visible breathing room */
.bubble-ai-wrap + .bubble-user-wrap,
.bubble-user-wrap + .bubble-ai-wrap { padding-top: 10px; }

@keyframes bubbleIn {
  0%   { opacity: 0; transform: translateY(10px) scale(0.96); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.bubble-file {
  background: #2c2c2e; color: #ccc;
  padding: 8px 13px; border-radius: 14px;
  font-size: 13px; display: flex; align-items: center; gap: 7px;
  max-width: 220px; overflow: hidden;
}
.bubble-file svg { flex-shrink: 0; }
.bubble-file-name {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: 'AppMono', monospace; font-size: 12px; color: #aaa;
}

/* rendered markdown content */
.bubble-ai-content {
  font-size: 17px; line-height: 1.55; color: #fff;
}
.bubble-ai-content h1 {
  font-size: 38px; font-weight: 100; line-height: 1.1;
  margin: 18px 0 10px; letter-spacing: -1px;
  font-family: 'AppThin', -apple-system, sans-serif;
}
.bubble-ai-content h2 {
  font-size: 28px; font-weight: 100; line-height: 1.15;
  margin: 14px 0 8px; letter-spacing: -0.6px;
  font-family: 'AppThin', -apple-system, sans-serif;
}
.bubble-ai-content h3 {
  font-size: 21px; font-weight: 100; line-height: 1.2;
  margin: 12px 0 6px; letter-spacing: -0.3px;
  font-family: 'AppThin', -apple-system, sans-serif;
}
.bubble-ai-content p  { margin: 0 0 8px; }
.bubble-ai-content p:last-child { margin-bottom: 0; }
.bubble-ai-content ul, .bubble-ai-content ol { padding-left: 20px; margin-bottom: 8px; }
.bubble-ai-content li { margin-bottom: 3px; }
.bubble-ai-content strong { font-weight: 700; font-family: 'AppBold', 'CustomFont', sans-serif; }
.bubble-ai-content em {
  font-style: italic;
  font-family: 'AppBookworm', 'CustomFont', serif;
}
/* Blockquote — bookworm, softer color, creative/poetic feel */
.bubble-ai-content blockquote {
  border-left: 2px solid rgba(255,255,255,0.2);
  padding-left: 14px; color: rgba(255,255,255,0.65);
  margin: 10px 0;
  font-family: 'AppBookworm', 'CustomFont', serif;
  font-size: 16px; line-height: 1.65;
}
/* Creative class — added by JS when AI writes posts/stories */
.bubble-ai-content.creative-text p,
.bubble-ai-content.creative-text li {
  font-family: 'AppBookworm', 'CustomFont', serif;
  line-height: 1.7;
}
/* Code: mono always */
.bubble-ai-content code {
  background: #1a1a1a; border-radius: 6px;
  padding: 2px 6px; font-size: 14px;
  font-family: 'AppMono', 'SF Mono', 'Menlo', monospace;
  color: #e2e8f0;
}
.bubble-ai-content pre {
  background: #0d0d0d; border-radius: 12px;
  padding: 12px 14px; margin: 8px 0; overflow-x: auto;
}
.bubble-ai-content pre code {
  background: transparent; padding: 0; font-size: 13px;
  font-family: 'AppMono', 'SF Mono', 'Menlo', monospace;
  color: #cdd6f4; line-height: 1.5;
}
.bubble-ai-content .table-wrap {
  width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
  margin: 10px 0; border-radius: 14px;
  /* Contain scroll to just this element */
  max-width: 100%;
}
.bubble-ai-content table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 320px; background: #0a0a0a; border-radius: 14px; overflow: hidden; font-size: 14px; margin: 0; }
.bubble-ai-content th { background: #111; color: #fff; padding: 10px 13px; text-align: left; font-weight: 600; font-family: 'AppBold', 'CustomFont', sans-serif; border-bottom: 1px solid rgba(255,255,255,0.06); }
.bubble-ai-content th:first-child { border-radius: 14px 0 0 0; }
.bubble-ai-content th:last-child  { border-radius: 0 14px 0 0; }
.bubble-ai-content td { padding: 9px 13px; color: #bbb; border-bottom: 1px solid rgba(255,255,255,0.04); }
.bubble-ai-content tr:last-child td { border-bottom: none; }
.bubble-ai-content tr:last-child td:first-child { border-radius: 0 0 0 14px; }
.bubble-ai-content tr:last-child td:last-child  { border-radius: 0 0 14px 0; }
.bubble-ai-content tr:hover td { background: rgba(255,255,255,0.02); }
.bubble-ai-content .katex { color: #fff; font-size: 1em; }
.bubble-ai-content .katex-display { overflow-x: auto; overflow-y: hidden; padding: 6px 0; max-width: 100%; }
.bubble-ai-content .katex-display > .katex { max-width: 100%; }
/* KaTeX inline */
.bubble-ai-content .katex-inline { color: #fff; }

.bubble-ai-actions {
  display: flex; gap: 14px; margin-top: 8px; align-items: center;
}
.action-btn {
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  color: #555; padding: 0;
  transition: color 0.18s, transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
}
.action-btn:active { color: #fff; transform: scale(1.2); }
.action-btn svg { width: 16px; height: 16px; }

.bubble-typing {
  align-self: flex-start; padding: 14px 20px;
  display: flex; gap: 5px; align-items: center;
  animation: bubbleIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.1) both;
}
.dot {
  width: 7px; height: 7px; background: #666; border-radius: 50%;
  animation: dotpulse 1.2s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotpulse {
  0%,80%,100% { opacity: 0.3; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

/* ── Delete dialog ── */
.delete-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center; padding: 0 20px;
  opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.delete-overlay.open { opacity: 1; pointer-events: all; }
.delete-dialog {
  width: 100%; max-width: 310px;
  display: flex; flex-direction: column; position: relative;

// ══════════════════════ PRELOAD + BOOT ══════════════════════
async function preloadResources() {
  const assets = ['/src/logo.svg','/src/cardtexturefinal.png','/src/texture-btnssmall.png','/src/texture-enterprompt.png','/src/texture-enterprompt-thinking.png','/src/dialogdelete-question.png','/src/dialogdelete-yesdel.png','/src/dialogdelete-nokeep.png','/src/sound.mp3','/1.ttf','/bold.otf','/mono.ttf','/bookworm.otf','/thin.otf'];
  const loadImg = s => new Promise(r=>{ const i=new Image(); i.onload=()=>r(true); i.onerror=()=>r(false); i.src=s; setTimeout(()=>r(false),3000); });
  const loadFont = () => new Promise(r=>{ if(document.fonts&&document.fonts.load) { document.fonts.load('16px "CustomFont"').then(()=>r()).catch(()=>r()); document.fonts.load('16px "AppBold"').catch(()=>{}); document.fonts.load('16px "AppMono"').catch(()=>{}); document.fonts.load('16px "AppBookworm"').catch(()=>{}); document.fonts.load('16px "AppThin"').catch(()=>{}); setTimeout(()=>r(),2000); } else setTimeout(r,200); });
  const loadAudio = s => new Promise(r=>{ const a=new Audio(); a.preload='auto'; a.oncanplaythrough=()=>r(true); a.onerror=()=>r(false); a.src=s; setTimeout(()=>r(false),2000); });
  await Promise.allSettled(assets.map(a=>a.endsWith('.ttf')||a.endsWith('.otf')?loadFont():a.endsWith('.mp3')?loadAudio(a):loadImg(a)));
}

async function bootApplication() {
  const logo = document.getElementById('logoPreloader');

  // Apple HIG: brief pause before entering, feels intentional
  await new Promise(r => setTimeout(r, 60));
  logo.classList.add('enter');

  // Load while logo is showing
  await Promise.race([preloadResources(), new Promise(r => setTimeout(r, 4000))]);

  // Minimum display time so it doesn't feel like a flash
  await new Promise(r => setTimeout(r, 320));

  logo.classList.remove('enter');
  logo.classList.add('exit');
  await new Promise(r => setTimeout(r, 400));

  document.getElementById('preloader').style.display = 'none';
  // Trigger staggered entrance animations
  document.body.classList.add('app-loaded');
}

const GROQ_API_KEY='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';

const SYSTEM_PROMPT='Ты — Siri, умный, эмпатичный AI-помощник для ежедневного общения и бизнес-задач. Ответы формируй самостоятельно, без вызова внешних функций и инструментов. На простые приветствия, реплики и светскую беседу отвечай коротко, тепло и по-человечески. Переходи к строгой структуре (заголовкам, спискам, разделителям) только при решении комплексных вопросов. Если пользователь просит сделать расчеты или аналитику, в обязательном порядке используй LaTeX-разметку ($inline$ или$$display$$) для формул. Тексты для постов пиши в сдержанном, но дружелюбном стиле.';

// ══════════════════════ MARKDOWN + LaTeX RENDER ══════════════════════
function renderMarkdown(text) {
  const div = document.createElement('div');
  div.className = 'bubble-ai-content';

  if (typeof marked === 'undefined') {
    div.textContent = text;
    return div;
  }

  // ── Step 1: protect math blocks BEFORE marked touches them ──
  // marked destroys \[...\] and $$...$$ by escaping backslashes & wrapping in <p>
  // We replace them with unique placeholders, then restore after parsing.
  const mathBlocks = [];
  let protected_text = text;

  // Display math: $$...$$ and \[...\]
  protected_text = protected_text.replace(/\$\$([\s\S]+?)\$\$/g, (_, math) => {
    const idx = mathBlocks.length;
    mathBlocks.push({ type: 'display', math });
    return `MATHBLOCK_${idx}_END`;
  });
  protected_text = protected_text.replace(/\\\[([\s\S]+?)\\\]/g, (_, math) => {
    const idx = mathBlocks.length;
    mathBlocks.push({ type: 'display', math });
    return `MATHBLOCK_${idx}_END`;
  });
  // Inline math: $...$ (not $$)
  protected_text = protected_text.replace(/\$([^\n$]+?)\$/g, (_, math) => {
    const idx = mathBlocks.length;
    mathBlocks.push({ type: 'inline', math });
    return `MATHBLOCK_${idx}_END`;
  });
  // Inline math: \(...\)
  protected_text = protected_text.replace(/\\\((.+?)\\\)/g, (_, math) => {
    const idx = mathBlocks.length;
    mathBlocks.push({ type: 'inline', math });
    return `MATHBLOCK_${idx}_END`;
  });

  // ── Step 2: parse markdown ──
  marked.setOptions({ breaks: true, gfm: true });
  div.innerHTML = marked.parse(protected_text);

  // ── Step 3: restore math placeholders with rendered KaTeX ──
  if (mathBlocks.length > 0 && typeof katex !== 'undefined') {
    div.querySelectorAll('*').forEach(node => {
      // Walk text nodes
    });
    // Easier: replace in innerHTML
    let html = div.innerHTML;
    mathBlocks.forEach(({ type, math }, idx) => {
      const placeholder = `MATHBLOCK_${idx}_END`;
      let rendered = '';
      try {
        rendered = katex.renderToString(math.trim(), {
          displayMode: type === 'display',
          throwOnError: false,
          strict: false
        });
      } catch(e) {
        rendered = `<span style="color:#ff6b6b;font-size:13px">[math error]</span>`;
      }
      html = html.replace(placeholder, rendered);
    });
    div.innerHTML = html;
  } else if (mathBlocks.length > 0) {
    // KaTeX not yet loaded — retry after DOM insertion
    setTimeout(() => {
      let html = div.innerHTML;
      mathBlocks.forEach(({ type, math }, idx) => {
        const placeholder = `MATHBLOCK_${idx}_END`;
        if (typeof katex !== 'undefined') {
          try {
            const rendered = katex.renderToString(math.trim(), {
              displayMode: type === 'display',
              throwOnError: false
            });
            html = html.replace(placeholder, rendered);
          } catch(e) {}
        }
      });
      div.innerHTML = html;
    }, 400);
  }

  // ── Step 4: wrap tables to prevent horizontal overflow ──
  div.querySelectorAll('table').forEach(tbl => {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    tbl.parentNode.insertBefore(wrap, tbl);
    wrap.appendChild(tbl);
  });

  return div;
}

// ══════════════════════ CARDS ══════════════════════
function formatDate(ts) {
  const d=new Date(ts),now=new Date(),diff=now-d;
  if(diff<86400000&&d.getDate()===now.getDate()) return 'Сегодня';
  if(diff<172800000) return 'Вчера';
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderCards() {
  const grid=document.getElementById('cardsGrid');
  grid.innerHTML='';
  chats.forEach((chat,i)=>{
    const card=document.createElement('div');
    card.className='card'+(editingMode?' wobble':'');
    card.innerHTML=`
      <button class="card-delete" data-i="${i}">
        <svg viewBox="0 0 14 14" fill="none" stroke="#ff3b30" stroke-width="2.4" stroke-linecap="round">
          <line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/>
        </svg>
      </button>
      <div class="card-date">${formatDate(chat.ts)}</div>
      <div class="card-title">${escHtml(chat.title)}</div>
      <div class="card-preview">${escHtml(chat.preview)}</div>`;
    if(!editingMode) card.addEventListener('click',()=>openChatById(chat.id));
    card.addEventListener('pointerdown',startLongPress);
    card.addEventListener('pointerup',cancelLongPress);
    card.addEventListener('pointercancel',cancelLongPress);
    card.addEventListener('pointermove',cancelLongPress);
    card.querySelector('.card-delete').addEventListener('click',e=>{e.stopPropagation();deleteChat(e,parseInt(e.currentTarget.dataset.i));});
    grid.appendChild(card);
  });
  grid.classList.toggle('editing-mode',editingMode);
  document.getElementById('homeScroll').classList.toggle('editing-mode',editingMode);
  document.getElementById('homeTitle').style.display=editingMode?'none':'';
  document.getElementById('btnSettings').style.display=editingMode?'none':'';
  document.getElementById('btnDone').style.display=editingMode?'':'none';
}
function startLongPress(){cancelLongPress();longPressTimer=setTimeout(()=>{if(!editingMode){editingMode=true;renderCards();}},480);}
function cancelLongPress(){clearTimeout(longPressTimer);}
function exitEditing(){editingMode=false;renderCards();}

let pendingDeleteIndex=null;
function deleteChat(e,i){e.stopPropagation();pendingDeleteIndex=i;document.getElementById('deleteOverlay').classList.add('open');}
function closeDeleteDialog(){document.getElementById('deleteOverlay').classList.remove('open');pendingDeleteIndex=null;}
function confirmDelete(){if(pendingDeleteIndex!==null){chats.splice(pendingDeleteIndex,1);saveChats(chats);closeDeleteDialog();renderCards();if(chats.length===0)exitEditing();}}
document.getElementById('dialogConfirmDelete').addEventListener('click',confirmDelete);
document.getElementById('dialogCancel').addEventListener('click',closeDeleteDialog);
document.getElementById('deleteOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('deleteOverlay'))closeDeleteDialog();});

// ══════════════════════ CHAT NAVIGATION ══════════════════════
function openNewChat(){
  exitEditing();currentChatId=null;currentMessages=[];
  document.getElementById('home').classList.remove('active');
  document.getElementById('chat').classList.add('active');
  document.getElementById('chatMessages').innerHTML='';
  document.getElementById('chatInput').value='';
  stopTTS();toggleControls();
}
function openChatById(id){
  const chat=chats.find(c=>c.id===id);if(!chat)return;
  exitEditing();currentChatId=id;
  currentMessages=(chat.messages||[]).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}));
  document.getElementById('home').classList.remove('active');
  document.getElementById('chat').classList.add('active');
  const msgs=document.getElementById('chatMessages');msgs.innerHTML='';
  (chat.messages||[]).forEach(m=>appendBubble(m.role,m.text));
  // Scroll after paint
  requestAnimationFrame(()=>{ msgs.scrollTop=msgs.scrollHeight; });
  document.getElementById('chatInput').value='';stopTTS();toggleControls();
}
function goHome(){
  if(isGenerating)stopGeneration();stopTTS();
  document.getElementById('chat').classList.remove('active');
  document.getElementById('home').classList.add('active');
  renderCards();
}

// ══════════════════════ BUBBLES ══════════════════════
function appendBubble(role, text, isNew, fileInfo) {
  const msgs=document.getElementById('chatMessages');
  if(role==='user'){
    const wrap=document.createElement('div');wrap.className='bubble-user-wrap';
    const stack=document.createElement('div');stack.className='bubble-user-stack';
    if(fileInfo){
      const fb=document.createElement('div');fb.className='bubble-file';
      fb.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span class="bubble-file-name">${escHtml(fileInfo.name)}</span>`;
      stack.appendChild(fb);
    }
    if(text){
      const bub=document.createElement('div');bub.className='bubble-user';bub.textContent=text;
      stack.appendChild(bub);
    }
    wrap.appendChild(stack);msgs.appendChild(wrap);
  } else {
    const wrap=document.createElement('div');wrap.className='bubble-ai-wrap';
    const content=renderMarkdown(text);
    wrap.appendChild(content);
    const actions=document.createElement('div');actions.className='bubble-ai-actions';
    const retryBtn=document.createElement('button');retryBtn.className='action-btn';
    retryBtn.title='Повторить';
    retryBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>`;
    retryBtn.addEventListener('click',()=>retryLastMessage());
    const speakBtn=document.createElement('button');speakBtn.className='action-btn';
    speakBtn.title='Озвучить';
    speakBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
    speakBtn.addEventListener('click',()=>startTTS(text));
    actions.appendChild(retryBtn);actions.appendChild(speakBtn);
    wrap.appendChild(actions);
    msgs.appendChild(wrap);
  }
  if(isNew) {
    requestAnimationFrame(()=>{ msgs.scrollTop=msgs.scrollHeight; });
  }
}

// ══════════════════════ TTS ══════════════════════
const ttsBar=document.getElementById('ttsBar');
const ttsPlayPauseBtn=document.getElementById('ttsPlayPauseBtn');
const ttsPlayIcon=document.getElementById('ttsPlayIcon');
const ttsPauseIcon=document.getElementById('ttsPauseIcon');
const ttsCloseBtn=document.getElementById('ttsCloseBtn');

function startTTS(text) {
  stopTTS();
  ttsText=text;
  if(!('speechSynthesis' in window)) return;
  const plain=text.replace(/\$\$[\s\S]*?\$\$/g,'формула').replace(/\$[^$]+\$/g,'формула').replace(/[#*`_~>]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
  ttsUtterance=new SpeechSynthesisUtterance(plain);
  ttsUtterance.lang='ru-RU';
  ttsUtterance.rate=1;
  ttsUtterance.onend=()=>{ttsActive=false;ttsPaused=false;updateTTSBar();};
  ttsUtterance.onerror=()=>{ttsActive=false;ttsPaused=false;updateTTSBar();};
  window.speechSynthesis.speak(ttsUtterance);
  ttsActive=true;ttsPaused=false;
  updateTTSBar();
}
function stopTTS() {
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  ttsActive=false;ttsPaused=false;ttsUtterance=null;
  updateTTSBar();
}
function toggleTTSPlayPause() {
  if(!ttsActive) return;
  if(ttsPaused){window.speechSynthesis.resume();ttsPaused=false;}
  else{window.speechSynthesis.pause();ttsPaused=true;}
  updateTTSBar();
}
function updateTTSBar() {
  ttsBar.classList.toggle('active',ttsActive);
  ttsPlayIcon.style.display=ttsPaused?'block':'none';
  ttsPauseIcon.style.display=ttsPaused?'none':'block';
}
ttsPlayPauseBtn.addEventListener('click',toggleTTSPlayPause);
ttsCloseBtn.addEventListener('click',stopTTS);

// ══════════════════════ SEND / CONTROLS ══════════════════════
const chatInput=document.getElementById('chatInput'),btnMic=document.getElementById('btnMic'),btnSend=document.getElementById('btnSend'),btnStop=document.getElementById('btnStop'),inputBar=document.getElementById('inputBar');

function toggleControls(){
  const has=chatInput.value.trim().length>0;
  if(isGenerating){
    btnMic.style.display='none';btnSend.style.display='none';btnStop.style.display='flex';
    inputBar.classList.add('thinking');chatInput.placeholder='Думаю…';
  } else {
    btnStop.style.display='none';inputBar.classList.remove('thinking');
    chatInput.placeholder='Спросите Siri';
    btnMic.style.display=has?'none':'flex';
    btnSend.style.display=has?'flex':'none';
  }
}
chatInput.addEventListener('input',toggleControls);

function stopGeneration(){if(abortController)abortController.abort();isGenerating=false;toggleControls();const t=document.querySelector('.bubble-typing');if(t)t.remove();}
document.getElementById('btnStop').addEventListener('click',stopGeneration);

let lastUserMessage='';
function retryLastMessage(){
  if(!lastUserMessage||isGenerating) return;
  const msgs=document.getElementById('chatMessages');
  const wraps=msgs.querySelectorAll('.bubble-ai-wrap');
  if(wraps.length>0) wraps[wraps.length-1].remove();
  if(currentMessages.length&&currentMessages[currentMessages.length-1].role==='assistant') currentMessages.pop();
  callAPI(lastUserMessage);
}

async function callAPI(val) {
  isGenerating=true;toggleControls();
  const msgs=document.getElementById('chatMessages');
  const typing=document.createElement('div');typing.className='bubble-typing';
  typing.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  msgs.appendChild(typing);
  requestAnimationFrame(()=>{ msgs.scrollTop=msgs.scrollHeight; });
  abortController=new AbortController();
  try {
    const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',signal:abortController.signal,
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROQ_API_KEY}`},
      body:JSON.stringify({model:GROQ_MODEL,messages:[{role:'system',content:SYSTEM_PROMPT},...currentMessages],max_tokens:1024,temperature:0.7})
    });
    typing.remove();
    if(!resp.ok) throw new Error(`API error ${resp.status}`);
    const data=await resp.json();
    const aiText=data.choices?.[0]?.message?.content?.trim()||'Не удалось получить ответ.';
    currentMessages.push({role:'assistant',content:aiText});
    appendBubble('ai',aiText,true);
    new Audio('/src/sound.mp3').play().catch(()=>{});
    if(currentChatId){const chat=chats.find(c=>c.id===currentChatId);if(chat){chat.messages.push({role:'user',text:val});chat.messages.push({role:'ai',text:aiText});chat.ts=Date.now();chat.title=val.length>50?val.slice(0,50)+'…':val;chat.preview=aiText.slice(0,62)+'…';}}
    else{const id='chat_'+Date.now();currentChatId=id;chats.unshift({id,ts:Date.now(),title:val.length>50?val.slice(0,50)+'…':val,preview:aiText.slice(0,62)+'…',messages:[{role:'user',text:val},{role:'ai',text:aiText}]});}
    saveChats(chats);
  } catch(err){typing.remove();if(err.name!=='AbortError')appendBubble('ai','Произошла ошибка. Проверьте соединение.',true);}
  isGenerating=false;abortController=null;toggleControls();
}

// ══════════════════════ FILE ATTACHMENT ══════════════════════
let attachedFileText = '';
let attachedFileName = '';

const fileInput = document.getElementById('fileInput');
const attachedFilePill = document.getElementById('attachedFilePill');
const attachedFileNameEl = document.getElementById('attachedFileName');

async function extractFileText(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const textExts = ['txt','md','csv','json','xml','html','htm','yaml','yml','log','ini','toml','rtf','js','ts','py','css','sh'];
  if (textExts.includes(ext)) return await file.text();
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let raw = '';
  for (let i = 0; i < bytes.length; i++) {
    const b = bytes[i];
    if (b >= 32 && b < 127) raw += String.fromCharCode(b);
    else if (b === 10 || b === 13) raw += ' ';
  }
  if (ext === 'pdf') {
    const btMatches = raw.match(/BT[\s\S]{0,500}?ET/g) || [];
    let ex = btMatches.map(m => (m.match(/\(([^)]{1,200})\)/g)||[]).map(s=>s.slice(1,-1)).join(' ')).join(' ').replace(/\s+/g,' ').trim();
    if (!ex) ex = (raw.match(/[\x20-\x7E]{5,}/g)||[]).join(' ').replace(/\s+/g,' ').trim();
    return ex.slice(0,14000) || '[PDF: текст не извлечён]';
  }
  if (['docx','xlsx','pptx'].includes(ext)) {
    const tags = raw.match(/<(?:w:t|t|si)[^>]*>([^<]{1,500})<\/(?:w:t|t|si)>/g) || [];
    let ex = tags.map(m=>m.replace(/<[^>]+>/g,'')).join(' ');
    if (!ex) ex = (raw.match(/[\x20-\x7E]{6,}/g)||[]).filter(s=>s.length>5).join(' ');
    return ex.replace(/\s+/g,' ').trim().slice(0,14000) || '['+ext+': текст не извлечён]';
  }
  return (raw.match(/[\x20-\x7E]{6,}/g)||[]).join(' ').replace(/\s+/g,' ').trim().slice(0,14000) || '['+ext+': текст не извлечён]';
}

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  attachedFileName = file.name;
  try {
    attachedFileText = await extractFileText(file);
    if (attachedFileText.length > 14000)
      attachedFileText = attachedFileText.slice(0,14000) + '\n\n[...обрезано до 14000 символов]';
  } catch(err) {
    attachedFileText = '[Ошибка чтения: ' + err.message + ']';
  }
  attachedFileNameEl.textContent = file.name;
  attachedFilePill.style.display = 'flex';
  fileInput.value = '';
});

window.clearAttachment = function() {
  attachedFileText = '';
  attachedFileName = '';
  attachedFilePill.style.display = 'none';
};

async function sendMessageWithFile() {
  const val = chatInput.value.trim();
  if (!val && !attachedFileText) return;
  if (isGenerating) return;
  const msgs = document.getElementById('chatMessages');

  const wrap = document.createElement('div'); wrap.className = 'bubble-user-wrap';
  const stack = document.createElement('div'); stack.className = 'bubble-user-stack';
  if (attachedFileText) {
    const fb = document.createElement('div'); fb.className = 'bubble-file';
    fb.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span class="bubble-file-name">'+escHtml(attachedFileName)+'</span>';
    stack.appendChild(fb);
  }
  if (val) {
    const bub = document.createElement('div'); bub.className = 'bubble-user'; bub.textContent = val;
    stack.appendChild(bub);
  }
  wrap.appendChild(stack); msgs.appendChild(wrap);
  requestAnimationFrame(()=>{ msgs.scrollTop=msgs.scrollHeight; });

  const userDisplayText = val || ('📎 ' + attachedFileName);
  const apiContent = attachedFileText
    ? '[Файл: ' + attachedFileName + ']\n```\n' + attachedFileText + '\n```\n\n' + (val || 'Прочитай и проанализируй этот файл.')
    : val;

  lastUserMessage = val || attachedFileName;
  currentMessages.push({ role: 'user', content: apiContent });
  chatInput.value = '';
  const savedFileName = attachedFileName;
  window.clearAttachment();
  toggleControls();

  isGenerating = true; toggleControls();
  const typing = document.createElement('div'); typing.className = 'bubble-typing';
  typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  msgs.appendChild(typing);
  requestAnimationFrame(()=>{ msgs.scrollTop=msgs.scrollHeight; });
  abortController = new AbortController();
  try {
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST', signal: abortController.signal,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_API_KEY },
      body: JSON.stringify({ model: GROQ_MODEL, messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...currentMessages], max_tokens: 1024, temperature: 0.7 })
    });
    typing.remove();
    if (!resp.ok) throw new Error('API ' + resp.status);
    const data = await resp.json();
    const aiText = ((data.choices||[])[0]||{}).message.content.trim() || 'Нет ответа.';
    currentMessages.push({ role: 'assistant', content: aiText });
    appendBubble('ai', aiText, true);
    new Audio('/src/sound.mp3').play().catch(()=>{});
    if (currentChatId) {
      const chat = chats.find(c=>c.id===currentChatId);
      if (chat) { chat.messages.push({role:'user',text:userDisplayText}); chat.messages.push({role:'ai',text:aiText}); chat.ts=Date.now(); chat.preview=aiText.slice(0,62)+'…'; }
    } else {
      const id='chat_'+Date.now(); currentChatId=id;
      chats.unshift({id,ts:Date.now(),title:userDisplayText.length>50?userDisplayText.slice(0,50)+'…':userDisplayText,preview:aiText.slice(0,62)+'…',messages:[{role:'user',text:userDisplayText},{role:'ai',text:aiText}]});
    }
    saveChats(chats);
  } catch(err) {
    typing.remove();
    if (err.name!=='AbortError') appendBubble('ai','Произошла ошибка. Проверьте соединение.',true);
  }
  isGenerating=false; abortController=null; toggleControls();
}

document.getElementById('btnSend').addEventListener('click', sendMessageWithFile);
chatInput.addEventListener('keydown', e => { if (e.key==='Enter' && !isGenerating) sendMessageWithFile(); });

// ══════════════════════ MIC ══════════════════════
let recognition=null,isRecording=false;
function initSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  const r=new SR();r.lang='ru-RU';r.continuous=false;r.interimResults=true;
  r.onresult=e=>{let f='',t='';for(let i=e.resultIndex;i<e.results.length;i++){const s=e.results[i][0].transcript;if(e.results[i].isFinal)f+=s;else t+=s;}chatInput.value=f||t;toggleControls();};
  r.onend=()=>{isRecording=false;btnMic.classList.remove('mic-recording');toggleControls();};
  r.onerror=()=>{isRecording=false;btnMic.classList.remove('mic-recording');toggleControls();};
  return r;
}
btnMic.addEventListener('click',()=>{
  if(isGenerating)return;
  if(!recognition)recognition=initSpeech();
  if(!recognition){alert('Диктовка не поддерживается.');return;}
  if(isRecording)recognition.stop();
  else{isRecording=true;btnMic.classList.add('mic-recording');recognition.start();}
});

function openSettings(){document.getElementById('settingsOverlay').classList.add('open');}
function closeSettings(){document.getElementById('settingsOverlay').classList.remove('open');}

// ══════════════════════ LIQUID GLASS BUTTON INTERACTION ══════════════════════
function initButtonInteractions() {
  document.querySelectorAll('.txbtn').forEach(btn => {
    btn.addEventListener('pointerup', () => {
      btn.classList.remove('releasing');
      void btn.offsetWidth;
      btn.classList.add('releasing');
    });
    btn.addEventListener('pointercancel', () => {
      btn.classList.remove('releasing');
    });
    btn.addEventListener('animationend', (e) => {
      if (e.animationName === 'btnFrameReturn') {
        btn.classList.remove('releasing');
      }
    });
  });
}

// ── Input field: glow ripple from tap position ──
function initInputRipple() {
  const inputBar = document.getElementById('inputBar');
  inputBar.addEventListener('pointerdown', (e) => {
    // Only if tapping the bar itself (not already focused)
    const rect = inputBar.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const glow = document.createElement('div');
    glow.className = 'input-tap-glow';
    glow.style.left = x + 'px';
    glow.style.top = y + 'px';
    inputBar.appendChild(glow);

    glow.addEventListener('animationend', () => glow.remove());
  });
}
