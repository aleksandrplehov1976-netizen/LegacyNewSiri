<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Siri</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  width: 100%;
  background: #000;
  font-family: -apple-system, 'SF Pro Text', BlinkMacSystemFont, sans-serif;
  color: #fff;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-x pan-y;
}

/* allow selection only inside bubbles */
.bubble-user, .bubble-ai {
  user-select: text;
  -webkit-user-select: text;
}

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
}
.screen.active {
  opacity: 1;
  pointer-events: all;
}

/* ══ HOME ══ */
#home { display: flex; flex-direction: column; }

.home-header {
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px 12px;
}

.home-title {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.6px;
}

.home-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 0 12px 130px;
}
.home-scroll::-webkit-scrollbar { display: none; }

.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* card */
.card {
  background: #1c1c1e;
  border-radius: 23px;
  padding: 14px 13px;
  cursor: pointer;
  min-height: 138px;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: opacity 0.12s;
}
.card:active:not(.editing-mode .card) { opacity: 0.65; }

/* wobble */
.card.wobble {
  animation: wobble 0.35s ease-in-out infinite alternate;
}
@keyframes wobble {
  0%   { transform: rotate(-1.2deg) scale(0.985); }
  100% { transform: rotate(1.2deg)  scale(0.985); }
}

/* delete badge */
.card-delete {
  position: absolute;
  top: -8px;
  left: -8px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: url('/src/texture-btnssmall.png') center/100% 100% no-repeat;
  border: none;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.card-delete svg { width: 12px; height: 12px; }
.editing-mode .card-delete { display: flex; }

.card-date {
  font-size: 11px;
  color: #666;
  margin-bottom: 5px;
}
.card-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  color: #fff;
  margin-bottom: 6px;
  letter-spacing: -0.15px;
}
.card-preview {
  font-size: 12px;
  color: #777;
  line-height: 1.4;
}

/* bottom floating bar */
.home-bottom {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px 32px;
  background: linear-gradient(to top, #000 60%, transparent);
  pointer-events: none;
}
.home-bottom button { pointer-events: all; }

/* ══ buttons ══ */
.txbtn {
  border-radius: 50%;
  background: url('/src/texture-btnssmall.png') center/100% 100% no-repeat;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.12s, transform 0.1s;
}
.txbtn:active { opacity: 0.65; transform: scale(0.93); }

.txbtn-sm { width: 44px; height: 44px; }
.txbtn-sm svg { width: 19px; height: 19px; }

.txbtn-md { width: 52px; height: 52px; }
.txbtn-md svg { width: 21px; height: 21px; }

.txbtn-lg { width: 68px; height: 68px; }
.txbtn-lg svg { width: 26px; height: 26px; }

/* ══ SETTINGS OVERLAY ══ */
.settings-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.settings-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.settings-sheet {
  width: 100%;
  background: #1c1c1e;
  border-radius: 28px 28px 0 0;
  padding: 20px 24px 48px;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
}
.settings-overlay.open .settings-sheet { transform: translateY(0); }
.settings-handle {
  width: 36px; height: 4px;
  background: #444;
  border-radius: 2px;
  margin: 0 auto 20px;
}
.settings-title {
  font-size: 13px;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
}
.settings-row {
  font-size: 17px;
  color: #fff;
  padding: 4px 0 20px;
}
.settings-row span { color: #888; font-size: 15px; }

/* ══ CHAT ══ */
#chat { display: flex; flex-direction: column; }

.chat-header {
  flex-shrink: 0;
  padding: 14px 16px 10px;
  display: flex;
  align-items: center;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 6px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.chat-messages::-webkit-scrollbar { display: none; }

.chat-input-area {
  flex-shrink: 0;
  padding: 10px 14px 36px;
  background: linear-gradient(to top, #000 70%, transparent);
}
.input-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.input-bar {
  flex: 1;
  height: 44px;
  position: relative;
  display: flex;
  align-items: center;
  border-radius: 20px;
  overflow: hidden;
}
.input-bar-bg {
  position: absolute;
  inset: 0;
  background: url('/src/texture-enterprompt.png') center/100% 100% no-repeat;
}
.input-field {
  position: relative;
  z-index: 2;
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 16px;
  font-family: -apple-system, 'SF Pro Text', BlinkMacSystemFont, sans-serif;
  padding: 0 14px;
  caret-color: #fff;
  user-select: text;
  -webkit-user-select: text;
}
.input-field::placeholder { color: rgba(255,255,255,0.42); }

.btn-send { display: none; }

/* bubbles */
.bubble-user {
  align-self: flex-end;
  background: #2c2c2e;
  color: #fff;
  padding: 12px 16px;
  border-radius: 20px 20px 5px 20px;
  font-size: 15px;
  max-width: 78%;
  line-height: 1.45;
}
.bubble-ai {
  align-self: flex-start;
  background: #1c1c1e;
  color: #fff;
  padding: 14px 16px;
  border-radius: 5px 20px 20px 20px;
  font-size: 15px;
  max-width: 92%;
  line-height: 1.5;
}
.bubble-ai-source {
  display: inline-flex;
  align-items: center;
  background: #2c2c2e;
  border-radius: 8px;
  padding: 3px 9px;
  font-size: 11px;
  color: #aaa;
  margin-top: 10px;
}
.bubble-ai-img { margin-top: 10px; border-radius: 12px; overflow: hidden; }
.bubble-ai-img img { width: 100%; display: block; }
.bubble-ai-img-caption { background: #2c2c2e; padding: 8px 12px; font-size: 12px; color: #999; }

/* typing indicator */
.bubble-typing {
  align-self: flex-start;
  background: #1c1c1e;
  padding: 14px 18px;
  border-radius: 5px 20px 20px 20px;
  display: flex;
  gap: 5px;
  align-items: center;
}
.dot {
  width: 7px; height: 7px;
  background: #666;
  border-radius: 50%;
  animation: dotpulse 1.2s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotpulse {
  0%,80%,100% { opacity: 0.3; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}
</style>
</head>
<body>

<!-- ══════════ HOME ══════════ -->
<div class="screen active" id="home">

  <div class="home-header" id="homeHeader">
    <span class="home-title" id="homeTitle">Siri</span>
    <button class="txbtn txbtn-sm" id="btnSettings" onclick="openSettings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
    <!-- done btn (editing mode) -->
    <button class="txbtn txbtn-sm" id="btnDone" style="display:none;" onclick="exitEditing()">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </button>
  </div>

  <div class="home-scroll" id="homeScroll">
    <div class="cards-grid" id="cardsGrid">
      <!-- populated by JS -->
    </div>
  </div>

  <div class="home-bottom">
    <button class="txbtn txbtn-lg" onclick="openChat('')">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
      </svg>
    </button>
    <button class="txbtn txbtn-lg" onclick="openChat('')">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>
</div>

<!-- ══════════ SETTINGS ══════════ -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettingsOutside(event)">
  <div class="settings-sheet">
    <div class="settings-handle"></div>
    <div class="settings-title">About</div>
    <div class="settings-row">
      Siri <span>Version 1.0 RC</span>
    </div>
    <div class="settings-title" style="margin-top:8px;">Build</div>
    <div class="settings-row">
      <span>ios27-siri-pwa · 2026</span>
    </div>
  </div>
</div>

<!-- ══════════ CHAT ══════════ -->
<div class="screen" id="chat">

  <div class="chat-header">
    <button class="txbtn txbtn-sm" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-input-area">
    <div class="input-row">
      <button class="txbtn txbtn-md" id="btnAttach">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66L9.42 16.41a2 2 0 01-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <div class="input-bar">
        <div class="input-bar-bg"></div>
        <input class="input-field" id="chatInput" type="text" placeholder="Ask Siri"
          autocomplete="off" autocorrect="off" spellcheck="false"/>
      </div>
      <button class="txbtn txbtn-md" id="btnMic">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="11" rx="3"/>
          <path d="M5 10a7 7 0 0014 0M12 19v3M8 22h8"/>
        </svg>
      </button>
      <button class="txbtn txbtn-md btn-send" id="btnSend" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
// ── state ──
let chats = [];
let editingMode = false;
let longPressTimer = null;

const sampleAnswer = `Apple Park, also known as Apple Campus 2, is the corporate headquarters of Apple Inc., located in Cupertino, California, United States. It was opened to employees in April 2017, while construction was still underway.`;

// ── render cards ──
function renderCards() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  chats.forEach((chat, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (editingMode ? ' wobble' : '');
    card.dataset.index = i;

    card.innerHTML = `
      <button class="card-delete" onclick="deleteChat(event,${i})">
        <svg viewBox="0 0 14 14" fill="none" stroke="#ff3b30" stroke-width="2.2" stroke-linecap="round">
          <line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/>
        </svg>
      </button>
      <div class="card-date">${chat.date}</div>
      <div class="card-title">${chat.title}</div>
      <div class="card-preview">${chat.preview}</div>
    `;

    if (!editingMode) {
      card.addEventListener('click', () => openChat(chat.title));
    }

    // long press
    card.addEventListener('pointerdown', startLongPress);
    card.addEventListener('pointerup', cancelLongPress);
    card.addEventListener('pointercancel', cancelLongPress);
    card.addEventListener('pointermove', cancelLongPress);

    grid.appendChild(card);
  });

  // show/hide editing UI
  document.getElementById('homeTitle').style.display = editingMode ? 'none' : '';
  document.getElementById('btnSettings').style.display = editingMode ? 'none' : '';
  document.getElementById('btnDone').style.display = editingMode ? '' : 'none';
  document.getElementById('homeScroll').classList.toggle('editing-mode', editingMode);
  grid.classList.toggle('editing-mode', editingMode);
}

function startLongPress(e) {
  cancelLongPress();
  longPressTimer = setTimeout(() => {
    if (!editingMode) {
      editingMode = true;
      renderCards();
    }
  }, 500);
}
function cancelLongPress() {
  clearTimeout(longPressTimer);
}

function exitEditing() {
  editingMode = false;
  renderCards();
}

function deleteChat(e, i) {
  e.stopPropagation();
  chats.splice(i, 1);
  renderCards();
  if (chats.length === 0) exitEditing();
}

// ── chat ──
function openChat(question) {
  exitEditing();
  document.getElementById('home').classList.remove('active');
  document.getElementById('chat').classList.add('active');
  const msgs = document.getElementById('chatMessages');
  msgs.innerHTML = '';

  if (question) {
    const ub = document.createElement('div');
    ub.className = 'bubble-user';
    ub.textContent = question;
    msgs.appendChild(ub);

    const typing = document.createElement('div');
    typing.className = 'bubble-typing';
    typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    msgs.appendChild(typing);
    msgs.scrollTop = msgs.scrollHeight;

    setTimeout(() => {
      typing.remove();
      const ab = document.createElement('div');
      ab.className = 'bubble-ai';
      ab.textContent = sampleAnswer;
      msgs.appendChild(ab);
      msgs.scrollTop = msgs.scrollHeight;

      // save to chats if not already there
      const exists = chats.some(c => c.title === question);
      if (!exists) {
        const now = new Date();
        chats.unshift({
          title: question,
          preview: sampleAnswer.slice(0, 60) + '…',
          date: 'Today'
        });
      }
    }, 900);
  }

  document.getElementById('chatInput').value = '';
  toggleSendMic();
}

function goHome() {
  document.getElementById('chat').classList.remove('active');
  document.getElementById('home').classList.add('active');
  renderCards();
}

// ── send ──
const chatInput = document.getElementById('chatInput');
const btnMic = document.getElementById('btnMic');
const btnSend = document.getElementById('btnSend');

function toggleSendMic() {
  const has = chatInput.value.trim().length > 0;
  btnMic.style.display = has ? 'none' : 'flex';
  btnSend.style.display = has ? 'flex' : 'none';
}
chatInput.addEventListener('input', toggleSendMic);

function sendMessage() {
  const val = chatInput.value.trim();
  if (!val) return;
  const msgs = document.getElementById('chatMessages');

  const ub = document.createElement('div');
  ub.className = 'bubble-user';
  ub.textContent = val;
  msgs.appendChild(ub);

  chatInput.value = '';
  toggleSendMic();

  const typing = document.createElement('div');
  typing.className = 'bubble-typing';
  typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;

  setTimeout(() => {
    typing.remove();
    const ab = document.createElement('div');
    ab.className = 'bubble-ai';
    ab.textContent = sampleAnswer;
    msgs.appendChild(ab);
    msgs.scrollTop = msgs.scrollHeight;
  }, 900);
}
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

// ── settings ──
function openSettings() {
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettingsOutside(e) {
  if (e.target === document.getElementById('settingsOverlay')) {
    document.getElementById('settingsOverlay').classList.remove('open');
  }
}

// ── block pinch zoom ──
document.addEventListener('touchstart', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });

// ── block context menu ──
document.addEventListener('contextmenu', e => e.preventDefault());

// init
renderCards();
</script>
</body>
</html>
