<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
</head>
<body style="margin:0; padding:0; background:#000; overflow:hidden; position:fixed; width:100%; height:100%; top:0; left:0;">
    <video id="mainVideo" 
           src="/src/IMG_5249.MP4" 
           style="position:fixed; bottom:20px; left:20px; width:318px; height:auto; cursor:pointer; display:block; user-select:none; -webkit-tap-highlight-color:transparent; z-index:10;"
           muted playsinline
           preload="auto"
           controlslist="nodownload nofullscreen noremoteplayback"></video>
    
    <!-- Настройки-меню (выезжающее) -->
    <div id="settingsMenu" style="position:fixed; bottom:20px; left:20px; width:318px; background:rgba(28,28,30,0.95); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:24px; z-index:20; transform:translateY(calc(100% + 20px)); transition:transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); overflow:hidden; border:0.5px solid rgba(255,255,255,0.1);">
        <div style="padding:8px 0 12px 0;">
            <div style="padding:12px 16px; border-bottom:0.5px solid rgba(255,255,255,0.08);">
                <span style="font-size:13px; color:#8e8e93; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">ФИЛЬТРОВАТЬ ЧАТЫ ПО...</span>
            </div>
            <div style="padding:12px 16px; display:flex; align-items:center; gap:12px;">
                <div style="width:24px; height:24px; background:url('/src/texture-btnssmall.png') center/100% 100% no-repeat; border-radius:8px;"></div>
                <span style="font-size:17px; color:#fff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Дате создания</span>
            </div>
            <div style="padding:12px 16px; display:flex; align-items:center; gap:12px;">
                <div style="width:24px; height:24px; background:url('/src/texture-btnssmall.png') center/100% 100% no-repeat; border-radius:8px;"></div>
                <span style="font-size:17px; color:#fff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Активности</span>
            </div>
            <div style="padding:12px 16px; display:flex; align-items:center; gap:12px;">
                <div style="width:24px; height:24px; background:url('/src/texture-btnssmall.png') center/100% 100% no-repeat; border-radius:8px;"></div>
                <span style="font-size:17px; color:#fff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Объему диалога</span>
            </div>
            <div style="padding:12px 16px; border-bottom:0.5px solid rgba(255,255,255,0.08); margin-top:4px;">
                <span style="font-size:13px; color:#8e8e93; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">ПАРАМЕТРЫ ВИДА</span>
            </div>
            <div style="padding:12px 16px; display:flex; align-items:center; gap:12px;">
                <div style="width:24px; height:24px; background:url('/src/texture-btnssmall.png') center/100% 100% no-repeat; border-radius:8px;"></div>
                <span style="font-size:17px; color:#fff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Тёмная тема</span>
            </div>
            <div style="padding:12px 16px; display:flex; align-items:center; gap:12px;">
                <div style="width:24px; height:24px; background:url('/src/texture-btnssmall.png') center/100% 100% no-repeat; border-radius:8px;"></div>
                <span style="font-size:17px; color:#fff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Размер текста</span>
            </div>
            <div style="padding:12px 16px; display:flex; align-items:center; gap:12px;">
                <div style="width:24px; height:24px; background:url('/src/texture-btnssmall.png') center/100% 100% no-repeat; border-radius:8px;"></div>
                <span style="font-size:17px; color:#fff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Компактный режим</span>
            </div>
        </div>
    </div>
    
    <div id="upsMessage" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); color:white; font-size:24px; padding:20px 40px; border-radius:12px; display:none; z-index:100; font-family:sans-serif; pointer-events:none;">УПС, заглушка</div>
    
    <script>
        (function(){
            var video = document.getElementById('mainVideo');
            var upsDiv = document.getElementById('upsMessage');
            var settingsMenu = document.getElementById('settingsMenu');
            var isPlaying = false;
            var isReversing = false;
            var isExpanded = false;
            var animationId = null;
            var normalSize = 318;
            var expandedSize = 318;
            var settingsOpen = false;
            
            function setVideoSize(size) {
                video.style.width = size + 'px';
                video.style.height = 'auto';
            }
            
            video.removeAttribute('controls');
            video.controls = false;
            
            video.load();
            video.currentTime = 0;
            video.pause();
            setVideoSize(normalSize);
            
            function showUps() {
                upsDiv.style.display = 'block';
                setTimeout(function(){
                    upsDiv.style.display = 'none';
                }, 800);
            }
            
            function openSettingsMenu() {
                if(settingsOpen) return;
                settingsOpen = true;
                settingsMenu.style.transform = 'translateY(0)';
                setTimeout(function(){
                    if(video && video.paused && video.currentTime === 0) {
                        video.style.width = normalSize + 'px';
                    }
                }, 50);
            }
            
            function closeSettingsMenu() {
                if(!settingsOpen) return;
                settingsOpen = false;
                settingsMenu.style.transform = 'translateY(calc(100% + 20px))';
            }
            
            function stopReverseAnimation() {
                if(animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
            }
            
            function playForward() {
                if(isPlaying) return;
                if(settingsOpen) closeSettingsMenu();
                
                stopReverseAnimation();
                isPlaying = true;
                isReversing = false;
                isExpanded = true;
                setVideoSize(expandedSize);
                video.playbackRate = 1.0;
                
                var playPromise = video.play();
                if(playPromise !== undefined) {
                    playPromise.catch(function(e){});
                }
                
                var onEnded = function() {
                    video.removeEventListener('ended', onEnded);
                    video.pause();
                    video.currentTime = video.duration - 0.001;
                    isPlaying = false;
                };
                video.addEventListener('ended', onEnded);
            }
            
            function playReverse() {
                if(isPlaying) return;
                if(!isExpanded) return;
                if(settingsOpen) closeSettingsMenu();
                
                stopReverseAnimation();
                isPlaying = true;
                isReversing = true;
                video.pause();
                
                var startTime = video.currentTime;
                if(startTime <= 0.01) startTime = video.duration - 0.001;
                video.currentTime = startTime;
                
                function reverseStep() {
                    if(!isReversing) {
                        animationId = null;
                        return;
                    }
                    var newTime = video.currentTime - 0.033;
                    if(newTime <= 0) {
                        video.currentTime = 0;
                        video.pause();
                        setVideoSize(normalSize);
                        isPlaying = false;
                        isReversing = false;
                        isExpanded = false;
                        animationId = null;
                        return;
                    }
                    video.currentTime = newTime;
                    animationId = requestAnimationFrame(reverseStep);
                }
                
                animationId = requestAnimationFrame(reverseStep);
            }
            
            video.addEventListener('click', function(e){
                e.stopPropagation();
                if(isPlaying) return;
                if(isExpanded) {
                    showUps();
                    return;
                }
                openSettingsMenu();
            });
            
            document.body.addEventListener('click', function(e){
                if(e.target === video) return;
                if(!isExpanded) return;
                if(isPlaying) return;
                if(settingsOpen) {
                    closeSettingsMenu();
                    return;
                }
                playReverse();
            });
            
            video.addEventListener('touchstart', function(e){
                e.stopPropagation();
            });
            
            document.body.addEventListener('touchstart', function(e){
                if(e.target === video) return;
                if(!isExpanded) return;
                if(isPlaying) return;
                if(settingsOpen) {
                    closeSettingsMenu();
                    return;
                }
                playReverse();
            });
            
            video.addEventListener('loadedmetadata', function(){
                video.currentTime = 0;
                video.pause();
                setVideoSize(normalSize);
                isExpanded = false;
                stopReverseAnimation();
                closeSettingsMenu();
            });
            
            settingsMenu.addEventListener('click', function(e){
                e.stopPropagation();
            });
        })();
    </script>
</body>
</html>
