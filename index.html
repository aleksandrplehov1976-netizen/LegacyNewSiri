<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Siri">
<link rel="apple-touch-icon" href="/yri.png">
<link rel="manifest" href="/manifest.json">
<title>Siri</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%; width: 100%;
  background: #000;
  font-family: -apple-system, 'SF Pro Text', BlinkMacSystemFont, sans-serif;
  color: #fff;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-x pan-y;
}
.bubble-user, .bubble-ai, .input-field { user-select: text; -webkit-user-select: text; }

.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: #000;
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s ease;
}
.screen.active { opacity: 1; pointer-events: all; }

/* ══ ГЛАВНАЯ ══ */
#home { display: flex; flex-direction: column; }

.home-header {
  flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 12px;
  background: transparent;
}
.home-title { font-size: 32px; font-weight: 700; letter-spacing: -0.6px; }

.home-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  padding: 0 12px 130px;
  padding-top: 10px;
}
.home-scroll::-webkit-scrollbar { display: none; }

.cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow: visible; }

.card {
  background: #1c1c1e; border-radius: 23px;
  padding: 14px 13px; cursor: pointer;
  min-height: 138px; display: flex; flex-direction: column;
  position: relative; transition: opacity 0.12s;
}
.card:active:not(.editing-mode .card) { opacity: 0.65; }
.card.wobble { animation: wobble 0.10s ease-in-out infinite alternate; }
@keyframes wobble {
  0%   { transform: rotate(-1.5deg) scale(0.97); }
  100% { transform: rotate(1.5deg)  scale(0.97); }
}

.card-delete {
  position: absolute; top: -9px; left: -9px;
  width: 28px; height: 28px; border-radius: 50%;
  background: url('/src/texture-btnssmall.png') center/100% 100% no-repeat;
  border: none; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  z-index: 10; box-shadow: none;
}
.card-delete svg { width: 12px; height: 12px; }
.editing-mode .card-delete { display: flex; }

.card-date { font-size: 11px; color: #666; margin-bottom: 5px; }
.card-title { font-size: 14px; font-weight: 600; line-height: 1.3; color: #fff; margin-bottom: 6px; letter-spacing: -0.15px; }
.card-preview { font-size: 12px; color: #777; line-height: 1.4; }

.home-bottom {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  height: 120px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 32px 32px;
  background: linear-gradient(to top, #000 60%, transparent);
  pointer-events: none;
}
.home-bottom button { pointer-events: all; }

/* ══ КНОПКИ ══ */
.txbtn {
  border-radius: 50%;
  background: url('/src/texture-btnssmall.png') center/100% 100% no-repeat;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.txbtn.tapped {
  animation: btnTap 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}
@keyframes btnTap {
  0%   { transform: scale(1);    filter: brightness(1); }
  22%  { transform: scale(1.20); filter: brightness(1.65); }
  55%  { transform: scale(1.06); filter: brightness(1.22); }
  80%  { transform: scale(0.98); filter: brightness(1.05); }
  100% { transform: scale(1);    filter: brightness(1); }
}
.txbtn-sm { width: 44px; height: 44px; }
.txbtn-sm svg { width: 19px; height: 19px; }
.txbtn-md { width: 44px; height: 44px; }
.txbtn-md svg { width: 19px; height: 19px; }
.txbtn-lg { width: 68px; height: 68px; }
.txbtn-lg svg { width: 26px; height: 26px; }

/* ══ НАСТРОЙКИ ══ */
.settings-overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none;
  transition: opacity 0.45s ease;
}
.settings-overlay.open { opacity: 1; pointer-events: all; }
.settings-backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.settings-sheet {
  position: relative; z-index: 1;
  width: 100%; height: 85vh;
  background: #1a1a1a; border-radius: 28px 28px 0 0;
  padding: 0 0 48px;
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
  display: flex; flex-direction: column; overflow: hidden;
}
.settings-overlay.open .settings-sheet { transform: translateY(0); }
.settings-topbar {
  display: flex; align-items: center; justify-content: center;
  padding: 18px 20px 14px; position: relative; flex-shrink: 0;
}
.settings-heading { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: -0.2px; }
.settings-close { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); }
.settings-body { flex: 1; overflow-y: auto; padding: 6px 16px 20px; scrollbar-width: none; }
.settings-body::-webkit-scrollbar { display: none; }
.settings-section-label { font-size: 13px; font-weight: 400; color: #888; padding: 16px 4px 8px; letter-spacing: 0.1px; }
.settings-group { background: #2c2c2e; border-radius: 16px; overflow: hidden; margin-bottom: 10px; }
.settings-item { display: flex; align-items: center; padding: 14px 16px; gap: 12px; text-decoration: none; color: #fff; }
.settings-item + .settings-item { border-top: 1px solid rgba(255,255,255,0.07); }
.settings-item-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.settings-item-icon svg { width: 18px; height: 18px; }
.settings-item-label { font-size: 17px; color: #fff; flex: 1; }
.settings-item-value { font-size: 15px; color: #888; }
.settings-item-chevron svg { width: 14px; height: 14px; }

/* ══ ЧАТ ══ */
#chat { display: flex; flex-direction: column; }
.chat-header { flex-shrink: 0; padding: 14px 16px 10px; display: flex; align-items: center; background: transparent; }
.chat-messages {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 6px 0 12px;
  display: flex; flex-direction: column; gap: 16px;
}
.chat-messages::-webkit-scrollbar { display: none; }
.chat-input-area {
  flex-shrink: 0; padding: 10px 14px 36px;
  background: linear-gradient(to top, #000 70%, transparent);
}
.input-row { display: flex; align-items: center; gap: 10px; }
.input-bar {
  flex: 1; height: 44px; position: relative;
  display: flex; align-items: center;
  border-radius: 20px; overflow: hidden;
}

/* Две текстуры поля ввода с fade */
.input-bar-bg {
  position: absolute; inset: 0;
  background: url('/src/texture-enterprompt.png') center/100% 100% no-repeat;
  transition: opacity 0.35s ease;
}
.input-bar-thinking {
  position: absolute; inset: 0;
  background: url('/src/texture-enterprompt-thinking.png') center/100% 100% no-repeat;
  opacity: 0;
  transition: opacity 0.35s ease;
}
.input-bar.thinking .input-bar-bg { opacity: 0; }
.input-bar.thinking .input-bar-thinking { opacity: 1; }

.input-field {
  position: relative; z-index: 2; flex: 1;
  background: transparent; border: none; outline: none;
  color: #fff; font-size: 16px;
  font-family: -apple-system, 'SF Pro Text', BlinkMacSystemFont, sans-serif;
  padding: 0 14px; caret-color: #fff;
}
.input-field::placeholder { color: rgba(255,255,255,0.42); }
.btn-send { display: none; }

/* ══ ПУЗЫРИ ЧАТА ══ */
.bubble-user-wrap {
  display: flex; justify-content: flex-end; padding-right: 16px;
}
/* Просто пилюля, без хвостика */
.bubble-user {
  background: #3a3a3c; color: #fff;
  padding: 11px 16px; border-radius: 20px;
  font-size: 17px; max-width: 78%; line-height: 1.4;
}

.bubble-ai {
  align-self: flex-start; color: #fff;
  padding: 4px 20px; font-size: 17px;
  line-height: 1.55; width: 100%;
}

.bubble-typing {
  align-self: flex-start; padding: 14px 20px;
  display: flex; gap: 5px; align-items: center;
}
.dot {
  width: 7px; height: 7px; background: #666; border-radius: 50%;
  animation: dotpulse 1.2s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotpulse {
  0%,80%,100% { opacity: 0.3; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

/* ══ ДИАЛОГ УДАЛЕНИЯ ══ */
.delete-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  padding: 0 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s ease;
}
.delete-overlay.open { opacity: 1; pointer-events: all; }
.delete-dialog {
  width: 100%; max-width: 310px;
  display: flex; flex-direction: column;
  position: relative;
  transform: scale(1.08); opacity: 0;
  transition: transform 0.28s cubic-bezier(0.34, 1.38, 0.64, 1), opacity 0.22s ease;
}
.delete-overlay.open .delete-dialog { transform: scale(1); opacity: 1; }
.delete-dialog img { width: 100%; display: block; }
.delete-dialog img:first-child { border-radius: 29px 29px 0 0; }
.delete-dialog img:last-child  { border-radius: 0 0 29px 29px; }

/* Диктовка — анимация микрофона */
.mic-recording { animation: micPulse 1s ease-in-out infinite; }
@keyframes micPulse {
  0%,100% { filter: brightness(1); }
  50%      { filter: brightness(1.8) drop-shadow(0 0 6px #ff3b30); }
}

/* ══ ЗАГЛУШКА — не PWA ══ */
#pwa-gate {
  position: fixed; inset: 0; z-index: 9999;
  background: #000;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 32px; text-align: center;
  gap: 20px;
}
#pwa-gate img {
  width: 96px; height: 96px; border-radius: 22px;
  margin-bottom: 4px;
}
#pwa-gate-title {
  font-size: 18px; font-weight: 600;
  color: #fff; line-height: 1.4; letter-spacing: -0.3px;
}
#pwa-gate-sub {
  font-size: 13px; color: rgba(255,255,255,0.4);
  line-height: 1.5;
}
</style>
</head>

<script>
/* ══ ХРАНИЛИЩЕ ══ */
function loadChats() {
  try { return JSON.parse(localStorage.getItem('siri_chats') || '[]'); } catch { return []; }
}
function saveChats(arr) {
  try { localStorage.setItem('siri_chats', JSON.stringify(arr)); } catch {}
}

let chats = loadChats();
let editingMode = false;
let longPressTimer = null;
let currentChatId = null;
let currentMessages = []; // история для API
let abortController = null; // для остановки генерации
let isGenerating = false;

const GROQ_API_KEY = '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';
const GROQ_MODEL = 'meta-llama/llama-4-scout-17b-16e-instruct';
const SYSTEM_PROMPT = 'Ты — Siri, умный, эмпатичный AI-помощник для ежедневного общения и бизнес-задач. Ответы формируй самостоятельно, без вызова внешних функций и инструментов. На простые приветствия, реплики и светскую беседу отвечай коротко, тепло и по-человечески, как живой собеседник, не перегружая текст оформлением. Переходи к строгой структуре (заголовкам, спискам, разделителям) только при решении комплексных вопросов. Если пользователь просит сделать расчеты или аналитику, в обязательном порядке используй LaTeX-разметку ($inline$ или$$display$$) для формул. Тексты для постов пиши в сдержанном, но дружелюбном и вовлекающем стиле.';

/* ══ ДАТА ══ */
function formatDate(ts) {
  const d = new Date(ts), now = new Date();
  const diff = now - d;
  if (diff < 86400000 && d.getDate() === now.getDate()) return 'Сегодня';
  if (diff < 172800000) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

/* ══ КАРТОЧКИ ══ */
function renderCards() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  chats.forEach((chat, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (editingMode ? ' wobble' : '');
    card.innerHTML = `
      <button class="card-delete" data-i="${i}">
        <svg viewBox="0 0 14 14" fill="none" stroke="#ff3b30" stroke-width="2.4" stroke-linecap="round">
          <line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/>
        </svg>
      </button>
      <div class="card-date">${formatDate(chat.ts)}</div>
      <div class="card-title">${escHtml(chat.title)}</div>
      <div class="card-preview">${escHtml(chat.preview)}</div>
    `;
    if (!editingMode) card.addEventListener('click', () => openChatById(chat.id));
    card.addEventListener('pointerdown', startLongPress);
    card.addEventListener('pointerup', cancelLongPress);
    card.addEventListener('pointercancel', cancelLongPress);
    card.addEventListener('pointermove', cancelLongPress);
    card.querySelector('.card-delete').addEventListener('click', e => {
      e.stopPropagation();
      deleteChat(e, parseInt(e.currentTarget.dataset.i));
    });
    grid.appendChild(card);
  });
  grid.classList.toggle('editing-mode', editingMode);
  document.getElementById('homeScroll').classList.toggle('editing-mode', editingMode);
  document.getElementById('homeTitle').style.display = editingMode ? 'none' : '';
  document.getElementById('btnSettings').style.display = editingMode ? 'none' : '';
  document.getElementById('btnDone').style.display = editingMode ? '' : 'none';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function startLongPress() {
  cancelLongPress();
  longPressTimer = setTimeout(() => { if (!editingMode) { editingMode = true; renderCards(); } }, 480);
}
function cancelLongPress() { clearTimeout(longPressTimer); }
function exitEditing() { editingMode = false; renderCards(); }

/* ══ УДАЛЕНИЕ ══ */
let pendingDeleteIndex = null;
function deleteChat(e, i) {
  e.stopPropagation();
  pendingDeleteIndex = i;
  document.getElementById('deleteOverlay').classList.add('open');
}
function closeDeleteDialog() {
  document.getElementById('deleteOverlay').classList.remove('open');
  pendingDeleteIndex = null;
}
function confirmDelete() {
  if (pendingDeleteIndex === null) return;
  chats.splice(pendingDeleteIndex, 1);
  saveChats(chats);
  closeDeleteDialog();
  renderCards();
  if (chats.length === 0) exitEditing();
}
document.getElementById('dialogConfirmDelete').addEventListener('click', confirmDelete);
document.getElementById('dialogCancel').addEventListener('click', closeDeleteDialog);
document.getElementById('deleteOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('deleteOverlay')) closeDeleteDialog();
});

/* ══ НАВИГАЦИЯ ══ */
function openNewChat() {
  exitEditing();
  currentChatId = null;
  currentMessages = [];
  document.getElementById('home').classList.remove('active');
  document.getElementById('chat').classList.add('active');
  document.getElementById('chatMessages').innerHTML = '';
  document.getElementById('chatInput').value = '';
  toggleControls();
}

function openChatById(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  exitEditing();
  currentChatId = id;
  // Восстанавливаем историю для API
  currentMessages = (chat.messages || []).map(m => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    content: m.text
  }));
  document.getElementById('home').classList.remove('active');
  document.getElementById('chat').classList.add('active');
  const msgs = document.getElementById('chatMessages');
  msgs.innerHTML = '';
  (chat.messages || []).forEach(m => appendBubble(m.role, m.text));
  msgs.scrollTop = msgs.scrollHeight;
  document.getElementById('chatInput').value = '';
  toggleControls();
}

function goHome() {
  if (isGenerating) stopGeneration();
  document.getElementById('chat').classList.remove('active');
  document.getElementById('home').classList.add('active');
  renderCards();
}

/* ══ ПУЗЫРИ ══ */
function appendBubble(role, text) {
  const msgs = document.getElementById('chatMessages');
  if (role === 'user') {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-user-wrap';
    const bub = document.createElement('div');
    bub.className = 'bubble-user';
    bub.textContent = text;
    wrap.appendChild(bub);
    msgs.appendChild(wrap);
  } else {
    const el = document.createElement('div');
    el.className = 'bubble-ai';
    el.textContent = text;
    msgs.appendChild(el);
  }
  msgs.scrollTop = msgs.scrollHeight;
}

/* ══ УПРАВЛЕНИЕ КНОПКАМИ ══ */
const chatInput = document.getElementById('chatInput');
const btnMic    = document.getElementById('btnMic');
const btnSend   = document.getElementById('btnSend');
const btnStop   = document.getElementById('btnStop');
const inputBar  = document.getElementById('inputBar');

function toggleControls() {
  const hasText = chatInput.value.trim().length > 0;
  if (isGenerating) {
    btnMic.style.display  = 'none';
    btnSend.style.display = 'none';
    btnStop.style.display = 'flex';
    inputBar.classList.add('thinking');
    chatInput.placeholder = 'Думаю…';
  } else {
    btnStop.style.display = 'none';
    inputBar.classList.remove('thinking');
    chatInput.placeholder = 'Спросите Siri';
    if (hasText) {
      btnMic.style.display  = 'none';
      btnSend.style.display = 'flex';
    } else {
      btnMic.style.display  = 'flex';
      btnSend.style.display = 'none';
    }
  }
}

chatInput.addEventListener('input', toggleControls);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !isGenerating) sendMessage(); });

/* ══ ОСТАНОВКА ГЕНЕРАЦИИ ══ */
function stopGeneration() {
  if (abortController) abortController.abort();
  isGenerating = false;
  toggleControls();
  // Убираем typing-индикатор если есть
  const typing = document.querySelector('.bubble-typing');
  if (typing) typing.remove();
}
btnStop.addEventListener('click', stopGeneration);

/* ══ ОТПРАВКА И GROQ API ══ */
async function sendMessage() {
  const val = chatInput.value.trim();
  if (!val || isGenerating) return;

  appendBubble('user', val);
  currentMessages.push({ role: 'user', content: val });
  chatInput.value = '';
  isGenerating = true;
  toggleControls();

  // Typing indicator
  const msgs = document.getElementById('chatMessages');
  const typing = document.createElement('div');
  typing.className = 'bubble-typing';
  typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;

  abortController = new AbortController();

  try {
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      signal: abortController.signal,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...currentMessages
        ],
        max_tokens: 1024,
        temperature: 0.7
      })
    });

    typing.remove();

    if (!resp.ok) throw new Error(`Ошибка API: ${resp.status}`);
    const data = await resp.json();
    const aiText = data.choices?.[0]?.message?.content?.trim() || 'Не удалось получить ответ.';

    currentMessages.push({ role: 'assistant', content: aiText });
    appendBubble('ai', aiText);
    playReplySound();

    // Сохраняем в историю
    if (currentChatId) {
      const chat = chats.find(c => c.id === currentChatId);
      if (chat) {
        chat.messages.push({ role: 'user', text: val });
        chat.messages.push({ role: 'ai', text: aiText });
        chat.ts = Date.now();
      }
    } else {
      const id = 'chat_' + Date.now();
      currentChatId = id;
      chats.unshift({
        id, ts: Date.now(),
        title: val.length > 50 ? val.slice(0, 50) + '…' : val,
        preview: aiText.slice(0, 62) + '…',
        messages: [
          { role: 'user', text: val },
          { role: 'ai', text: aiText }
        ]
      });
    }
    saveChats(chats);

  } catch (err) {
    typing.remove();
    if (err.name !== 'AbortError') {
      appendBubble('ai', 'Произошла ошибка. Проверьте соединение и попробуйте снова.');
    }
  }

  isGenerating = false;
  abortController = null;
  toggleControls();
}

btnSend.addEventListener('click', sendMessage);

/* ══ ДИКТОВКА (Speech-to-Text) ══ */
let recognition = null;
let isRecording = false;

function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;
  const r = new SpeechRecognition();
  r.lang = 'ru-RU';
  r.continuous = false;
  r.interimResults = true;
  r.onresult = e => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    chatInput.value = final || interim;
    toggleControls();
  };
  r.onend = () => {
    isRecording = false;
    btnMic.classList.remove('mic-recording');
    toggleControls();
  };
  r.onerror = () => {
    isRecording = false;
    btnMic.classList.remove('mic-recording');
    toggleControls();
  };
  return r;
}

btnMic.addEventListener('click', () => {
  if (isGenerating) return;
  if (!recognition) recognition = initSpeechRecognition();
  if (!recognition) { alert('Диктовка не поддерживается в этом браузере.'); return; }
  if (isRecording) {
    recognition.stop();
  } else {
    isRecording = true;
    btnMic.classList.add('mic-recording');
    recognition.start();
  }
});

/* ══ НАСТРОЙКИ ══ */
function openSettings() { document.getElementById('settingsOverlay').classList.add('open'); }
function closeSettings() { document.getElementById('settingsOverlay').classList.remove('open'); }

/* ══ АНИМАЦИЯ КНОПОК ══ */
function initTapAnimation() {
  document.querySelectorAll('.txbtn').forEach(btn => {
    btn.addEventListener('pointerdown', () => {
      btn.classList.remove('tapped');
      void btn.offsetWidth;
      btn.classList.add('tapped');
    });
    btn.addEventListener('animationend', () => btn.classList.remove('tapped'));
  });
}

/* ══ СОБЫТИЯ ══ */
document.getElementById('btnSettings').addEventListener('click', openSettings);
document.getElementById('btnDone').addEventListener('click', exitEditing);
document.getElementById('newChatBtn1').addEventListener('click', openNewChat);
document.getElementById('newChatBtn2').addEventListener('click', openNewChat);
document.getElementById('settingsCloseBtn').addEventListener('click', closeSettings);
document.getElementById('settingsBackdrop').addEventListener('click', closeSettings);
document.getElementById('goHomeBtn').addEventListener('click', goHome);

document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());

renderCards();
initTapAnimation();

/* ══ ПРОВЕРКА PWA ══ */
(function() {
  const isStandalone =
    window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches ||
    window.matchMedia('(display-mode: fullscreen)').matches;
  if (!isStandalone) {
    document.getElementById('pwa-gate').style.display = 'flex';
    // Блокируем всё остальное
    document.querySelectorAll('.screen').forEach(s => {
      s.style.pointerEvents = 'none';
      s.style.opacity = '0';
    });
  }
})();

const replySound = new Audio('/src/sound.mp3');
replySound.preload = 'auto';
function playReplySound() {
  replySound.currentTime = 0;
  replySound.play().catch(() => {});
}
