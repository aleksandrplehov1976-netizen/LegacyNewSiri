<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Папки</title>
<style>
:root{--bg1:#fbfbfd;--bg2:#e8e8ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b2b30;--bg2:#111113}}
:root[data-theme="dark"]{--bg1:#2b2b30;--bg2:#111113}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg2);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2));font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif}
#sa{position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#stage{position:fixed;inset:0;perspective-origin:50% 35%;transform-style:preserve-3d}
.f{position:absolute;left:50%;top:0;transform-origin:50% 0;transform-style:preserve-3d;will-change:transform}

.tab,.bb,.front,.inner,.up,.lo{position:absolute}

/* Язычок и задняя стенка */
.tab{left:calc(var(--u)*9);top:0;width:calc(var(--u)*362);height:calc(var(--u)*74);border-radius:calc(var(--u)*40) calc(var(--u)*37) 0 0}
.bb{left:calc(var(--u)*9);right:calc(var(--u)*9);top:calc(var(--u)*37);border-radius:0 calc(var(--u)*32) 0 0}

/* Бумага с контентом */
.inner{
  left:calc(var(--u)*22);right:calc(var(--u)*22);top:calc(var(--u)*74);
  transform:translateZ(3px); /* Слой бумаги */
  border-radius:12px 12px 0 0;overflow:auto;box-sizing:border-box;
  padding:24px 22px 40px;color:#3a3a3c;background:#fffefd;
  box-shadow:inset 0 10px 14px -10px rgba(0,0,0,.16);-webkit-overflow-scrolling:touch;
  will-change:opacity;
}
.inner h2{margin:0 0 4px;font-size:32px;font-weight:600;letter-spacing:-.6px}
.inner small{display:block;margin-bottom:16px;opacity:.5;font-size:13px}
.inner p{margin:0 0 14px;font-size:16px;line-height:1.5}

/* Обложка */
.front{left:0;right:0;top:calc(var(--u)*60);transform-origin:50% 100%;transform-style:preserve-3d;will-change:transform}
.up,.lo{left:0;right:0;transform-style:preserve-3d}
.up{top:0;transform-origin:50% 100%;border-radius:calc(var(--u)*32) calc(var(--u)*32) 0 0;box-shadow:0 -3px 18px rgba(0,0,0,.13)}
.lo{bottom:0;box-shadow:0 0 18px rgba(0,0,0,.09)}

.face,.rev,.sh{position:absolute;inset:0;border-radius:inherit}
.face,.rev{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.rev{transform:rotateX(180deg);box-shadow:inset 0 0 0 999px rgba(0,0,0,.1)}
.sh{background:#000;opacity:var(--sh,0);pointer-events:none}
.label{position:absolute;left:calc(var(--u)*40);top:calc(var(--u)*30);line-height:1;font-weight:400;letter-spacing:-.02em;white-space:nowrap}
#strip{position:fixed;left:0;right:0;bottom:0;height:200px;z-index:99;display:none;touch-action:none}
</style>
</head>
<body>
<div id="sa"></div><div id="stage"></div><div id="strip"></div>
<script>
const DATA=[
 {t:"A1",b:"#7FB5B5",f:"#8CC2C2",c:"#fff"},
 {t:"A2",b:"#A18594",f:"#AD94A1",c:"#fff"},
 {t:"B1",b:"#FF9BAA",f:"#FFA9B6",c:"#fff"},
 {t:"B2",b:"#EAE0C8",f:"#F0E8D4",c:"#555"},
 {t:"Носитель (C)",b:"#FFF0F5",f:"#FFF5F8",c:"#555"}
];
const LOREM="Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.";

const stage=document.getElementById("stage"),
      strip=document.getElementById("strip"),
      sa=document.getElementById("sa");
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const n=DATA.length, els=[];
let H=0,W=0,u=0,step=0,ys=[],top0=0,sab=0,Uh=0,Hf=0,o=-1;

const s={p:0,v:0,t:0};

DATA.forEach((d,i)=>{
  const f=document.createElement("div");
  f.className="f";
  f.innerHTML=
   `<div class="tab" style="background:${d.b}"></div>`+
   `<div class="bb" style="background:${d.b}"></div>`+
   `<div class="inner"><h2>${d.t}</h2><small>Заметки · обновлено сегодня</small><p>${LOREM}</p><p>${LOREM}</p><p>${LOREM}</p></div>`+
   `<div class="front">`+
     `<div class="lo"><div class="face" style="background:${d.f}"></div><div class="rev" style="background:${d.f}"></div></div>`+
     `<div class="up"><div class="face" style="background:${d.f}"><div class="label" style="color:${d.c}">${d.t}</div><div class="sh"></div></div><div class="rev" style="background:${d.f}"></div></div>`+
   `</div>`;
  stage.appendChild(f);

  const e={
    f,
    tab:  f.querySelector(".tab"),
    bb:   f.querySelector(".bb"),
    inner:f.querySelector(".inner"),
    front:f.querySelector(".front"),
    up:   f.querySelector(".up"),
    lo:   f.querySelector(".lo"),
    label:f.querySelector(".label")
  };
  els.push(e);

  e.front.addEventListener("click", ()=>{ if(o<0) open(i); });
  e.tab  .addEventListener("click", ()=>{ if(o===i && s.p>0.9) close(); });
});

function layout(){
  H=innerHeight;
  const cs=getComputedStyle(sa);
  top0=(parseFloat(cs.paddingTop)||0)+22;
  sab =parseFloat(cs.paddingBottom)||0;

  W=Math.min(innerWidth-32,460);
  u=W/725;
  stage.style.setProperty("--u",u+"px");
  stage.style.perspective=Math.max(1600,H*2.6)+"px";

  step=Math.min(204*u,(H-sab-top0-60*u-210)/4);
  ys=DATA.map((_,i)=>top0+i*step);
  Uh=Math.min(H*0.5,320);
  Hf=H-60*u; 

  els.forEach(e=>{
    e.f.style.width=W+"px";
    e.f.style.marginLeft=(-W/2)+"px";
    e.f.style.height=H+"px";

    e.tab  .style.height=(74*u)+"px";
    e.bb   .style.height=(H-37*u)+"px";
    e.front.style.height=Hf+"px";
    e.up   .style.height=Uh+"px";
    e.lo   .style.height=(Hf-Uh)+"px";
    /* Уменьшили высоту бумаги, чтобы внизу осталось место для стопки папок */
    e.inner.style.height=Math.max(120,H-sab-top0-74*u-140)+"px"; 
    e.label.style.fontSize=Math.min(96*u,step*0.48)+"px";
  });
  render();
}

function render(){
  const p=s.p;
  /* Точка, с которой начинается стопка папок внизу */
  const base = H-sab-130;

  els.forEach((e,i)=>{
    let ty=0, sc=1, z=i*12, th=0, flex=0, op=1;

    if(o>=0 && i===o){
      /* АКТИВНАЯ (ОТКРЫТАЯ) ПАПКА */
      ty = (top0-ys[i])*p;
      z  = 250; // Уезжает далеко вперед, поверх всех остальных
      th = 180*clamp(p,0,1);
      flex = clamp(s.v*9,-14,14);
      
      // Контент появляется с легким запозданием, чтобы обложка успела открыться
      op = clamp((p - 0.1) / 0.7, 0, 1); 
      
    }else if(o>=0){
      /* ОСТАЛЬНЫЕ ПАПКИ (СПОЛЗАЮТ ВНИЗ В СТОПКУ) */
      const r = i<o ? i : i-1;
      const d = 0.06*(n-1-i);
      const q = clamp((p-d)/(1-d),0,1);
      
      ty = (base+r*24-ys[i])*q; // Выстраиваются в стопку
      sc = 1-0.06*q; // Чуть уменьшаются
      z  = i*12;
    }

    e.f.style.transform=`translate3d(0,${(ys[i]+ty).toFixed(2)}px,${z}px) scale(${sc.toFixed(4)})`;
    /* Обложка на 6px, бумага на 3px. Это гарантирует, что обложка всегда перекрывает бумагу, но не перекрывает язычки следующих папок */
    e.front.style.transform=`translateZ(6px) rotateX(${(-th).toFixed(2)}deg)`;
    e.front.style.setProperty("--sh",(0.3*Math.sin(th*Math.PI/180)).toFixed(3));
    e.up.style.transform=`rotateX(${flex.toFixed(2)}deg)`;
    
    /* Фейдим внутренний контент */
    if(i===o) {
      e.inner.style.opacity = op.toFixed(3);
    } else {
      e.inner.style.opacity = 1;
    }
  });

  strip.style.display=(o>=0 && p>0.5)?"block":"none";
}

let last=0, raf=0;
function loop(t){
  const dt=Math.min(0.032,((t-last)/1000)||0.016);
  last=t;

  const k=200, c=27;
  s.v += (k*(s.t-s.p)-c*s.v)*dt;
  s.p += s.v*dt;

  if(Math.abs(s.v)<0.0015 && Math.abs(s.t-s.p)<0.0008){
    s.p=s.t; s.v=0;
    if(s.t===0) o=-1;
    render();
    raf=0;
    return;
  }
  render();
  raf=requestAnimationFrame(loop);
}
function go(){ if(!raf){ last=performance.now(); raf=requestAnimationFrame(loop); } }
function open(i){ if(o>=0) return; o=i; s.t=1; go(); }
function close(){ if(o<0) return; s.t=0; go(); }

let sy=0, done=false;
strip.addEventListener("pointerdown",e=>{ strip.setPointerCapture(e.pointerId); sy=e.clientY; done=false; });
strip.addEventListener("pointermove",e=>{ if(!done && sy-e.clientY>14){ done=true; close(); } });
strip.addEventListener("pointerup",()=>{ if(!done){ done=true; close(); } });

addEventListener("resize",layout);
layout();
</script>
</body>
</html>
