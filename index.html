<!DOCTYPE html>
<html lang="ru" data-platform="ios" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ЛИнТех</title>

    <!-- IBM Plex Mono Thin (300) — только Thin везде -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Roboto (для Android) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Material Icons (для всех иконок интерфейса) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <!-- Шрифт для времени (time.ttf) -->
    <style>
        @font-face {
            font-family: 'TimeFont';
            src: url('time.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-synthesis: none;
        }

        /* ============================================================
           ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
           ============================================================ */
        :root[data-platform="ios"][data-theme="light"] {
            --section-bg-color: rgba(255, 255, 255, 0.85);
            --secondary-bg-color: rgba(0, 0, 0, 0.05);
            --tertiary-fill-background: rgba(116, 116, 128, 0.12);
            --text-color: #000000;
            --link-color: #1623C1;
            --glass-box-shadow: -0.6px -0.5px 0 0 rgba(255,255,255,0.3) inset,
                                0.5px 0.6px 0 0 rgba(255,255,255,0.3) inset,
                                0 1px 1px 0 rgba(116,116,128,0.02),
                                0 2px 16px 1px rgba(0,0,0,0.06);
            --text-secondary: #8e8e93;
            --text-tertiary: #aeaeb2;
            --glass-border: rgba(255,255,255,0.3);
            --font-weight: 300;
            --page-bg: #f2f2f7;
        }
        :root[data-platform="ios"][data-theme="dark"] {
            --section-bg-color: rgba(28, 28, 30, 0.85);
            --secondary-bg-color: rgba(255, 255, 255, 0.05);
            --tertiary-fill-background: rgba(118, 118, 128, 0.24);
            --text-color: #ffffff;
            --link-color: #3b4be0;
            --glass-box-shadow: -0.6px -0.5px 0 0 rgba(255,255,255,0.1) inset,
                                0.5px 0.6px 0 0 rgba(255,255,255,0.1) inset,
                                0 1px 1px 0 rgba(116,116,128,0.02),
                                0 2px 16px 1px rgba(0,0,0,0.3);
            --text-secondary: #98989e;
            --text-tertiary: #636366;
            --glass-border: rgba(255,255,255,0.1);
            --font-weight: 300;
            --page-bg: #000000;
        }

        /* Android переменные */
        [data-platform="android"][data-theme="light"] {
            --android-primary: #1623C1;
            --android-on-primary: rgb(255 255 255);
            --android-primary-container: rgb(210 227 255);
            --android-on-primary-container: rgb(0 39 94);
            --android-surface: rgb(248 250 255);
            --android-on-surface: rgb(26 28 35);
            --android-surface-container-low: rgb(242 244 250);
            --android-surface-container: rgb(236 238 244);
            --android-on-surface-variant: rgb(66 70 80);
            --android-outline: rgb(115 119 130);
            --font-weight: 300;
            --page-bg: rgb(248 250 255);
        }
        [data-platform="android"][data-theme="dark"] {
            --android-primary: #3b4be0;
            --android-on-primary: rgb(0 60 138);
            --android-primary-container: rgb(30 60 110);
            --android-on-primary-container: rgb(210 227 255);
            --android-surface: rgb(18 19 24);
            --android-on-surface: rgb(227 227 235);
            --android-surface-container-low: rgb(26 28 35);
            --android-surface-container: rgb(30 32 39);
            --android-on-surface-variant: rgb(190 194 205);
            --android-outline: rgb(136 140 152);
            --font-weight: 300;
            --page-bg: rgb(18 19 24);
        }

        :root {
            --app-nav-bar-selector-transition-duration: 0.2s;
            --sum-inset-bottom: 0px;
            --sum-inset-left: 0px;
            --sum-inset-right: 0px;
            --ios-safe-area-bottom: 0px;
        }

        /* ============================================================
           ГЛОБАЛЬНЫЕ СТИЛИ
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0;
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            font-weight: 300;
            background: #f2f2f7;
            transition: background 0.3s ease;
            overflow: hidden;
        }

        [data-platform="android"] body {
            font-family: 'IBM Plex Mono', 'Roboto', sans-serif;
            font-weight: 300;
            background: var(--android-surface);
        }

        [data-theme="dark"] body {
            background: #000000;
        }
        [data-platform="android"][data-theme="dark"] body {
            background: var(--android-surface);
        }

        /* ВСЕМ ТЕКСТАМ — THIN (300) */
        * {
            font-weight: 300 !important;
        }

        /* ============================================================
           СПЛЕШСКРИН
           ============================================================ */
        #splashScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--page-bg, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-ascii {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5px;
            user-select: none;
        }
        .splash-row {
            display: flex;
            gap: 1.5px;
        }
        .splash-char {
            display: inline-block;
            font-size: 4px;
            line-height: 1.2;
            width: 2.5px;
            height: 5px;
            font-family: 'Courier New', monospace;
            color: var(--link-color, #1623C1);
            opacity: 0;
            transition: opacity 0.02s ease;
            text-align: center;
            font-weight: 300 !important;
        }
        .splash-char.revealed { opacity: 1; }
        .splash-char.space { color: transparent; }
        @media (max-width: 480px) {
            .splash-char { font-size: 3px; width: 2px; height: 4px; }
            .splash-row { gap: 1px; }
            .splash-ascii { gap: 1px; }
        }
        @media (min-width: 768px) {
            .splash-char { font-size: 6px; width: 4px; height: 7px; }
            .splash-row { gap: 2px; }
            .splash-ascii { gap: 2px; }
        }

        /* ============================================================
           КОНТЕЙНЕР ПРИЛОЖЕНИЯ
           ============================================================ */
        #app {
            display: none;
            height: 100vh;
            flex-direction: column;
            background: var(--page-bg, #ffffff);
        }
        #app.active {
            display: flex;
        }

        .demo-content {
            flex: 1;
            overflow: hidden;  /* чтобы страницы не вылезали */
            position: relative; /* для абсолютного позиционирования страниц */
            padding: 0 0 70px 0;
            -webkit-overflow-scrolling: touch;
        }

        /* ============================================================
           ПЕРЕХОДЫ МЕЖДУ СТРАНИЦАМИ (iOS‑подобные анимации)
           ============================================================ */
        .page-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            transition: opacity 0.4s cubic-bezier(0.3, 0.8, 0.6, 1),
                        transform 0.4s cubic-bezier(0.3, 0.8, 0.6, 1);
            pointer-events: none;
            visibility: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 0 10px 0;
            background: var(--page-bg, #ffffff);
        }

        .page-container.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            visibility: visible;
        }

        .page-content {
            padding: 16px 16px 0;
            flex: 1;
        }

        /* ============================================================
           СТИЛИ ДЛЯ КОНТЕНТА
           ============================================================ */
        .date-display {
            display: flex;
            align-items: baseline;
            gap: 0;
            margin-bottom: 2px;
        }
        .date-digit {
            font-family: 'TimeFont', 'IBM Plex Mono', monospace;  /* ИСПРАВЛЕНО: теперь TimeFont */
            font-size: 52px;
            line-height: 1;
            color: var(--text-color);
            font-weight: 300 !important;
        }
        .date-dot {
            font-family: 'TimeFont', 'IBM Plex Mono', monospace;  /* ИСПРАВЛЕНО: теперь TimeFont */
            font-size: 44px;
            line-height: 1;
            color: var(--text-color);
            letter-spacing: -0.6px;
            transform: translateY(12px);
            display: inline-block;
            font-weight: 300 !important;
        }

        .subtitle {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 18px;
            letter-spacing: -0.6px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 300 !important;
        }

        .category-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 4px 0 12px;
            margin-left: 0;
            margin-right: -16px;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        .category-scroll-inner {
            display: flex;
            gap: 10px;
            padding: 0 16px;
        }
        .category-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 16px;
            letter-spacing: -0.6px;
            padding: 12px 20px;
            border-radius: 9999px;
            border: none;
            background: var(--secondary-bg-color);
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            flex-shrink: 0;
            font-weight: 300 !important;
        }
        .category-btn:active { transform: scale(0.94); }
        .category-btn.active {
            background: var(--link-color);
            color: white;
        }

        .post-card {
            margin: 6px 0;
            padding: 12px 8px;
            border-radius: 20px;
            background: var(--secondary-bg-color);
            transition: background 0.3s, transform 0.15s;
        }
        .post-card:active { transform: scale(0.98); }
        .post-image {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 28px;
            background: var(--secondary-bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .post-image .material-symbols-outlined {
            font-size: 40px;
        }
        .post-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 17px;
            letter-spacing: -0.6px;
            color: var(--text-color);
            font-weight: 300 !important;
        }
        .post-desc {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            letter-spacing: -0.6px;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 4px 0 8px;
            font-weight: 300 !important;
        }
        .post-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }
        .glass-pill {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 14px;
            border-radius: 9999px;
            background: var(--section-bg-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-box-shadow);
        }
        .glass-pill button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            color: var(--text-secondary);
            transition: color 0.2s, transform 0.15s;
            font-family: 'Material Symbols Outlined', sans-serif;
            font-weight: 400;
        }
        .glass-pill button:active { transform: scale(0.85); }
        .glass-pill button.liked {
            color: var(--link-color);
        }
        .glass-pill button.disliked {
            color: var(--link-color);
        }
        .glass-btn {
            padding: 10px 14px;
            border-radius: 9999px;
            background: var(--section-bg-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-box-shadow);
            font-size: 20px;
            color: var(--link-color);
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            font-family: 'Material Symbols Outlined', sans-serif;
            font-weight: 400;
        }
        .glass-btn:active { transform: scale(0.92); }

        /* ============================================================
           РАСПИСАНИЕ — улучшенные отступы, убрана пульсация
           ============================================================ */
        .schedule-class-select {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            min-height: 60vh;
        }
        .schedule-class-select h2 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 24px;
            letter-spacing: -0.6px;
            margin-bottom: 16px;
            font-weight: 300 !important;
        }

        .wheel-picker-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
        }
        .wheel-picker-col {
            width: 84px;
            height: 150px;
            position: relative;
        }

        .wheel-picker {
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            height: 150px;
            width: 100%;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding: 50px 0;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 44px, #000 106px, transparent 150px);
            mask-image: linear-gradient(to bottom, transparent 0, #000 44px, #000 106px, transparent 150px);
        }
        .wheel-picker::-webkit-scrollbar { display: none; }

        .wheel-item {
            scroll-snap-align: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 28px;
            padding: 8px 0;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: color 0.15s ease, transform 0.15s ease;
            cursor: pointer;
            flex-shrink: 0;
            font-weight: 300 !important;
            width: 100%;
        }
        .wheel-item.active {
            color: var(--text-color);
            transform: scale(1.2);
            font-weight: 300 !important;
        }

        .wheel-separator {
            font-size: 32px;
            color: var(--text-secondary);
            padding: 0 8px;
            font-weight: 300 !important;
        }

        .schedule-class-display {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 32px;
            letter-spacing: -0.6px;
            margin: 8px 0 12px;
            font-weight: 300 !important;
        }
        .schedule-hint {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            letter-spacing: -0.6px;
            color: var(--text-secondary);
            text-align: center;
            max-width: 320px;
            margin: 8px 0 16px;
            line-height: 1.5;
            font-weight: 300 !important;
        }
        .btn-primary {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 16px;
            letter-spacing: -0.6px;
            color: white;
            background: var(--link-color);
            border: none;
            padding: 14px 40px;
            border-radius: 9999px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: background 0.2s, opacity 0.2s, transform 0.15s;
            font-weight: 300 !important;
        }
        .btn-primary:active { opacity: 0.8; transform: scale(0.96); }

        .schedule-content { padding: 8px 16px 16px; }
        .schedule-timer-label {
            font-family: 'TimeFont', 'IBM Plex Mono', monospace;
            font-style: normal;
            font-size: 16px;
            letter-spacing: -0.6px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 300 !important;
        }
        .schedule-big-number {
            font-family: 'TimeFont', 'IBM Plex Mono', monospace;
            font-style: normal;
            font-size: 120px;
            line-height: 1.1;          /* увеличен для читаемости */
            color: var(--text-color);
            margin: 12px 0 16px;        /* ИСПРАВЛЕНО: нормальные отступы, без пульсации */
            font-weight: 300 !important;
        }

        .day-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 4px 0 12px;
            margin-left: 0;
            margin-right: -16px;
        }
        .day-scroll::-webkit-scrollbar { display: none; }
        .day-scroll-inner {
            display: flex;
            gap: 10px;
            padding: 0 16px;
        }
        .day-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 16px;
            letter-spacing: -0.6px;
            padding: 12px 20px;
            border-radius: 9999px;
            border: none;
            background: var(--secondary-bg-color);
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            flex-shrink: 0;
            font-weight: 300 !important;
        }
        .day-btn:active { transform: scale(0.94); }
        .day-btn.active {
            background: var(--link-color);
            color: white;
            transform: scale(1.05);
        }
        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--secondary-bg-color);
            border-radius: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .lesson-item:active {
            background: var(--section-bg-color);
            transform: scale(0.97);
        }
        .lesson-name {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 17px;
            letter-spacing: -0.6px;
            font-weight: 300 !important;
        }
        .lesson-room {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            letter-spacing: -0.6px;
            color: var(--text-secondary);
            font-weight: 300 !important;
        }
        .lesson-time {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 15px;
            letter-spacing: -0.6px;
            color: var(--text-secondary);
            font-weight: 300 !important;
        }

        /* ============================================================
           ОБЗОР — профиль ученика + сервисы
           ============================================================ */
        .profile-card {
            background: var(--section-bg-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-box-shadow);
            transition: transform 0.2s;
        }
        .profile-card:active { transform: scale(0.98); }
        .profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--link-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            flex-shrink: 0;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            position: relative;
            overflow: hidden;
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-avatar:active { opacity: 0.7; transform: scale(0.94); }
        .profile-info {
            flex: 1;
        }
        .profile-name {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 20px;
            letter-spacing: -0.6px;
            font-weight: 300 !important;
        }
        .profile-class {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 15px;
            letter-spacing: -0.6px;
            color: var(--text-secondary);
            font-weight: 300 !important;
        }
        .profile-edit {
            color: var(--link-color);
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.15s;
        }
        .profile-edit:active { transform: scale(0.85); }
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }
        .service-item {
            background: var(--secondary-bg-color);
            border-radius: 20px;
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .service-item:active {
            background: var(--section-bg-color);
            transform: scale(0.96);
        }
        .service-item .material-symbols-outlined {
            font-size: 32px;
            color: var(--link-color);
        }
        .service-item .service-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 15px;
            letter-spacing: -0.6px;
            margin-top: 6px;
            color: var(--text-color);
        }

        /* ============================================================
           НАВИГАЦИЯ В РАСПИСАНИИ
           ============================================================ */
        .schedule-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: transparent;
        }
        .schedule-nav-back {
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 15px;
            letter-spacing: -0.6px;
            color: var(--text-color);
            background: var(--section-bg-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-box-shadow);
            border-radius: 9999px;
            cursor: pointer;
            padding: 9px 16px 9px 12px;
            transition: opacity 0.2s, transform 0.15s;
            font-weight: 300 !important;
        }
        .schedule-nav-back:active { opacity: 0.7; transform: scale(0.96); }
        .schedule-nav-back .material-symbols-outlined {
            font-size: 18px;
        }
        .schedule-nav-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 16px;

            font-family: 'IBM Plex Mono', monospace;

            letter-spacing: -0.6px;
            margin-bottom: 8px;

            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 16px;
            background: var(--secondary-bg-color);

            font-size: 15px;

            color: var(--text-color);

            min-height: 80px;
            outline: none;
            transition: background 0.3s;
            font-weight: 300 !important;

        .lesson-note-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .btn-save-note {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 15px;
            letter-spacing: -0.6px;
            color: white;
            background: var(--link-color);
            border: none;
            padding: 10px 20px;
            border-radius: 9999px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            font-weight: 300 !important;
        }
        .btn-save-note:disabled { opacity: 0.5; }
        .btn-save-note:active { opacity: 0.8; transform: scale(0.96); }
        .save-success {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            letter-spacing: -0.6px;
            color: #34c759;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 300 !important;
        }
        .save-success .material-symbols-outlined {
            font-size: 16px;
        }
        .btn-attach-photo {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 15px;
            letter-spacing: -0.6px;
            color: var(--text-color);
            background: var(--section-bg-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            border-radius: 9999px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 300 !important;
        }
        .btn-attach-photo:active { transform: scale(0.97); }
        .btn-attach-photo .material-symbols-outlined {
            font-size: 20px;
        }

           БОЛЬШЕ

        .more-list { padding: 16px; }

            font-family: 'IBM Plex Mono', monospace;

            letter-spacing: -0.6px;

        .more-item {

            font-family: 'IBM Plex Mono', monospace;
            font-size: 16px;
            letter-spacing: -0.6px;
            color: var(--text-color);

            color: white;

        /* ============================================================
           НАВБАР (iOS и Android) — оставлен без изменений, как просили
           ============================================================ */
        .app-nav-bar {
            bottom: 0;
            left: 0;
            position: fixed;
            right: 0;
            z-index: 1000;
            --app-nav-bar-selector-transition-duration: 0.2s;
            --sum-inset-bottom: env(safe-area-inset-bottom, 0px);
            padding-bottom: calc(var(--sum-inset-bottom) + var(--ios-safe-area-bottom));
            padding-left: var(--sum-inset-left);
            padding-right: var(--sum-inset-right);
            pointer-events: none;
            display: flex;
            justify-content: center;
        }
        .app-nav-bar>* { pointer-events: auto; }

        .app-nav-bar__panel {
            border-radius: 1000px;
            height: 64px;
            margin: 0 auto 1px;
            max-width: 100%;
            padding: 3px;
            position: relative;
            width: fit-content;
        }
        .app-nav-bar__panel--ios {
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            background-color: var(--section-bg-color);
            box-shadow: 0 0 10px rgba(0,0,0,0.1), var(--glass-box-shadow);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.2s ease-out;
        }

        .app-nav-bar__list {
            align-items: center;
            border-radius: inherit;
            display: flex;
            height: 100%;
            justify-content: center;
            list-style: none;
            margin: 0;
            padding: 0;
            position: relative;
            z-index: 2;
            gap: 0;
        }

        .app-nav-bar__item {
            align-items: center;
            border-radius: inherit;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            flex: 1 0 auto;
            flex-direction: column;
            justify-content: center;
            min-height: 0;
            min-width: 82px;
            padding: 0 12px;
            position: relative;
            text-decoration: none;
            transition: color 0.2s ease-out;
            z-index: 2;
            -webkit-tap-highlight-color: transparent;
        }
        .app-nav-bar__item--active {
            color: var(--link-color);
        }

        .app-nav-bar__item-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            width: 28px;
            position: relative;
            flex-shrink: 0;
        }
        .app-nav-bar__item-icon svg {
            width: 100%;
            height: 100%;
            display: block;
            fill: currentColor;
        }

        .app-nav-bar__item-icon .nav-icon-img {
            width: 100%;
            height: 100%;
            display: block;
            transition: filter 0.2s ease;
        }
        .app-nav-bar__item:not(.app-nav-bar__item--active) .app-nav-bar__item-icon .nav-icon-img {
            filter: brightness(0) saturate(100%) invert(0%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(100%) contrast(100%);
        }
        [data-theme="dark"] .app-nav-bar__item:not(.app-nav-bar__item--active) .app-nav-bar__item-icon .nav-icon-img {
            filter: brightness(0) saturate(100%) invert(100%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(100%) contrast(100%);
        }
        .app-nav-bar__item--active .app-nav-bar__item-icon .nav-icon-img {
            filter: brightness(0) saturate(100%) invert(27%) sepia(89%) saturate(5000%) hue-rotate(205deg) brightness(100%) contrast(105%);
        }
        [data-theme="dark"] .app-nav-bar__item--active .app-nav-bar__item-icon .nav-icon-img {
            filter: brightness(0) saturate(100%) invert(36%) sepia(89%) saturate(5000%) hue-rotate(195deg) brightness(100%) contrast(110%);
        }

        .app-nav-bar__item-title {
            font-family: -apple-system, "SF Pro", BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            font-size: 10px;
            font-weight: 510;
            line-height: 12px;
            letter-spacing: 0.2px;
            margin-top: 1px;
            text-align: center;
        }
        .app-nav-bar__item--active .app-nav-bar__item-title {
            font-weight: 590;
        }

        .app-nav-bar__selector {
            border-radius: inherit;
            bottom: 3.7px;
            left: 3px;
            position: absolute;
            top: 3.7px;
            transition: transform var(--app-nav-bar-selector-transition-duration) ease-out,
                        width var(--app-nav-bar-selector-transition-duration) ease-out;
            z-index: 0;
            will-change: transform, width;
            width: 60px;
            transform: translateX(3px);
        }
        .app-nav-bar__selector-inner {
            background: var(--tertiary-fill-background);
            border-radius: inherit;
            height: 100%;
            transition: all var(--app-nav-bar-selector-transition-duration) ease-out;
            width: 100%;
            will-change: transform;
        }
        .app-nav-bar__selector-inner--ios-moving {
            background: transparent;
            transform: scale(1.2, 1.1);
        }
        .app-nav-bar__selector-border {
            border: 1px solid var(--text-color);
            border-radius: inherit;
            height: 100%;
            opacity: 0;
            transition: opacity var(--app-nav-bar-selector-transition-duration) ease-out;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .app-nav-bar__selector-border--ios-moving {
            opacity: 0.4;
        }

        /* Android NavBar */
        [data-platform="android"] .app-nav-bar {

        [data-platform="android"] .app-nav-bar__panel {

            -webkit-backdrop-filter: none;

        [data-platform="android"] .app-nav-bar__list {
            gap: 4px;
            justify-content: space-around;
            max-width: 600px;
            margin: 0 auto;
        }
        [data-platform="android"] .app-nav-bar__item {
            border-radius: 100px;
            min-width: 56px;
            padding: 4px 12px;
            flex: 1;
            max-width: 120px;
            color: var(--android-on-surface-variant);
            transition: all 0.2s ease;

        [data-platform="android"] .app-nav-bar__item--active {
            color: var(--android-primary);

        [data-platform="android"] .app-nav-bar__item-icon {
            height: 28px;
            width: 28px;

            justify-content: center;

        }
        [data-platform="android"] .app-nav-bar__item-icon .nav-icon-img {
            width: 24px;
            height: 24px;
            display: block;
            transition: filter 0.2s ease;
        }

        }
        [data-platform="android"] .app-nav-bar__item--active .app-nav-bar__item-icon .nav-icon-img {
            filter: brightness(0) saturate(100%) invert(34%) sepia(89%) saturate(5000%) hue-rotate(205deg) brightness(100%) contrast(105%);
        }
        [data-platform="android"][data-theme="dark"] .app-nav-bar__item:not(.app-nav-bar__item--active) .app-nav-bar__item-icon .nav-icon-img {
            filter: brightness(0) saturate(100%) invert(80%) sepia(0%) saturate(1000%) hue-rotate(0deg) brightness(100%) contrast(90%);

        [data-platform="android"][data-theme="dark"] .app-nav-bar__item--active .app-nav-bar__item-icon .nav-icon-img {
            filter: brightness(0) saturate(100%) invert(68%) sepia(89%) saturate(5000%) hue-rotate(195deg) brightness(100%) contrast(110%);

        [data-platform="android"] .app-nav-bar__item-title {
            font-family: 'Roboto', -apple-system, sans-serif;
            font-size: 11px;
            font-weight: 500;
            line-height: 14px;
            letter-spacing: 0.3px;
            margin-top: 0px;
        }
        [data-platform="android"] .app-nav-bar__item--active .app-nav-bar__item-title {
            font-weight: 600;
        }
        [data-platform="android"] .app-nav-bar__selector {
            display: none;
        }
        [data-platform="android"] .app-nav-bar__item {
            position: relative;
            overflow: hidden;
        }
        [data-platform="android"] .app-nav-bar__item::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 100px;
            background: var(--android-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        [data-platform="android"] .app-nav-bar__item:active::after {
            opacity: 0.12;
        }
        [data-platform="android"] .app-nav-bar__item--active::after {
            opacity: 0.08;
        }
        @media (max-width: 480px) {
            [data-platform="android"] .app-nav-bar__item {
                min-width: 44px;
                padding: 4px 8px;
            }
            [data-platform="android"] .app-nav-bar__item-icon {
                height: 24px;
                width: 24px;
            }
            [data-platform="android"] .app-nav-bar__item-icon .material-symbols-outlined {
                font-size: 20px;
            }
            [data-platform="android"] .app-nav-bar__item-icon .nav-icon-img {
                width: 20px;
                height: 20px;
            }
            [data-platform="android"] .app-nav-bar__item-title {
                font-size: 10px;
                line-height: 12px;
            }
            [data-platform="android"] .app-nav-bar__panel {
                height: 64px;
                padding: 0 4px;
            }
        }

        @media (max-width: 380px) {
            .app-nav-bar__item { min-width: 56px; padding: 0 6px; }
            .app-nav-bar__item-title { font-size: 9px; line-height: 10px; }
            .app-nav-bar__item-icon { height: 24px; width: 24px; }
            .app-nav-bar__panel { height: 56px; }
        }
        @media (min-width: 600px) {
            .app-nav-bar__item { min-width: 90px; padding: 0 16px; }
            .app-nav-bar__item-title { font-size: 11px; line-height: 13px; }
            .app-nav-bar__item-icon { height: 30px; width: 30px; }
        }

        @keyframes navAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .app-nav-bar {
            animation: navAppear 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        [data-platform="android"] .app-nav-bar {
            animation: none;
        }

        /* ============================================================
           MATERIAL ICONS НАСТРОЙКИ
           ============================================================ */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
            line-height: 1;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* ============================================================
           УБИРАЕМ ПУСТЫЕ ПРОСТРАНСТВА В НАЧАЛЕ ПИКЕРОВ
           ============================================================ */
        .category-scroll-inner,
        .day-scroll-inner {
            padding-left: 0 !important;
        }
    </style>

    <script>
        (function() {
            'use strict';

            // Определение платформы
            const isAndroid = /android/i.test(navigator.userAgent);
            const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (!isAndroid && /mac/i.test(navigator.userAgent));

            const html = document.documentElement;
            if (isAndroid) html.setAttribute('data-platform', 'android');
            else if (isIOS) html.setAttribute('data-platform', 'ios');

            // Показываем нужный навбар
            const iosNavbar = document.querySelector('.ios-navbar');
            const androidNavbar = document.querySelector('.android-navbar');
            if (isAndroid) {
                if (iosNavbar) iosNavbar.style.display = 'none';

            // ============================================================
            // 1. СПЛЕШСКРИН
            // ============================================================
            const splashArt = [
                "                        000                 ",
                "                     000000                 ",
                "                 0000000000                 ",
                "              0000000000000                 ",
                "           0000000000000000                 ",
                "         000000000000000000                 ",
                "         000000000000000000                 ",
                "      0000 0000000000000000       0000      ",
                "   0000000    0000000000000       0000000   ",
                "0000000000        000000000       0000000000",
                "0000000000         00000000       0000000000",
                "0000000000         00000000       0000000000",
                "0000000000         00000000       0000000000",
                "0000000000         00000000       0000000000",
                "0000000000         00000000       0000000000",
                "0000000000         00000000       0000000000",
                "0000000000         00000000       0000000000",
                "0000000000         00000000       0000000000",
                "0000000000         00000000       0000000000",
                "0000000000         00000000       0000000000",
                "0000000000         00000000       0000000000",
                "0000000000         00000000       0000000000",
                "                                            "
            ];

            function renderSplash() {
                const container = document.getElementById('splashAscii');
                container.innerHTML = '';
                const zeroCells = [];
                for (const line of splashArt) {
                    const row = document.createElement('div');
                    row.className = 'splash-row';
                    for (const ch of line) {
                        const cell = document.createElement('span');
                        cell.className = 'splash-char';
                        if (ch === '0') {
                            cell.textContent = '0';
                            zeroCells.push(cell);
                        } else {
                            cell.textContent = ' ';
                            cell.classList.add('space');
                        }
                        row.appendChild(cell);
                    }
                    container.appendChild(row);
                }
                return zeroCells;
            }

            function runSplashAnimation(cells) {
                const shuffled = [...cells];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                let idx = 0;
                const total = shuffled.length;
                const startTime = performance.now();
                const duration = 3300;

                function next() {
                    const elapsed = performance.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = progress * progress;
                    const batch = Math.round(1 + (25 - 1) * eased);
                    const actual = Math.min(batch, shuffled.length - idx);
                    for (let i = 0; i < actual; i++) {
                        shuffled[idx + i].classList.add('revealed');
                    }
                    idx += actual;
                    if (idx < shuffled.length) {
                        const remaining = 1 - progress;
                        const interval = Math.max(5, 20 * (0.5 + remaining * 0.5));
                        setTimeout(next, interval);
                    } else {
                        setTimeout(() => {
                            document.getElementById('splashScreen').classList.add('hidden');
                            document.getElementById('app').classList.add('active');
                        }, 400);
                    }
                }
                setTimeout(next, 100);
            }

            // ============================================================
            // 2. ДАННЫЕ
            // ============================================================
            const postsData = [
                { title: "День знаний в лицее", desc: "В лицее прошла торжественная линейка, посвященная Дню знаний. Ученики и учителя встретили новый учебный год.", time: "2 часа назад" },
                { title: "Новая библиотека открыта", desc: "В лицее открылась новая библиотека с современными учебниками и электронными ресурсами.", time: "4 часа назад" },
                { title: "Выпускной вечер", desc: "Выпускники лицея простились со школой. Впереди - поступление в университеты и новая жизнь.", time: "6 часов назад" },
                { title: "Олимпиада по математике", desc: "Ученики лицея заняли призовые места на городской олимпиаде по математике.", time: "8 часов назад" },
                { title: "Осенний бал", desc: "В лицее прошел традиционный осенний бал. Ученики готовили номера и танцы.", time: "10 часов назад" },
                { title: "День учителя", desc: "Ученики поздравили учителей с профессиональным праздником, подготовили концерт.", time: "12 часов назад" },
                { title: "Спортивные соревнования", desc: "Команда лицея заняла первое место в городских спортивных соревнованиях.", time: "14 часов назад" },
                { title: "Экскурсия в музей", desc: "Ученики лицея посетили исторический музей в рамках учебной программы.", time: "16 часов назад" }
            ];

            const categories = ["ЛЕНТА", "МЕРЧ", "ДАЖ", "ЭНДАУМЕНТ-ФОНД"];
            const days = ["ПНД", "ВТР", "СРД", "ЧТВ", "ПТН"];
            const lessonsData = [
                { name: "Русский язык", room: "Кабинет 101", time: "09:00" },
                { name: "Математика", room: "Кабинет 205", time: "09:50" },
                { name: "Английский язык", room: "Кабинет 310", time: "10:50" },
                { name: "Физика", room: "Кабинет 412", time: "11:40" },
                { name: "История", room: "Кабинет 108", time: "12:40" }
            ];

            const moreItems = {
                "Настройки": [
                    { icon: "person", label: "Профиль" },
                    { icon: "settings", label: "Настройки" },
                    { icon: "info", label: "О приложении" }
                ],
                "Другое": [
                    { icon: "help", label: "Помощь" },
                    { icon: "logout", label: "Выйти", danger: true }
                ]
            };

            // ============================================================
            // 3. РЕНДЕР ЛЕНТЫ
            // ============================================================
            function getTodayDate() {
                const d = new Date();
                const day = d.getDate();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                return day + '.' + month;
            }

            function getDateParts() {
                return getTodayDate().split('').map(ch => ({
                    char: ch,
                    isDigit: /\d/.test(ch)
                }));
            }

            function renderLinteh(selectedCategory) {
                const container = document.getElementById('lintehContent');
                if (!container) return;
                const dateParts = getDateParts();
                let html = '';

                html += `<div class="date-display">`;
                for (const p of dateParts) {
                    if (p.isDigit) {
                        html += `<span class="date-digit">${p.char}</span>`;
                    } else {
                        html += `<span class="date-dot">${p.char}</span>`;
                    }
                }
                html += `</div>`;

                html += `<div class="subtitle">Удачи в доме с двумя пятерками!</div>`;

                html += `<div class="category-scroll"><div class="category-scroll-inner">`;
                for (const cat of categories) {
                    const active = cat === selectedCategory ? 'active' : '';
                    html += `<button class="category-btn ${active}" data-cat="${cat}">${cat}</button>`;
                }
                html += `</div></div>`;

                if (selectedCategory === 'ЛЕНТА') {
                    for (const post of postsData) {
                        html += `
                            <div class="post-card">
                                <div class="post-image"><span class="material-symbols-outlined">image</span></div>
                                <div class="post-title">${post.title}</div>
                                <div class="post-desc">${post.desc}</div>
                                <div class="post-actions">

                                        <button class="like-btn" data-liked="false"><span class="material-symbols-outlined">thumb_up</span></button>
                                        <button class="dislike-btn" data-disliked="false"><span class="material-symbols-outlined">thumb_down</span></button>
                                    </div>
                                    <button class="glass-btn"><span class="material-symbols-outlined">chat_bubble</span></button>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    html += `
                        <div style="text-align:center;padding:60px 0;color:var(--text-secondary);font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:-0.6px;font-weight:300;">
                            <div style="font-size:50px;margin-bottom:16px;"><span class="material-symbols-outlined" style="font-size:50px;">schedule</span></div>
                            ${selectedCategory} — скоро здесь появится контент
                        </div>
                    `;
                }

                container.innerHTML = html;

                container.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const cat = this.dataset.cat;
                        renderLinteh(cat);
                    });
                });

                container.querySelectorAll('.like-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const liked = this.dataset.liked === 'true';
                        this.dataset.liked = liked ? 'false' : 'true';
                        this.classList.toggle('liked');
                    });
                });
                container.querySelectorAll('.dislike-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const disliked = this.dataset.disliked === 'true';
                        this.dataset.disliked = disliked ? 'false' : 'true';
                        this.classList.toggle('disliked');
                    });
                });

                container.querySelectorAll('.post-card').forEach((card, idx) => {
                    card.addEventListener('click', function(e) {
                        if (e.target.closest('.post-actions')) return;
                        const post = postsData[idx % postsData.length];
                        alert(`${post.title}\n\n${post.desc}\n\n${post.time}`);
                    });

            // ============================================================
            // 4. РАСПИСАНИЕ — Wheel picker
            // ============================================================
            let scheduleState = {
                classSelected: false,
                grade: 9,
                letter: 'Е',
                selectedDay: 'ПНД'
            };

            function wheelItems(picker) {
                return picker.querySelectorAll('.wheel-item');
            }

            function closestWheelItem(picker) {
                const items = wheelItems(picker);
                const center = picker.scrollTop + picker.clientHeight / 2;
                let closest = null;
                let closestDist = Infinity;
                items.forEach(item => {
                    const itemCenter = item.offsetTop + item.clientHeight / 2;
                    const dist = Math.abs(center - itemCenter);
                    if (dist < closestDist) {
                        closestDist = dist;
                        closest = item;
                    }
                });
                return closest;
            }

            function markActiveWheelItem(picker) {
                const closest = closestWheelItem(picker);
                wheelItems(picker).forEach(item => {
                    item.classList.toggle('active', item === closest);
                });
            }

            function scrollWheelTo(picker, value, animated) {
                const target = [...wheelItems(picker)].find(el => el.dataset.value === String(value));
                if (!target) return;
                const top = target.offsetTop - picker.clientHeight / 2 + target.clientHeight / 2;
                picker.scrollTo({ top, behavior: animated ? 'smooth' : 'auto' });
                markActiveWheelItem(picker);
            }

            function createWheelPicker(containerId, items, selectedValue, onSelect) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';

                const picker = document.createElement('div');
                picker.className = 'wheel-picker';
                container.appendChild(picker);

                items.forEach(val => {
                    const item = document.createElement('div');
                    item.className = 'wheel-item';
                    item.textContent = val;
                    item.dataset.value = val;
                    item.addEventListener('click', function() {
                        scrollWheelTo(picker, this.dataset.value, true);
                        onSelect(this.dataset.value);
                    });
                    picker.appendChild(item);
                });

                requestAnimationFrame(() => scrollWheelTo(picker, selectedValue, false));

                let settleTimeout;
                picker.addEventListener('scroll', function() {
                    markActiveWheelItem(picker);
                    clearTimeout(settleTimeout);
                    settleTimeout = setTimeout(() => {
                        const closest = closestWheelItem(picker);
                        if (closest) onSelect(closest.dataset.value);
                    }, 120);
                }, { passive: true });
            }

            function renderSchedule() {
                const container = document.getElementById('scheduleView');
                if (!container) return;

                if (!scheduleState.classSelected) {
                    container.innerHTML = `
                        <div class="schedule-class-select">
                            <h2>Выбери класс</h2>
                            <div class="wheel-picker-row">
                                <div id="gradePicker" class="wheel-picker-col"></div>
                                <span class="wheel-separator">·</span>
                                <div id="letterPicker" class="wheel-picker-col"></div>
                            </div>
                            <div class="schedule-class-display">${scheduleState.grade} «${scheduleState.letter}»</div>
                            <div class="schedule-hint">Приложение подскажет расписание, когда закончится или начнется урок — а еще можно удобно написать что-то для себя в Заметки урока</div>
                            <button class="btn-primary" id="scheduleContinue">ПРОДОЛЖИТЬ</button>
                        </div>
                    `;

                    const grades = [5, 6, 7, 8, 9, 10, 11].map(String);
                    const letters = ['А', 'Б', 'В', 'Г', 'Д', 'Е'];

                    createWheelPicker('gradePicker', grades, String(scheduleState.grade), function(val) {
                        scheduleState.grade = parseInt(val, 10);
                        document.querySelector('.schedule-class-display').textContent = `${scheduleState.grade} «${scheduleState.letter}»`;
                    });

                    createWheelPicker('letterPicker', letters, scheduleState.letter, function(val) {
                        scheduleState.letter = val;
                        document.querySelector('.schedule-class-display').textContent = `${scheduleState.grade} «${scheduleState.letter}»`;
                    });

                    document.getElementById('scheduleContinue').addEventListener('click', function() {
                        scheduleState.classSelected = true;
                        renderSchedule();

                    return;

                let html = `

                        <button class="schedule-nav-back" id="scheduleBack">
                            <span class="material-symbols-outlined">arrow_back</span>
                            Назад
                        </button>
                        <button class="schedule-nav-help" id="scheduleHelp">
                            <span class="material-symbols-outlined">help</span>
                        </button>
                    </div>
                    <div class="schedule-content">
                        <div class="schedule-timer-label">ДО КОНЦА УРОКА</div>
                        <div class="schedule-big-number">23</div>
                        <div class="day-scroll"><div class="day-scroll-inner">
                `;
                for (const d of days) {
                    const active = d === scheduleState.selectedDay ? 'active' : '';

                }
                html += `</div></div>`;

                for (const lesson of lessonsData) {
                    html += `
                        <div class="lesson-item" data-lesson='${JSON.stringify(lesson)}'>
                            <div>
                                <div class="lesson-name">${lesson.name}</div>
                                <div class="lesson-room">${lesson.room}</div>
                            </div>
                            <div class="lesson-time">${lesson.time}</div>
                        </div>
                    `;
                }
                html += `</div>`;
                container.innerHTML = html;

                document.getElementById('scheduleBack').addEventListener('click', function() {
                    scheduleState.classSelected = false;
                    renderSchedule();
                });

                document.getElementById('scheduleHelp').addEventListener('click', function() {
                    alert('Справка\n\nЗдесь будет информация о расписании и функциях приложения.');
                });

                container.querySelectorAll('.day-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        scheduleState.selectedDay = this.dataset.day;
                        renderSchedule();
                    });
                });

                container.querySelectorAll('.lesson-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const data = JSON.parse(this.dataset.lesson);
                        showLessonDetail(data);
                    });
                });

            // ============================================================
            // 5. ДЕТАЛЬНЫЙ ЭКРАН УРОКА
            // ============================================================
            function showLessonDetail(lesson) {
                const container = document.getElementById('scheduleView');
                if (!container) return;

                container.innerHTML = `
                    <div class="schedule-nav">
                        <button class="schedule-nav-back" id="lessonBack">

                            <span class="material-symbols-outlined">photo_camera</span>
                            Прикрепить фото
                        </button>
                    </div>
                `;

                document.getElementById('lessonBack').addEventListener('click', function() {
                    renderSchedule();

                document.getElementById('saveNoteBtn').addEventListener('click', function() {
                    const note = document.getElementById('lessonNote').value;
                    if (note.trim()) {
                        const success = document.getElementById('saveSuccess');

                        localStorage.setItem('lessonNote_' + lesson.name, note);

                const saved = localStorage.getItem('lessonNote_' + lesson.name);

            function renderMore() {

                `;

                // Старые пункты "Больше"
                for (const [section, items] of Object.entries(moreItems)) {
                    html += `<div class="more-section"><div class="more-section-title">${section}</div>`;
                    for (const item of items) {
                        const color = item.danger ? '#ff3b30' : 'var(--link-color)';
                        html += `
                            <div class="more-item" data-label="${item.label}">
                                <div class="icon-bg" style="background:${color}">
                                    <span class="material-symbols-outlined" style="color:white;font-size:20px;">${item.icon}</span>
                                </div>
                                ${item.label}
                            </div>
                        `;
                    }
                    html += `</div>`;
                }

                container.innerHTML = html;

                // Обработчики
                container.querySelectorAll('.more-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const label = this.dataset.label;
                        if (label === 'Выйти') {
                            if (confirm('Вы уверены, что хотите выйти?')) {
                                alert('До свидания!');
                            }
                        } else {
                            alert(`${label}\n\nЭтот раздел будет доступен в следующей версии.`);
                        }
                    });
                });

                // Редактирование профиля
                document.getElementById('editProfileBtn').addEventListener('click', function() {
                    const name = prompt('Введите ваше имя:', document.getElementById('profileName').textContent);
                    if (name !== null && name.trim()) {
                        profile.name = name.trim();
                        document.getElementById('profileName').textContent = profile.name;
                        localStorage.setItem('lintech_profile', JSON.stringify(profile));
                    }
                });

                // Выбор аватарки
                document.getElementById('avatarPicker').addEventListener('click', function() {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*';
                    input.onchange = function(e) {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function(ev) {
                                profile.avatar = ev.target.result;
                                localStorage.setItem('lintech_profile', JSON.stringify(profile));
                                renderMore(); // обновляем
                            };
                            reader.readAsDataURL(file);
                        }
                    };
                    input.click();
                });

                // Сервисы
                document.getElementById('serviceCanteen').addEventListener('click', function() {
                    alert('🍽 Столовая\n\nМеню на сегодня:\n• Суп куриный\n• Гречка с котлетой\n• Компот');
                });

                document.getElementById('serviceProjectHall').addEventListener('click', function() {
                    alert('📅 Проект холл\n\nБлижайшие мероприятия:\n• 15.10 — Хакатон\n• 20.10 — Лекция по дизайну');
                });
            }

            // ============================================================
            // 7. УПРАВЛЕНИЕ СТРАНИЦАМИ (с плавными переходами)
            // ============================================================
            function showPage(index) {
                const pages = document.querySelectorAll('.page-container');
                pages.forEach((p, i) => {
                    p.classList.toggle('active', i === index);
                });
                // Рендерим контент при первом открытии
                if (index === 1) renderSchedule();
                if (index === 2) renderMore();
            }

            // ============================================================
            // 8. НАВБАРЫ (оставлены без изменений)
            // ============================================================
            class LintechNavBar {
                constructor(container) {
                    this.container = container;
                    this.panel = container.querySelector('.app-nav-bar__panel--ios');
                    this.items = container.querySelectorAll('.app-nav-bar__item');
                    this.selector = container.querySelector('.app-nav-bar__selector');
                    this.selectorInner = container.querySelector('.app-nav-bar__selector-inner');
                    this.selectorBorder = container.querySelector('.app-nav-bar__selector-border');

                    this.activeIndex = 0;
                    this.isAnimating = false;
                    this.isInitialized = false;

                    this.items.forEach((item, index) => {
                        if (item.classList.contains('app-nav-bar__item--active')) {
                            this.activeIndex = index;
                        }
                    });

                    this.init();
                }

                init() {
                    requestAnimationFrame(() => {
                        this.updateSelectorPosition(this.activeIndex, false);
                    });

                    this.items.forEach((item, index) => {
                        item.addEventListener('click', (e) => {
                            e.preventDefault();
                            this.setActive(index);
                        });
                    });

                    if (this.panel) {
                        const startPress = () => {
                            this.panel.style.transition = 'transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.1s ease-out';
                            this.panel.style.transform = 'scale(1.03)';
                            this.panel.style.backgroundColor = 'var(--secondary-bg-color)';
                        };
                        const endPress = () => {
                            this.panel.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease-out';
                            this.panel.style.transform = '';
                            this.panel.style.backgroundColor = '';
                        };
                        this.panel.addEventListener('mousedown', startPress);
                        this.panel.addEventListener('mouseup', endPress);
                        this.panel.addEventListener('mouseleave', endPress);
                        this.panel.addEventListener('touchstart', startPress, { passive: true });
                        this.panel.addEventListener('touchend', endPress, { passive: true });
                        this.panel.addEventListener('touchcancel', endPress, { passive: true });
                    }

                    this.isInitialized = true;

                    let resizeTimeout;
                    window.addEventListener('resize', () => {
                        clearTimeout(resizeTimeout);
                        resizeTimeout = setTimeout(() => {
                            if (this.isInitialized) {
                                this.updateSelectorPosition(this.activeIndex, false);
                            }
                        }, 100);
                    });

                    window.addEventListener('orientationchange', () => {
                        setTimeout(() => {
                            if (this.isInitialized) {
                                this.updateSelectorPosition(this.activeIndex, false);
                            }
                        }, 300);
                    });
                }

                setActive(index) {
                    if (this.isAnimating || this.activeIndex === index) return;
                    if (index < 0 || index >= this.items.length) return;

                    this.isAnimating = true;

                    this.items.forEach((item, i) => {
                        const isActive = i === index;
                        item.classList.toggle('app-nav-bar__item--active', isActive);
                        item.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    });

                    this.updateSelectorPosition(index, true);
                    this.activeIndex = index;
                    showPage(index);

                    setTimeout(() => {
                        this.isAnimating = false;
                    }, 300);
                }

                updateSelectorPosition(index, animated) {
                    const targetItem = this.items[index];
                    if (!targetItem) return;

                    const panelRect = this.panel.getBoundingClientRect();
                    const itemRect = targetItem.getBoundingClientRect();

                    let left = itemRect.left - panelRect.left;
                    let width = itemRect.width;

                    left = left - 3;
                    width = width - 6;

                    if (index === 0) {
                        width += 4.3;
                        left -= 8;
                    }

                    const maxLeft = panelRect.width - width - 3;
                    left = Math.max(3, Math.min(left, maxLeft));
                    width = Math.max(40, Math.min(width, panelRect.width - 6));

                    if (animated) {
                        this.selectorInner.classList.add('app-nav-bar__selector-inner--ios-moving');
                        this.selectorBorder.classList.add('app-nav-bar__selector-border--ios-moving');
                        setTimeout(() => {
                            this.selectorInner.classList.remove('app-nav-bar__selector-inner--ios-moving');
                            this.selectorBorder.classList.remove('app-nav-bar__selector-border--ios-moving');
                        }, 250);
                    }

                    this.selector.style.transform = 'translateX(' + left + 'px)';
                    this.selector.style.width = width + 'px';
                }

                goTo(index) {
                    if (index >= 0 && index < this.items.length) {
                        this.setActive(index);
                    }
                }

                getActiveIndex() {
                    return this.activeIndex;
                }

                refresh() {
                    if (this.isInitialized) {
                        this.updateSelectorPosition(this.activeIndex, false);
                    }
                }
            }

            class AndroidNavBar {
                constructor(container) {
                    this.container = container;
                    this.items = container.querySelectorAll('.app-nav-bar__item');
                    this.activeIndex = 0;

                    this.items.forEach((item, index) => {
                        if (item.classList.contains('app-nav-bar__item--active')) {
                            this.activeIndex = index;
                        }
                        item.addEventListener('click', (e) => {
                            e.preventDefault();
                            this.setActive(index);
                        });
                    });
                }

                setActive(index) {
                    if (this.activeIndex === index) return;
                    if (index < 0 || index >= this.items.length) return;

                    this.items.forEach((item, i) => {
                        const isActive = i === index;
                        item.classList.toggle('app-nav-bar__item--active', isActive);
                        item.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    });

                    this.activeIndex = index;
                    showPage(index);
                }

                getActiveIndex() {
                    return this.activeIndex;
                }
            }

            // ============================================================
            // 9. ТЕМНАЯ/СВЕТЛАЯ ТЕМА
            // ============================================================
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('lintech-theme', theme);
                setTimeout(() => {
                    if (window.lintechNav) window.lintechNav.refresh();
                }, 50);
            }

            function detectSystemTheme() {
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const saved = localStorage.getItem('lintech-theme');
                if (saved) {
                    applyTheme(saved);
                } else {
                    applyTheme(prefersDark ? 'dark' : 'light');
                }
            }

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem('lintech-theme')) {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });

            // ============================================================
            // 10. ИНИЦИАЛИЗАЦИЯ
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                const cells = renderSplash();
                runSplashAnimation(cells);

                renderLinteh('ЛЕНТА');
                renderMore();

                const iosContainer = document.querySelector('.ios-navbar');
                if (iosContainer && !isAndroid) {
                    window.lintechNav = new LintechNavBar(iosContainer);
                }

                const androidContainer = document.querySelector('.android-navbar');
                if (androidContainer && isAndroid) {
                    window.androidNav = new AndroidNavBar(androidContainer);
                }

                detectSystemTheme();

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        if (window.lintechNav && !isAndroid) {
                            const items = window.lintechNav.items;
                            const current = window.lintechNav.getActiveIndex();
                            let next = current;
                            if (e.key === 'ArrowLeft') next = Math.max(0, current - 1);
                            else next = Math.min(items.length - 1, current + 1);
                            if (next !== current) {
                                e.preventDefault();
                                window.lintechNav.goTo(next);
                            }
                        }
                    }
                });

                console.log('🚀 ЛИнТех PWA (продакшен) загружен!');
            });

        })();
    </script>
