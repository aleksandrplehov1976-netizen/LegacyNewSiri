<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Siri">
<link rel="apple-touch-icon" href="/yri.png">
<link rel="manifest" href="/manifest.json">
<title>Siri</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

@font-face { font-family: 'CustomFont'; src: url('/1.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
@font-face { font-family: 'AppBold'; src: url('/bold.otf') format('opentype'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'AppMono'; src: url('/mono.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
@font-face { font-family: 'AppBookworm'; src: url('/bookworm.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
@font-face { font-family: 'AppThin'; src: url('/thin.otf') format('opentype'); font-weight: 100; font-style: normal; font-display: swap; }

html { height: 100%; width: 100%; overflow: hidden; }
body {
  height: 100%; width: 100%;
  background: #000;
  font-family: 'CustomFont', -apple-system, 'SF Pro Text', BlinkMacSystemFont, sans-serif;
  color: #fff;
  overflow: hidden;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  overscroll-behavior: none;
  user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.bubble-user, .bubble-ai-content, .input-field { user-select: text; -webkit-user-select: text; }

#preloader {
  position: fixed; inset: 0; z-index: 10000;
  background: #000; pointer-events: none;
  transition: opacity 0.38s cubic-bezier(0.4, 0, 0.2, 1);
}
#preloader.fade-out { opacity: 0; }

.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: #000;
  opacity: 0; pointer-events: none;
  transition: opacity 0.26s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}
.screen.active { opacity: 1; pointer-events: all; }

.app-loaded #home.active .home-header { animation: slideUnblur 0.46s cubic-bezier(0.175,0.885,0.32,1.1) both; animation-delay: 0.04s; }
.app-loaded #home.active .cards-grid  { animation: slideUnblur 0.50s cubic-bezier(0.175,0.885,0.32,1.1) both; animation-delay: 0.11s; }
.app-loaded #home.active .home-bottom { animation: slideUnblur 0.46s cubic-bezier(0.175,0.885,0.32,1.1) both; animation-delay: 0.17s; }

@keyframes slideUnblur {
  0%   { opacity: 0; transform: translateY(14px) scale(0.97); filter: blur(6px); }
  60%  { filter: blur(1px); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@keyframes chatBubbleEnter {
  0%   { opacity: 0; transform: translateY(10px) scale(0.96); filter: blur(4px); }
  55%  { filter: blur(0.5px); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
.chat-enter-anim { animation: chatBubbleEnter 0.42s cubic-bezier(0.22, 1, 0.36, 1) both; }

/* ══ HOME ══ */
#home { display: flex; flex-direction: column; height: 100%; }
.home-header { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 12px; }
.home-title { font-size: 32px; font-weight: 700; letter-spacing: -0.6px; }

.home-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  scrollbar-width: none; padding: 10px 12px 130px;
}
.home-scroll::-webkit-scrollbar { display: none; }
.cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.card {
  position: relative;
  background-image: url('/src/cardtexturefinal.png');
  background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
  aspect-ratio: 1 / 0.9; cursor: pointer;
  display: flex; flex-direction: column; justify-content: flex-end;
  transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), opacity 0.15s;
  padding: 14px 12px; overflow: hidden;
}
.card:active:not(.editing-mode .card) { transform: scale(0.96); opacity: 0.75; }
.card.wobble { animation: wobble 0.10s ease-in-out infinite alternate; }
@keyframes wobble { 0% { transform: rotate(-1.5deg) scale(0.97); } 100% { transform: rotate(1.5deg) scale(0.97); } }

.card-delete {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; border-radius: 50%;
  background: url('/src/texture-btnssmall.png') center/100% 100% no-repeat;
  border: none; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 10;
}
.card-delete svg { width: 12px; height: 12px; }
.editing-mode .card-delete { display: flex; }
.card-date { font-size: 12px; color: rgba(255,255,255,0.55); margin-bottom: 4px; }
.card-title { font-size: 14px; font-weight: 600; line-height: 1.3; color: #fff; margin-bottom: 4px; letter-spacing: -0.2px; }
.card-preview { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.35; }

.home-bottom {
  position: fixed; 
  bottom: 0; 
  left: 0; 
  right: 0;
  z-index: 50;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px 32px;  /* ← увеличиваем боковые отступы (было 29px или 32px) */
  background: linear-gradient(to top, #000 60%, transparent);
  pointer-events: none;
}
.home-bottom button { pointer-events: all; }

/* ══ BUTTONS ══ */
.txbtn {
  border-radius: 1000px;
  background: url('/src/texture-btnssmall.png') center/100% 100% no-repeat;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.55), 0 6px 24px rgba(0,0,0,0.38), 0 1px 2px rgba(0,0,0,0.7);
  transition: transform 0.055s cubic-bezier(0.2,0,0.3,1);
  will-change: transform; opacity: 0.9;
}
.txbtn img { display: block; object-fit: contain; }
.txbtn svg { filter: brightness(0.72); transition: filter 0.055s ease; will-change: filter; }
.txbtn:active { transform: scale(1.13); }
.txbtn:active img { opacity: 0.85; }
.txbtn:active svg { filter: brightness(1.0) drop-shadow(0 0 4px rgba(255,255,255,0.9)) drop-shadow(0 0 8px rgba(255,255,255,0.5)); }
.txbtn.releasing { animation: btnFrameReturn 0.36s cubic-bezier(0.4,0,0.2,1) forwards; }
.txbtn.releasing svg { animation: iconGlowDecay 0.52s cubic-bezier(0.4,0,0.2,1) forwards; }
@keyframes btnFrameReturn { 0% { transform: scale(1.13); } 100% { transform: scale(1); } }
@keyframes iconGlowDecay {
  0%   { filter: brightness(1.0) drop-shadow(0 0 4px rgba(255,255,255,0.9)) drop-shadow(0 0 8px rgba(255,255,255,0.5)); }
  35%  { filter: brightness(0.95) drop-shadow(0 0 2px rgba(255,255,255,0.3)); }
  100% { filter: brightness(0.72); }
}
.txbtn-sm { width: 44px; height: 44px; }
.txbtn-sm img, .txbtn-sm svg { width: 19px; height: 19px; }
.txbtn-md { width: 49px; height: 49px; }
.txbtn-md img, .txbtn-md svg { width: 20px; height: 20px; }
.txbtn-lg { width: 68px; height: 68px; }
.txbtn-lg img, .txbtn-lg svg { width: 26px; height: 26px; }

#btnSettings { width: 52px; height: 52px; }
#btnSettings svg { width: 24px; height: 24px; filter: none; stroke: #f5f5f5; }
#btnSettings:active svg { filter: brightness(1.0) drop-shadow(0 0 4px rgba(255,255,255,0.9)) drop-shadow(0 0 8px rgba(255,255,255,0.5)); }

#goHomeBtn { width: 52px; height: 52px; }
#goHomeBtn img { width: 22px; height: 22px; }

/* ══ SETTINGS ══ */
.settings-overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.38s cubic-bezier(0.4,0,0.2,1); }
.settings-overlay.open { opacity: 1; pointer-events: all; }
.settings-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.settings-sheet { position: relative; z-index: 1; width: 100%; height: 85vh; background: #1a1a1a; border-radius: 28px 28px 0 0; padding: 0 0 48px; transform: translateY(100%); transition: transform 0.38s cubic-bezier(0.32,0.72,0,1); display: flex; flex-direction: column; overflow: hidden; }
.settings-overlay.open .settings-sheet { transform: translateY(0); }
.settings-topbar { display: flex; align-items: center; justify-content: center; padding: 18px 20px 14px; position: relative; flex-shrink: 0; }
.settings-heading { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: -0.2px; }
.settings-close { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); }
.settings-body { flex: 1; overflow-y: auto; padding: 6px 16px 20px; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.settings-body::-webkit-scrollbar { display: none; }
.settings-section-label { font-size: 13px; color: #888; padding: 16px 4px 8px; }
.settings-group { background: #2c2c2e; border-radius: 16px; overflow: hidden; margin-bottom: 10px; }
.settings-item { display: flex; align-items: center; padding: 14px 16px; gap: 12px; text-decoration: none; color: #fff; }
.settings-item + .settings-item { border-top: 1px solid rgba(255,255,255,0.07); }
.settings-item-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.settings-item-icon svg { width: 18px; height: 18px; }
.settings-item-label { font-size: 17px; color: #fff; flex: 1; }
.settings-item-value { font-size: 15px; color: #888; }
.settings-item-chevron svg { width: 14px; height: 14px; }

/* ══ SEARCH ══ */
.search-overlay {
  position: fixed; inset: 0; z-index: 250;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity 0.28s cubic-bezier(0.4,0,0.2,1);
}
.search-overlay.open { opacity: 1; pointer-events: all; }
.search-results { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; scrollbar-width: none; padding: 60px 16px 12px; }
.search-results::-webkit-scrollbar { display: none; }
.search-bottom { flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px 42px; background: linear-gradient(to top, rgba(0,0,0,0.9) 60%, transparent); }
.search-bar { flex: 1; height: 46px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); border-radius: 23px; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
.search-bar svg { flex-shrink: 0; opacity: 0.45; }
.search-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 16px; font-family: 'CustomFont', -apple-system, sans-serif; caret-color: #fff; }
.search-input::placeholder { color: rgba(255,255,255,0.38); }
.search-cancel { background: none; border: none; color: rgba(255,255,255,0.65); font-size: 16px; cursor: pointer; white-space: nowrap; font-family: 'CustomFont', -apple-system, sans-serif; padding: 4px 0 4px 4px; transition: opacity 0.15s; }
.search-cancel:active { opacity: 0.5; }
.search-result-item { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.07); cursor: pointer; transition: opacity 0.15s; }
.search-result-item:active { opacity: 0.55; }
.search-result-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 3px; }
.search-result-preview { font-size: 14px; color: rgba(255,255,255,0.45); line-height: 1.4; }
.search-result-date { font-size: 12px; color: rgba(255,255,255,0.28); margin-top: 3px; }
.search-empty { text-align: center; color: rgba(255,255,255,0.3); font-size: 15px; padding: 60px 0; }

/* ══ CHAT ══ */
#chat { display: flex; flex-direction: column; height: 100%; position: relative; }
.chat-top-texture { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: url('/src/texture-always-on-top_onlyonchats_.png') top center / 100% 100% no-repeat; z-index: 30; pointer-events: none; display: none; }
.chat-active .chat-top-texture { display: block; }
.tts-bar { position: fixed; top: 56px; left: 0; right: 0; z-index: 29; display: none; align-items: center; gap: 8px; padding: 6px 16px; }
.tts-bar.active { display: flex; }
.chat-header { position: fixed; top: 8px; left: 20px; z-index: 32; pointer-events: none; }
.chat-header button { pointer-events: all; }

.chat-messages {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  scrollbar-width: none;
  padding: 72px 0 120px;
  display: flex; flex-direction: column; gap: 4px;
}
.chat-messages::-webkit-scrollbar { display: none; }

/* ══ CHAT INPUT AREA ══ */
.chat-input-area {
  position: fixed; 
  bottom: 0; 
  left: 0; 
  right: 0;
  padding: 10px 29px 36px;  /* ← здесь тоже нужно увеличить боковые отступы */
  z-index: 20;
  pointer-events: none;
  background: linear-gradient(to top, rgba(0,0,0,0.96) 60%, transparent);
  transform-origin: center bottom;
  transition: transform 0.46s cubic-bezier(0.32, 0.72, 0, 1),
              opacity 0.38s cubic-bezier(0.4, 0, 0.2, 1),
              filter 0.38s cubic-bezier(0.4, 0, 0.2, 1);
}
.chat-input-area.voice-hiding {
  transform: translateY(28px) scale(0.88);
  opacity: 0;
  filter: blur(8px);
  pointer-events: none !important;
}
.chat-input-area .input-row { pointer-events: all; }
.input-row { display: flex; align-items: center; gap: 10px; position: relative; }
.input-bar { flex: 1; height: 49px; position: relative; display: flex; align-items: center; border-radius: 22px; overflow: hidden; opacity: 0.9; }
.input-bar-bg { position: absolute; inset: 0; background: url('/src/texture-enterprompt.png') center/100% 100% no-repeat; }
.input-bar-thinking { display: none; }
.input-field { position: relative; z-index: 2; flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 19px; font-family: 'CustomFont', -apple-system, sans-serif; padding: 0 14px; caret-color: #fff; }
.input-field::placeholder { color: #f5f5f5; }
.btn-send { display: none; }

.input-tap-glow { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.08) 40%, transparent 70%); transform: translate(-50%,-50%) scale(0); pointer-events: none; z-index: 3; animation: inputGlow 0.6s cubic-bezier(0.22,1,0.36,1) forwards; }
@keyframes inputGlow { 0% { transform: translate(-50%,-50%) scale(0); opacity: 1; } 45% { transform: translate(-50%,-50%) scale(1.6); opacity: 0.6; } 100% { transform: translate(-50%,-50%) scale(2.4); opacity: 0; } }

/* ══ BUBBLES ══ */
.bubble-user-wrap { display: flex; justify-content: flex-end; padding: 2px 22px 2px 20px; animation: bubbleIn 0.32s cubic-bezier(0.175,0.885,0.32,1.1) both; }
.bubble-user-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 82%; }

.bubble-user {
  background: #2a2a2c;
  color: #fff;
  padding: 8px 16px;
  border-radius: 27px 27px 4px 27px;
  font-size: 19px; line-height: 1.4;
  word-wrap: break-word; overflow-wrap: break-word; word-break: break-word;
  hyphens: auto; -webkit-hyphens: auto;
  position: relative;
}

.bubble-user::after {
  content: '';
  position: absolute;
  bottom: -4.9px;
  right: -0.6px;
  width: 18px;
  height: 20px;
  background: url('/icons/ballsms.PNG') no-repeat center/contain;
  pointer-events: none;
  display: block;
}

/* interim voice bubble */
.bubble-user.voice-interim {
  opacity: 0.55;
  font-style: italic;
}

.bubble-file { background: #1e1e20; color: #ccc; padding: 8px 13px; border-radius: 16px; font-size: 13px; display: flex; align-items: center; gap: 7px; max-width: 220px; overflow: hidden; }
.bubble-file svg { flex-shrink: 0; }
.bubble-file-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'AppMono', monospace; font-size: 12px; color: #aaa; }

.bubble-ai-wrap { display: flex; flex-direction: column; align-self: flex-start; width: 100%; padding: 8px 29px 2px 29px; }
.bubble-ai-wrap.entering { animation: aiMessageIn 0.55s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes bubbleIn { 0% { opacity: 0; transform: translateY(10px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes aiMessageIn {
  0%   { opacity: 0; transform: translateY(8px); filter: blur(5px); }
  55%  { filter: blur(1px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}
.bubble-user-wrap + .bubble-ai-wrap, .bubble-ai-wrap + .bubble-user-wrap { padding-top: 10px; }

.bubble-ai-content { font-size: 19px; line-height: 1.58; color: #fff; word-wrap: break-word; overflow-wrap: break-word; word-break: break-word; hyphens: auto; -webkit-hyphens: auto; min-width: 0; width: 100%; }
.bubble-ai-content h1 { font-size: 38px; font-weight: 100; line-height: 1.1; margin: 18px 0 10px; letter-spacing: -1px; font-family: 'AppThin', -apple-system, sans-serif; }
.bubble-ai-content h2 { font-size: 28px; font-weight: 100; line-height: 1.15; margin: 14px 0 8px; letter-spacing: -0.6px; font-family: 'AppThin', -apple-system, sans-serif; }
.bubble-ai-content h3 { font-size: 22px; font-weight: 100; line-height: 1.2; margin: 12px 0 6px; letter-spacing: -0.3px; font-family: 'AppThin', -apple-system, sans-serif; }
.bubble-ai-content p { margin: 0 0 10px; }
.bubble-ai-content p:last-child { margin-bottom: 0; }
.bubble-ai-content ul, .bubble-ai-content ol { padding-left: 22px; margin-bottom: 10px; }
.bubble-ai-content li { margin-bottom: 5px; }
.bubble-ai-content strong { font-weight: 700; font-family: 'AppBold', 'CustomFont', sans-serif; }
.bubble-ai-content em { font-style: italic; font-family: 'AppBookworm', 'CustomFont', serif; }
.bubble-ai-content blockquote { border-left: 2px solid rgba(255,255,255,0.2); padding-left: 14px; color: rgba(255,255,255,0.65); margin: 10px 0; font-family: 'AppBookworm', 'CustomFont', serif; font-size: 17px; line-height: 1.65; }
.bubble-ai-content code { background: rgba(255,255,255,0.08); border-radius: 6px; padding: 2px 6px; font-size: 15px; font-family: 'AppMono', 'SF Mono', monospace; color: #e2e8f0; word-break: break-all; }
.bubble-ai-content pre { background: #0d0d0f; border-radius: 14px; margin: 10px 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
.code-block-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px 8px; background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.07); }
.code-block-lang { font-size: 12px; font-family: 'AppMono', 'SF Mono', monospace; color: rgba(255,255,255,0.45); text-transform: lowercase; letter-spacing: 0.3px; }
.code-copy-btn { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.38); display: flex; align-items: center; gap: 4px; font-size: 12px; font-family: 'CustomFont', -apple-system, sans-serif; padding: 3px 6px; border-radius: 6px; transition: color 0.15s, background 0.15s; line-height: 1; }
.code-copy-btn:active { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.08); }
.code-copy-btn svg { width: 13px; height: 13px; }
.bubble-ai-content pre code { display: block; background: transparent; padding: 12px 14px 14px; font-size: 13.5px; font-family: 'AppMono', 'SF Mono', monospace; color: #cdd6f4; line-height: 1.55; overflow-x: auto; -webkit-overflow-scrolling: touch; word-break: normal; white-space: pre; border-radius: 0; }
.bubble-ai-content .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 10px 0; border-radius: 14px; max-width: 100%; }
.bubble-ai-content table { border-collapse: collapse; width: 100%; min-width: 280px; background: #0a0a0c; border-radius: 14px; overflow: hidden; font-size: 15px; margin: 0; }
.bubble-ai-content th { background: #111113; color: #fff; padding: 10px 14px; text-align: left; font-weight: 600; font-family: 'AppBold', 'CustomFont', sans-serif; font-size: 14px; }
.bubble-ai-content td { padding: 9px 14px; color: rgba(255,255,255,0.75); font-size: 15px; }
.bubble-ai-content tr { border-bottom: 1px solid rgba(255,255,255,0.055); }
.bubble-ai-content tr:last-child { border-bottom: none; }
.bubble-ai-content thead tr { border-bottom: 1px solid rgba(255,255,255,0.10); }
.bubble-ai-content tr:hover td { background: rgba(255,255,255,0.025); }
.bubble-ai-content .katex { color: #fff; font-size: 1em; }
.bubble-ai-content .katex-display { overflow-x: auto; overflow-y: hidden; padding: 6px 0; max-width: 100%; }
.bubble-ai-content hr { border: none; border-top: 1px solid rgba(255,255,255,0.10); margin: 16px 0; }

/* ══ LIKE / UNLIKE BUTTONS ══ */

@keyframes wCharIn {

  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@keyframes wCharOut {
  0%   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  100% { opacity: 0; transform: translateY(-6px) scale(0.88); filter: blur(5px); }

.wc { display: inline-block; opacity: 0; }

.wc.out { animation: wCharOut 0.18s cubic-bezier(0.4, 0, 1, 1) both; pointer-events: none; }

@keyframes charReveal {
  0%   { opacity: 0; transform: translateY(5px) scale(0.82); filter: blur(5px); }
  45%  { filter: blur(1px); transform: translateY(1px) scale(0.97); opacity: 0.7; }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
.char-animate { display: inline-block; opacity: 0; animation: charReveal 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderMarkdownToHtml(text) {
  if (typeof marked === 'undefined') return `<div class="bubble-ai-content">${escHtml(text)}</div>`;

  s = s.replace(/\$\$([\s\S]+?)\$\$/g,(_,m)=>{ const i=mathBlocks.length; mathBlocks.push({t:'display',m}); return `MATH_${i}_`; });

    const langRaw = (codeEl.className.match(/language-(\S+)/)||[])[1]||'';
    const header = document.createElement('div'); header.className='code-block-header';
    header.innerHTML = `<span class="code-block-lang">${escHtml(detectLang(langRaw))}</span><button class="code-copy-btn" onclick="copyCode(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Копировать</button>`;
    if (langRaw) codeEl.innerHTML = syntaxColor(codeEl.innerHTML, langRaw);
    codeEl.className = '';
    pre.insertBefore(header, codeEl);
  });
  return `<div class="bubble-ai-content">${tmp.innerHTML}</div>`;
}

function copyCode(btn) {
  const code = btn.closest('pre').querySelector('code'); if (!code) return;
  navigator.clipboard?.writeText(code.innerText||code.textContent).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>Скопировано';
    btn.style.color='rgba(255,255,255,0.7)';
    setTimeout(()=>{ btn.innerHTML=orig; btn.style.color=''; },2000);
  });
}

// Анимированный char-reveal для plain text (голосовые пузыри)
function animatePlainText(el, text) {
  el.innerHTML = '';
  const chars = [...text];
  chars.forEach((ch, i) => {
    if (ch === ' ') {
      const sp = document.createElement('span'); sp.className='char-space'; sp.textContent='\u00a0';
      el.appendChild(sp);
    } else {
      const cs = document.createElement('span'); cs.className='char-animate';
      cs.style.animationDelay = (i * CHAR_DELAY * 0.7) + 'ms';
      cs.textContent = ch; el.appendChild(cs);
    }
  });
}

async function animateHtmlContent(container, htmlString) {
  container.innerHTML = htmlString;
  const textNodes = [];
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue.trim()) return NodeFilter.FILTER_SKIP;
      let p = node.parentElement;
      while (p && p !== container) {
        if (['PRE','CODE'].includes(p.tagName) || p.classList?.contains('katex') || p.classList?.contains('katex-display')) return NodeFilter.FILTER_SKIP;
        p = p.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let node;
  while (node = walker.nextNode()) textNodes.push(node);
  let globalDelay = 0;
  for (const tn of textNodes) {
    const orig = tn.nodeValue, frag = document.createDocumentFragment();
    let d = globalDelay;
    for (let i = 0; i < orig.length; i++) {
      const cp = orig.codePointAt(i); const isEmoji = cp > 0xFFFF;
      const ch = isEmoji ? String.fromCodePoint(cp) : orig[i];
      if (isEmoji) i++;
      if (ch === ' ' || ch === '\u00a0') {
        const sp = document.createElement('span'); sp.className='char-space'; sp.textContent='\u00a0'; frag.appendChild(sp); d += CHAR_DELAY*0.3;
      } else if (ch === '\n') {
        frag.appendChild(document.createElement('br'));
      } else {
        const cs = document.createElement('span'); cs.className='char-animate'; cs.style.animationDelay=d+'ms'; cs.textContent=ch; frag.appendChild(cs); d += CHAR_DELAY;
      }
    }
    tn.parentNode.replaceChild(frag, tn);
    globalDelay = d;
  }
  const msgs = document.getElementById('chatMessages');
  const si = setInterval(() => requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; }), 80);
  await new Promise(r => setTimeout(r, globalDelay + 250));
  clearInterval(si);
  requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });
}

function buildPhraseEl(text, mode) {
  const wrap = document.createElement('span');
  wrap.className = 'working-phrase';
  wrap.style.color = 'rgba(255,248,235,0.92)';
  const chars = [...text];
  chars.forEach((ch, i) => {
    if (ch === ' ') {
      const sp = document.createElement('span'); sp.style.display = 'inline-block'; sp.style.width = '0.28em'; wrap.appendChild(sp);
    } else {
      const cs = document.createElement('span'); cs.className = 'wc ' + mode;
      cs.style.animationDelay = (i * (mode === 'in' ? CHAR_IN_STAGGER : CHAR_OUT_STAGGER)) + 'ms';
      cs.textContent = ch; wrap.appendChild(cs);
    }
  });
  return wrap;
}

let workingWrap = null;

function showWorkingInline() {
  if (workingWrap) { workingWrap.remove(); workingWrap = null; }
  const msgs = document.getElementById('chatMessages');
  const wrap = document.createElement('div');
  wrap.className = 'bubble-ai-wrap working-placeholder';
  const row = document.createElement('div'); row.className = 'working-row';
  const video = document.createElement('video');
  video.className = 'working-video'; video.src = '/src/FakeThinkMov.MOV';
  video.autoplay = true; video.loop = true; video.muted = true; video.playsInline = true;
  video.setAttribute('disablepictureinpicture',''); video.style.pointerEvents = 'none';
  const textArea = document.createElement('div'); textArea.className = 'working-text-area';
  const phrase1 = buildPhraseEl(PHRASE1, 'in');
  textArea.appendChild(phrase1);
  row.appendChild(video); row.appendChild(textArea);
  wrap.appendChild(row); msgs.appendChild(wrap);
  workingWrap = wrap;
  requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });

  const t1 = setTimeout(() => {
    if (!workingWrap) return;
    phrase1.querySelectorAll('.wc').forEach((cs, i) => {
      cs.classList.remove('in'); void cs.offsetWidth;
      cs.style.animationDelay = (i * CHAR_OUT_STAGGER) + 'ms';
      cs.classList.add('out');
    });
    const outTotal = [...text2chars(PHRASE1)].length * CHAR_OUT_STAGGER;
    const phrase2Delay = Math.min(400, outTotal * 0.45);
    const t2 = setTimeout(() => {
      if (!workingWrap) return;
      const phrase2 = buildPhraseEl(PHRASE2, 'in');
      textArea.appendChild(phrase2);
      setTimeout(() => { if (phrase1.parentNode) phrase1.remove(); }, outTotal + 250);
    }, phrase2Delay);
    workingWrap._t2 = t2;
  }, 2000);

  const t3 = setTimeout(() => {
    if (workingWrap) { const vid = workingWrap.querySelector('.working-video'); if (vid) vid.classList.add('fading'); }
  }, 4700);

  workingWrap._t1 = t1; workingWrap._t3 = t3;
}

function text2chars(str) { return [...str].filter(c => c !== ' '); }

function hideWorkingInline() {
  if (!workingWrap) return;
  const w = workingWrap; workingWrap = null;
  clearTimeout(w._t1); clearTimeout(w._t2); clearTimeout(w._t3);
  w.remove();
}

/* ══════════════════════════════════════════════
   VOICE MODE
══════════════════════════════════════════════ */

function enterVoiceMode() {
  if (voiceMode) return;
  voiceMode = true;
  voiceFinalText = '';
  voiceInterimBubble = null;
  voiceProcessing = false;

  // Анимация ухода поля ввода
  const inputArea = document.getElementById('chatInputArea');
  inputArea.classList.add('voice-hiding');

  // Показываем видео
  const vid = document.getElementById('voiceModeVideo');
  vid.currentTime = 0;
  vid.play().catch(() => {});
  setTimeout(() => vid.classList.add('visible'), 30);

  // Показываем voice bar
  const vbar = document.getElementById('voiceModeBar');
  setTimeout(() => vbar.classList.add('visible'), 120);

  // Сброс иконки звука
  voiceSoundEnabled = true;
  document.getElementById('btnVoiceSoundIcon').src = '/icons/soundon.png';

  // Запуск распознавания
  setTimeout(() => startRecognition(), 280);
}

function exitVoiceMode() {
  if (!voiceMode) return;
  voiceMode = false;

  stopRecognition();
  clearTimeout(voiceSilenceTimer);

  // Убираем voice bar
  document.getElementById('voiceModeBar').classList.remove('visible');

  // Убираем видео
  const vid = document.getElementById('voiceModeVideo');
  vid.classList.remove('visible');
  setTimeout(() => vid.pause(), 560);

  // Возвращаем поле ввода
  const inputArea = document.getElementById('chatInputArea');
  inputArea.classList.remove('voice-hiding');

  // Убираем незаконченный interim пузырь
  if (voiceInterimBubble) {
    voiceInterimBubble.remove();
    voiceInterimBubble = null;
  }
}

function startRecognition() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = (e) => {
    if (!voiceMode || voiceProcessing) return;
    clearTimeout(voiceSilenceTimer);

    let interim = '';
    let finalChunk = '';

    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) {
        finalChunk += res[0].transcript;
      } else {
        interim += res[0].transcript;
      }
    }

    if (finalChunk) {
      voiceFinalText += finalChunk + ' ';
      // Убираем interim пузырь, показываем финальный
      if (voiceInterimBubble) {
        voiceInterimBubble.querySelector('.bubble-user').classList.remove('voice-interim');
        animatePlainText(voiceInterimBubble.querySelector('.bubble-user'), voiceFinalText.trim());
        voiceInterimBubble = null;
      } else {
        showVoiceBubble(voiceFinalText.trim(), false);
      }
      // Таймер тишины — 1.6с после последнего финального слова
      voiceSilenceTimer = setTimeout(() => {
        if (voiceMode && !voiceProcessing && voiceFinalText.trim()) {
          commitVoiceMessage();
        }
      }, 1600);
    }

    if (interim && !voiceProcessing) {
      const displayText = (voiceFinalText + interim).trim();
      if (!voiceInterimBubble) {
        voiceInterimBubble = showVoiceBubble(displayText, true);
      } else {
        voiceInterimBubble.querySelector('.bubble-user').textContent = displayText;
      }
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    // Перезапуск при других ошибках если ещё в voice mode
    if (voiceMode && !voiceProcessing) {
      setTimeout(() => { if (voiceMode && !voiceProcessing) startRecognition(); }, 400);
    }
  };

  recognition.onend = () => {
    // Авторестарт пока в режиме и не обрабатываем
    if (voiceMode && !voiceProcessing) {
      setTimeout(() => { if (voiceMode && !voiceProcessing) startRecognition(); }, 200);
    }
  };

  try { recognition.start(); } catch(e) {}
}

function stopRecognition() {
  if (recognition) {
    try { recognition.abort(); } catch(e) {}
    recognition = null;
  }
}

function showVoiceBubble(text, isInterim) {
  const msgs = document.getElementById('chatMessages');
  const wrap = document.createElement('div'); wrap.className = 'bubble-user-wrap';
  const stack = document.createElement('div'); stack.className = 'bubble-user-stack';
  const bub = document.createElement('div'); bub.className = 'bubble-user';
  if (isInterim) {
    bub.classList.add('voice-interim');
    bub.textContent = text;
  } else {
    animatePlainText(bub, text);
  }
  stack.appendChild(bub); wrap.appendChild(stack); msgs.appendChild(wrap);
  wrap.classList.add('chat-enter-anim');
  requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });
  return wrap;
}

async function commitVoiceMessage() {
  const text = voiceFinalText.trim();
  if (!text) return;
  voiceProcessing = true;
  voiceFinalText = '';
  voiceInterimBubble = null;

  // Пауза распознавания пока отвечаем
  stopRecognition();

  currentMessages.push({ role: 'user', content: text });

  // API call (без MOV_DURATION — в voice режиме сразу)
  showWorkingInline();
  const msgs = document.getElementById('chatMessages');
  requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });
  abortController = new AbortController();

  const messages = [{ role: 'system', content: SYSTEM_PROMPT }];
  for (const msg of currentMessages) messages.push({ role: msg.role === 'user' ? 'user' : 'assistant', content: msg.content });

  let aiText = '';
  try {
    const resp = await fetch(GROQ_URL, {
      method: 'POST', signal: abortController.signal,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_API_KEY },
      body: JSON.stringify({ model: GROQ_MODEL, messages, max_tokens: 1024, temperature: 0.7 })
    });
    if (!resp.ok) { const et = await resp.text(); throw new Error('API ' + resp.status + ': ' + et); }
    const data = await resp.json();
    aiText = (data.choices?.[0]?.message?.content || '').trim();
    if (!aiText) aiText = 'Не удалось получить ответ.';
  } catch (err) {
    hideWorkingInline();
    if (err.name !== 'AbortError') {
      const ew = document.createElement('div'); ew.className = 'bubble-ai-wrap';
      const ec = document.createElement('div'); ec.className = 'bubble-ai-content'; ec.textContent = 'Ошибка: ' + err.message;
      ew.appendChild(ec); msgs.appendChild(ew);
    }
    voiceProcessing = false;
    abortController = null;
    // Возобновляем слушание
    if (voiceMode) startRecognition();
    return;
  }

  currentMessages.push({ role: 'assistant', content: aiText });
  hideWorkingInline();
  await new Promise(r => requestAnimationFrame(r));
  await new Promise(r => requestAnimationFrame(r));

  const reactionId = 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const wrap = document.createElement('div'); wrap.className = 'bubble-ai-wrap entering';
  const contentDiv = document.createElement('div');
  wrap.appendChild(contentDiv);
  wrap.appendChild(buildReactionButtons(reactionId));
  msgs.appendChild(wrap);
  requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });

  await animateHtmlContent(contentDiv, renderMarkdownToHtml(aiText));
  new Audio('/src/sound.mp3').play().catch(() => {});

  // Сохраняем чат
  if (currentChatId) {
    const c = chats.find(c => c.id === currentChatId);
    if (c) { c.messages.push({role:'user',text}); c.messages.push({role:'ai',text:aiText}); c.ts=Date.now(); c.preview=aiText.slice(0,62)+'…'; }
  } else {
    const id = 'chat_' + Date.now(); currentChatId = id;
    chats.unshift({id,ts:Date.now(),title:text.length>50?text.slice(0,50)+'…':text,preview:aiText.slice(0,62)+'…',messages:[{role:'user',text},{role:'ai',text:aiText}]});
  }
  saveChats(chats);

  voiceProcessing = false;
  abortController = null;

  // TTS ответа если включён звук
  if (voiceSoundEnabled && voiceMode) {
    await speakAndThenListen(aiText);
  } else if (voiceMode) {
    startRecognition();
  }
}

function speakAndThenListen(text) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window) || !voiceSoundEnabled || !voiceMode) { resolve(); startRecognition(); return; }
    stopTTS();
    const plain = text.replace(/\$\$[\s\S]*?\$\$/g,'формула').replace(/\$[^$]+\$/g,'формула').replace(/[#*`_~>]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
    ttsUtterance = new SpeechSynthesisUtterance(plain);
    ttsUtterance.lang = 'ru-RU'; ttsUtterance.rate = 1;
    ttsUtterance.onend = () => { resolve(); if (voiceMode && voiceSoundEnabled) startRecognition(); };
    ttsUtterance.onerror = () => { resolve(); if (voiceMode) startRecognition(); };
    window.speechSynthesis.speak(ttsUtterance);
    ttsActive = true; ttsPaused = false; updateTTSBar();
  });
}

/* ══ REACTION BUTTONS ══ */
function buildReactionButtons(reactionId) {
  const reactions = loadReactions();
  const state = reactions[reactionId] || { like: false, unlike: false };
  const actions = document.createElement('div'); actions.className = 'bubble-ai-actions';
  actions.dataset.reactionId = reactionId;

  const likeBtn = document.createElement('button'); likeBtn.className = 'reaction-btn'; likeBtn.title = 'Нравится';
  const likeImg = document.createElement('img'); likeImg.src = state.like ? '/src/like-pressed.png' : '/src/like-unpressed.png';
  likeBtn.appendChild(likeImg);

  const unlikeBtn = document.createElement('button'); unlikeBtn.className = 'reaction-btn'; unlikeBtn.title = 'Не нравится';
  const unlikeImg = document.createElement('img'); unlikeImg.src = state.unlike ? '/src/unlike-pressed.png' : '/src/unlike-notpressed.png';
  unlikeBtn.appendChild(unlikeImg);

  likeBtn.addEventListener('click', () => {
    const r = loadReactions(); const s = r[reactionId] || { like:false, unlike:false };
    s.like = !s.like; if (s.like) s.unlike = false;
    r[reactionId] = s; saveReactions(r);
    likeImg.src = s.like ? '/src/like-pressed.png' : '/src/like-unpressed.png';
    unlikeImg.src = s.unlike ? '/src/unlike-pressed.png' : '/src/unlike-notpressed.png';
  });
  unlikeBtn.addEventListener('click', () => {
    const r = loadReactions(); const s = r[reactionId] || { like:false, unlike:false };
    s.unlike = !s.unlike; if (s.unlike) s.like = false;
    r[reactionId] = s; saveReactions(r);
    likeImg.src = s.like ? '/src/like-pressed.png' : '/src/like-unpressed.png';
    unlikeImg.src = s.unlike ? '/src/unlike-pressed.png' : '/src/unlike-notpressed.png';
  });

  actions.appendChild(likeBtn); actions.appendChild(unlikeBtn);
  return actions;
}

function renderCards() {

      <button class="card-delete" data-i="${i}">
        <svg viewBox="0 0 14 14" fill="none" stroke="#ff3b30" stroke-width="2.4" stroke-linecap="round"><line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/></svg>

function startLongPress() { cancelLongPress(); longPressTimer = setTimeout(() => { if (!editingMode) { editingMode=true; renderCards(); } }, 480); }

function exitEditing() { editingMode = false; renderCards(); }

function renderSearchResults(query) {
  const container = document.getElementById('searchResults');
  const empty = document.getElementById('searchEmpty');
  container.querySelectorAll('.search-result-item').forEach(el => el.remove());
  if (!query.trim()) { empty.style.display='block'; return; }
  const q = query.toLowerCase();
  const results = chats.filter(c => c.title.toLowerCase().includes(q) || (c.messages||[]).some(m=>m.text&&m.text.toLowerCase().includes(q)));
  if (!results.length) { empty.textContent='Ничего не найдено'; empty.style.display='block'; return; }
  empty.style.display='none';
  results.forEach(chat => {
    const item = document.createElement('div'); item.className='search-result-item';
    let preview = chat.preview||'';
    const msg = (chat.messages||[]).find(m=>m.text&&m.text.toLowerCase().includes(q));
    if (msg) { const idx=msg.text.toLowerCase().indexOf(q); const st=Math.max(0,idx-30); preview=(st>0?'…':'')+msg.text.slice(st,st+80)+(msg.text.length>st+80?'…':''); }
    item.innerHTML=`<div class="search-result-title">${escHtml(chat.title)}</div><div class="search-result-preview">${escHtml(preview)}</div><div class="search-result-date">${formatDate(chat.ts)}</div>`;
    item.addEventListener('click',()=>{ closeSearch(); openChatById(chat.id); });
    container.appendChild(item);
  });
}
document.getElementById('searchInput').addEventListener('input', e => renderSearchResults(e.target.value));
document.getElementById('searchCancelBtn').addEventListener('click', closeSearch);

function goHome() {

  document.getElementById('chat').classList.remove('active');
  document.getElementById('home').classList.add('active');
  setChatActive(false); renderCards();
}

const ttsBar=document.getElementById('ttsBar'), ttsPlayIcon=document.getElementById('ttsPlayIcon'), ttsPauseIcon=document.getElementById('ttsPauseIcon');
function startTTS(text) {
  stopTTS(); if(!('speechSynthesis' in window)) return;
  const plain=text.replace(/\$\$[\s\S]*?\$\$/g,'формула').replace(/\$[^$]+\$/g,'формула').replace(/[#*`_~>]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
  ttsUtterance=new SpeechSynthesisUtterance(plain); ttsUtterance.lang='ru-RU'; ttsUtterance.rate=1;
  ttsUtterance.onend=()=>{ttsActive=false;ttsPaused=false;updateTTSBar();};
  ttsUtterance.onerror=()=>{ttsActive=false;ttsPaused=false;updateTTSBar();};
  window.speechSynthesis.speak(ttsUtterance); ttsActive=true; ttsPaused=false; updateTTSBar();
}
function stopTTS() { if('speechSynthesis' in window) window.speechSynthesis.cancel(); ttsActive=false;ttsPaused=false;ttsUtterance=null;updateTTSBar(); }
function toggleTTSPlayPause() { if(!ttsActive) return; if(ttsPaused){window.speechSynthesis.resume();ttsPaused=false;}else{window.speechSynthesis.pause();ttsPaused=true;} updateTTSBar(); }
function updateTTSBar() { ttsBar.classList.toggle('active',ttsActive); ttsPlayIcon.style.display=ttsPaused?'block':'none'; ttsPauseIcon.style.display=ttsPaused?'none':'block'; }
document.getElementById('ttsPlayPauseBtn').addEventListener('click',toggleTTSPlayPause);
document.getElementById('ttsCloseBtn').addEventListener('click',stopTTS);

async function callAPI(val) {
  isGenerating = true; toggleControls(); showWorkingInline();
  const msgs = document.getElementById('chatMessages');
  requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });
  abortController = new AbortController();

  const messages = [{ role: 'system', content: SYSTEM_PROMPT }];
  for (const msg of currentMessages) messages.push({ role: msg.role === 'user' ? 'user' : 'assistant', content: msg.content });
  messages.push({ role: 'user', content: val });

  const fetchPromise = fetch(GROQ_URL, {
    method: 'POST', signal: abortController.signal,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_API_KEY },
    body: JSON.stringify({ model: GROQ_MODEL, messages, max_tokens: 1024, temperature: 0.7 })
  });
  const movTimer = new Promise(r => setTimeout(r, MOV_DURATION));

  let aiText = '';
  try {
    const [resp] = await Promise.all([fetchPromise, movTimer]);
    if (!resp.ok) { const et = await resp.text(); throw new Error('API ' + resp.status + ': ' + et); }
    const data = await resp.json();
    aiText = (data.choices?.[0]?.message?.content || '').trim();
    if (!aiText) aiText = 'Не удалось получить ответ от API.';
  } catch (err) {
    hideWorkingInline();
    if (err.name !== 'AbortError') {
      const ew=document.createElement('div'); ew.className='bubble-ai-wrap';
      const ec=document.createElement('div'); ec.className='bubble-ai-content'; ec.textContent='Произошла ошибка: '+err.message;
      ew.appendChild(ec); msgs.appendChild(ew);
    }
    isGenerating=false; abortController=null; toggleControls(); return;
  }

  currentMessages.push({ role: 'assistant', content: aiText });
  hideWorkingInline();
  await new Promise(r => requestAnimationFrame(r));
  await new Promise(r => requestAnimationFrame(r));

  const reactionId = 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const wrap=document.createElement('div'); wrap.className='bubble-ai-wrap entering';
  const contentDiv=document.createElement('div');
  wrap.appendChild(contentDiv);
  wrap.appendChild(buildReactionButtons(reactionId));
  msgs.appendChild(wrap);
  requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });

  await animateHtmlContent(contentDiv, renderMarkdownToHtml(aiText));
  new Audio('/src/sound.mp3').play().catch(() => {});

  if (currentChatId) {
    const c=chats.find(c=>c.id===currentChatId);
    if(c){c.messages.push({role:'user',text:val});c.messages.push({role:'ai',text:aiText});c.ts=Date.now();c.title=val.length>50?val.slice(0,50)+'…':val;c.preview=aiText.slice(0,62)+'…';}
  } else {
    const id='chat_'+Date.now(); currentChatId=id;
    chats.unshift({id,ts:Date.now(),title:val.length>50?val.slice(0,50)+'…':val,preview:aiText.slice(0,62)+'…',messages:[{role:'user',text:val},{role:'ai',text:aiText}]});
  }
  saveChats(chats); isGenerating=false; abortController=null; toggleControls();
}

let attachedFileText='', attachedFileName='';
const fileInput=document.getElementById('fileInput'), attachedFilePill=document.getElementById('attachedFilePill'), attachedFileNameEl=document.getElementById('attachedFileName');

async function extractFileText(file) {
  const ext=file.name.split('.').pop().toLowerCase();
  const textExts=['txt','md','csv','json','xml','html','htm','yaml','yml','log','ini','toml','rtf','js','ts','py','css','sh'];
  if(textExts.includes(ext)) return await file.text();
  const buf=await file.arrayBuffer(); const bytes=new Uint8Array(buf); let raw='';
  for(let i=0;i<bytes.length;i++){const b=bytes[i];if(b>=32&&b<127)raw+=String.fromCharCode(b);else if(b===10||b===13)raw+=' ';}
  if(ext==='pdf'){const bt=raw.match(/BT[\s\S]{0,500}?ET/g)||[];let ex=bt.map(m=>(m.match(/\(([^)]{1,200})\)/g)||[]).map(s=>s.slice(1,-1)).join(' ')).join(' ').replace(/\s+/g,' ').trim();if(!ex)ex=(raw.match(/[\x20-\x7E]{5,}/g)||[]).join(' ').replace(/\s+/g,' ').trim();return ex.slice(0,14000)||'[PDF: текст не извлечён]';}
  if(['docx','xlsx','pptx'].includes(ext)){const tags=raw.match(/<(?:w:t|t|si)[^>]*>([^<]{1,500})<\/(?:w:t|t|si)>/g)||[];let ex=tags.map(m=>m.replace(/<[^>]+>/g,'')).join(' ');if(!ex)ex=(raw.match(/[\x20-\x7E]{6,}/g)||[]).filter(s=>s.length>5).join(' ');return ex.replace(/\s+/g,' ').trim().slice(0,14000)||'['+ext+': текст не извлечён]';}
  return (raw.match(/[\x20-\x7E]{6,}/g)||[]).join(' ').replace(/\s+/g,' ').trim().slice(0,14000)||'['+ext+': текст не извлечён]';
}

fileInput.addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file) return;
  attachedFileName=file.name;
  try { attachedFileText=await extractFileText(file); if(attachedFileText.length>14000) attachedFileText=attachedFileText.slice(0,14000)+'\n\n[...обрезано]'; }
  catch(err){ attachedFileText='[Ошибка: '+err.message+']'; }
  attachedFileNameEl.textContent=file.name; attachedFilePill.style.display='flex'; fileInput.value='';
});
function clearAttachment(){ attachedFileText='';attachedFileName='';attachedFilePill.style.display='none'; }

async function sendMessageWithFile() {
  const val=chatInput.value.trim(); if(!val&&!attachedFileText) return; if(isGenerating) return;
  const msgs=document.getElementById('chatMessages');
  const wrap=document.createElement('div'); wrap.className='bubble-user-wrap';
  const stack=document.createElement('div'); stack.className='bubble-user-stack';
  if(attachedFileText){const fb=document.createElement('div');fb.className='bubble-file';fb.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span class="bubble-file-name">'+escHtml(attachedFileName)+'</span>';stack.appendChild(fb);}
  if(val){const bub=document.createElement('div');bub.className='bubble-user';bub.textContent=val;stack.appendChild(bub);}
  wrap.appendChild(stack); msgs.appendChild(wrap);
  requestAnimationFrame(()=>{ msgs.scrollTop=msgs.scrollHeight; });

  const userDisplay=val||('📎 '+attachedFileName);
  const apiContent=attachedFileText?'[Файл: '+attachedFileName+']\n```\n'+attachedFileText+'\n```\n\n'+(val||'Прочитай и проанализируй этот файл.'):val;
  currentMessages.push({role:'user',content:apiContent});
  chatInput.value=''; clearAttachment(); toggleControls();
  isGenerating=true; toggleControls(); showWorkingInline();
  abortController=new AbortController();

  const messages=[{role:'system',content:SYSTEM_PROMPT}];
  for(const msg of currentMessages) messages.push({role:msg.role==='user'?'user':'assistant',content:msg.content});

  const fetchPromise=fetch(GROQ_URL,{method:'POST',signal:abortController.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_API_KEY},body:JSON.stringify({model:GROQ_MODEL,messages,max_tokens:1024,temperature:0.7})});
  const movTimer=new Promise(r=>setTimeout(r,MOV_DURATION));

  let aiText='';
  try {
    const [resp]=await Promise.all([fetchPromise,movTimer]);
    if(!resp.ok){const et=await resp.text();throw new Error('API '+resp.status+': '+et);}
    const data=await resp.json();
    aiText=(data.choices?.[0]?.message?.content||'').trim();
    if(!aiText) aiText='Не удалось получить ответ от API.';
  } catch(err){
    hideWorkingInline();
    if(err.name!=='AbortError'){const ew=document.createElement('div');ew.className='bubble-ai-wrap';const ec=document.createElement('div');ec.className='bubble-ai-content';ec.textContent='Произошла ошибка: '+err.message;ew.appendChild(ec);msgs.appendChild(ew);}
    isGenerating=false;abortController=null;toggleControls();return;
  }

  currentMessages.push({role:'assistant',content:aiText});
  hideWorkingInline();
  await new Promise(r=>requestAnimationFrame(r));
  await new Promise(r=>requestAnimationFrame(r));

  const reactionId = 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const aw=document.createElement('div'); aw.className='bubble-ai-wrap entering';
  const cd=document.createElement('div');
  aw.appendChild(cd);
  aw.appendChild(buildReactionButtons(reactionId));
  msgs.appendChild(aw);
  requestAnimationFrame(()=>{ msgs.scrollTop=msgs.scrollHeight; });

  await animateHtmlContent(cd,renderMarkdownToHtml(aiText));
  new Audio('/src/sound.mp3').play().catch(()=>{});

  if(currentChatId){const c=chats.find(c=>c.id===currentChatId);if(c){c.messages.push({role:'user',text:userDisplay});c.messages.push({role:'ai',text:aiText});c.ts=Date.now();c.preview=aiText.slice(0,62)+'…';}}
  else{const id='chat_'+Date.now();currentChatId=id;chats.unshift({id,ts:Date.now(),title:userDisplay.length>50?userDisplay.slice(0,50)+'…':userDisplay,preview:aiText.slice(0,62)+'…',messages:[{role:'user',text:userDisplay},{role:'ai',text:aiText}]});}
  saveChats(chats); isGenerating=false; abortController=null; toggleControls();
}

document.getElementById('btnSend').addEventListener('click', sendMessageWithFile);

function initButtonInteractions() {
  document.querySelectorAll('.txbtn').forEach(btn=>{
    btn.addEventListener('pointerup',()=>{ btn.classList.remove('releasing'); void btn.offsetWidth; btn.classList.add('releasing'); });
    btn.addEventListener('pointercancel',()=>{ btn.classList.remove('releasing'); });
    btn.addEventListener('animationend',e=>{ if(e.animationName==='btnFrameReturn') btn.classList.remove('releasing'); });
  });
}

function initInputRipple() {
  inputBar.addEventListener('pointerdown',e=>{
    const rect=inputBar.getBoundingClientRect();
    const g=document.createElement('div'); g.className='input-tap-glow';
    g.style.left=(e.clientX-rect.left)+'px'; g.style.top=(e.clientY-rect.top)+'px';
    inputBar.appendChild(g); g.addEventListener('animationend',()=>g.remove());
  });
}

function initScrollContainers() {
  const scrollables=[document.getElementById('chatMessages'),document.getElementById('homeScroll'),document.querySelector('#settingsOverlay .settings-body'),document.getElementById('searchResults')];
  scrollables.forEach(el=>{
    if(!el) return;
    el.style.webkitOverflowScrolling='touch'; el.style.overflowY='auto';
    el.addEventListener('touchstart',e=>{e.stopPropagation();},{passive:true});
    el.addEventListener('touchmove',e=>{e.stopPropagation();},{passive:true});
  });
  document.body.addEventListener('touchmove',e=>{
    const el=e.target.closest('.chat-messages,.home-scroll,.settings-body,.search-results,.bubble-ai-content pre code,.table-wrap');
    if(!el) e.preventDefault();
  },{passive:false});
}
