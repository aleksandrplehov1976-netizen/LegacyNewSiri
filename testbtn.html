<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
</head>
<body style="margin:0; padding:0; background:#000; overflow:hidden; position:fixed; width:100%; height:100%; top:0; left:0;">
    <img id="actionButton" src="/src/animbutton.png" 
         style="position:fixed; bottom:0; left:0; width:49px; height:49px; cursor:pointer; z-index:20; -webkit-tap-highlight-color:transparent;"
         draggable="false">
    <video id="upVideo" 
           src="/src/animvideoup.png" 
           style="position:fixed; bottom:0; left:0; width:auto; height:auto; z-index:15; display:none; pointer-events:none;"
           autoplay muted playsinline
           preload="auto"></video>
    <video id="downVideo" 
           src="/src/animvideodown.png" 
           style="position:fixed; bottom:0; left:0; width:auto; height:auto; z-index:15; display:none; pointer-events:none;"
           autoplay muted playsinline
           preload="auto"></video>
    <script>
        (function(){
            var btn = document.getElementById('actionButton');
            var upVideo = document.getElementById('upVideo');
            var downVideo = document.getElementById('downVideo');
            var isPlaying = false;
            function resetToButton(){
                upVideo.style.display = 'none';
                downVideo.style.display = 'none';
                btn.style.display = 'block';
                upVideo.pause();
                upVideo.currentTime = 0;
                downVideo.pause();
                downVideo.currentTime = 0;
                isPlaying = false;
            }
            function playUpVideo(){
                if(isPlaying) return;
                btn.style.display = 'none';
                upVideo.style.display = 'block';
                downVideo.style.display = 'none';
                upVideo.currentTime = 0;
                upVideo.play().then(function(){
                    isPlaying = true;
                    upVideo.addEventListener('ended', function onEnd(){
                        upVideo.removeEventListener('ended', onEnd);
                        upVideo.currentTime = upVideo.duration - 0.001;
                        upVideo.pause();
                        isPlaying = false;
                    });
                }).catch(function(e){});
            }
            function playDownAndReset(){
                if(isPlaying) return;
                btn.style.display = 'none';
                upVideo.style.display = 'none';
                downVideo.style.display = 'block';
                downVideo.currentTime = 0;
                downVideo.play().then(function(){
                    isPlaying = true;
                    downVideo.addEventListener('ended', function onEnd(){
                        downVideo.removeEventListener('ended', onEnd);
                        downVideo.currentTime = downVideo.duration - 0.001;
                        downVideo.pause();
                        resetToButton();
                    });
                }).catch(function(e){});
            }
            btn.addEventListener('click', function(e){
                e.stopPropagation();
                playUpVideo();
            });
            document.body.addEventListener('click', function(e){
                if(e.target === btn || e.target === upVideo || e.target === downVideo) return;
                if(upVideo.style.display === 'block' || downVideo.style.display === 'block'){
                    if(upVideo.style.display === 'block'){
                        upVideo.pause();
                        upVideo.currentTime = upVideo.duration - 0.001;
                    }
                    if(downVideo.style.display === 'block'){
                        downVideo.pause();
                        downVideo.currentTime = downVideo.duration - 0.001;
                    }
                    resetToButton();
                }
                playDownAndReset();
            });
            upVideo.addEventListener('click', function(e){ e.stopPropagation(); });
            downVideo.addEventListener('click', function(e){ e.stopPropagation(); });
            resetToButton();
        })();
    </script>
</body>
</html>
