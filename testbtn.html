<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
</head>
<body style="margin:0; padding:0; background:#000; overflow:hidden; position:fixed; width:100%; height:100%; top:0; left:0; display:flex; align-items:center; justify-content:center;">
    <video id="mainVideo" 
           src="/src/IMG_5249.MP4" 
           style="width:auto; height:auto; max-width:90vw; max-height:90vh; cursor:pointer; display:block; user-select:none; -webkit-tap-highlight-color:transparent;"
           muted playsinline
           preload="auto"></video>
    <div id="upsMessage" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); color:white; font-size:24px; padding:20px 40px; border-radius:12px; display:none; z-index:100; font-family:sans-serif; pointer-events:none;">УПС, заглушка</div>
    <script>
        (function(){
            var video = document.getElementById('mainVideo');
            var upsDiv = document.getElementById('upsMessage');
            var isPlaying = false;
            var isReversing = false;
            var isExpanded = false;
            var forwardSkipFrames = 3;
            
            video.load();
            video.currentTime = 0;
            video.pause();
            
            video.addEventListener('loadeddata', function(){
                video.currentTime = 0;
                video.pause();
            });
            
            function showUps() {
                upsDiv.style.display = 'block';
                setTimeout(function(){
                    upsDiv.style.display = 'none';
                }, 800);
            }
            
            function playForward() {
                if(isPlaying) return;
                isPlaying = true;
                isReversing = false;
                isExpanded = true;
                video.playbackRate = 1.0;
                
                var frameTime = 1 / 30;
                var skipTime = forwardSkipFrames * frameTime;
                video.currentTime = skipTime;
                
                video.play().catch(function(e){});
                
                var onEnded = function() {
                    video.removeEventListener('ended', onEnded);
                    video.pause();
                    video.currentTime = video.duration - 0.001;
                    isPlaying = false;
                };
                video.addEventListener('ended', onEnded);
            }
            
            function playReverse() {
                if(isPlaying) return;
                if(!isExpanded) return;
                isPlaying = true;
                isReversing = true;
                video.pause();
                
                var startTime = video.currentTime;
                if(startTime <= 0.01) startTime = video.duration - 0.001;
                video.currentTime = startTime;
                
                var reverseStep = function() {
                    if(!isReversing) return;
                    var newTime = video.currentTime - 0.033;
                    if(newTime <= 0) {
                        video.currentTime = 0;
                        video.pause();
                        isPlaying = false;
                        isReversing = false;
                        isExpanded = false;
                        return;
                    }
                    video.currentTime = newTime;
                    requestAnimationFrame(reverseStep);
                };
                
                requestAnimationFrame(reverseStep);
            }
            
            video.addEventListener('click', function(e){
                e.stopPropagation();
                if(isPlaying) return;
                if(isExpanded) {
                    showUps();
                    return;
                }
                if(video.currentTime >= video.duration - 0.01) {
                    video.currentTime = 0;
                    video.pause();
                }
                playForward();
            });
            
            document.body.addEventListener('click', function(e){
                if(e.target === video) return;
                if(!isExpanded) return;
                if(isPlaying) return;
                if(video.currentTime <= 0.01) {
                    video.currentTime = video.duration - 0.001;
                    video.pause();
                }
                playReverse();
            });
            
            video.addEventListener('touchstart', function(e){
                e.stopPropagation();
            });
            
            document.body.addEventListener('touchstart', function(e){
                if(e.target === video) return;
                if(!isExpanded) return;
                if(isPlaying) return;
                if(video.currentTime <= 0.01) {
                    video.currentTime = video.duration - 0.001;
                    video.pause();
                }
                playReverse();
            });
            
            video.addEventListener('loadedmetadata', function(){
                video.currentTime = 0;
                video.pause();
                isExpanded = false;
            });
        })();
    </script>
</body>
</html>
