<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
</head>
<body style="margin:0; padding:0; background:#000; overflow:hidden; position:fixed; width:100%; height:100%; top:0; left:0; display:flex; align-items:center; justify-content:center;">
    <video id="mainVideo" 
           src="/src/IMG_5249.MP4" 
           style="width:calc(100% - 100px); max-width:280px; height:auto; cursor:pointer; -webkit-tap-highlight-color:transparent;"
           muted playsinline
           preload="auto"></video>
    <script>
        (function(){
            var video = document.getElementById('mainVideo');
            var isPlaying = false;
            var isReversing = false;
            
            video.load();
            video.currentTime = 0;
            video.pause();
            
            var forwardVideo = document.createElement('video');
            forwardVideo.src = "/src/IMG_5249.MP4";
            forwardVideo.muted = true;
            forwardVideo.playsinline = true;
            forwardVideo.preload = "auto";
            forwardVideo.load();
            
            var reverseVideo = document.createElement('video');
            reverseVideo.src = "/src/IMG_5247.MP4";
            reverseVideo.muted = true;
            reverseVideo.playsinline = true;
            reverseVideo.preload = "auto";
            reverseVideo.load();
            
            function playForward() {
                if(isPlaying || isReversing) return;
                isPlaying = true;
                
                video.pause();
                video.currentTime = 0;
                video.src = "/src/IMG_5249.MP4";
                video.load();
                
                var playHandler = function() {
                    video.removeEventListener('canplaythrough', playHandler);
                    video.play().then(function() {
                        isPlaying = true;
                    }).catch(function(e){});
                };
                video.addEventListener('canplaythrough', playHandler);
                video.load();
                
                var onEnded = function() {
                    video.removeEventListener('ended', onEnded);
                    video.pause();
                    video.currentTime = video.duration - 0.001;
                    isPlaying = false;
                };
                video.addEventListener('ended', onEnded);
                
                setTimeout(function() {
                    if(isPlaying && video.currentTime >= video.duration - 0.05) {
                        video.pause();
                        video.currentTime = video.duration - 0.001;
                        isPlaying = false;
                    }
                }, (video.duration * 1000) + 100);
            }
            
            function playReverse() {
                if(isPlaying || isReversing) return;
                isReversing = true;
                
                video.pause();
                video.currentTime = 0;
                video.src = "/src/IMG_5247.MP4";
                video.load();
                
                var playHandler = function() {
                    video.removeEventListener('canplaythrough', playHandler);
                    video.playbackRate = 1.4;
                    video.play().then(function() {
                        isReversing = true;
                    }).catch(function(e){});
                };
                video.addEventListener('canplaythrough', playHandler);
                video.load();
                
                var onEnded = function() {
                    video.removeEventListener('ended', onEnded);
                    video.pause();
                    video.currentTime = video.duration - 0.001;
                    video.src = "/src/IMG_5249.MP4";
                    video.load();
                    video.currentTime = 0;
                    video.pause();
                    isReversing = false;
                };
                video.addEventListener('ended', onEnded);
                
                setTimeout(function() {
                    if(isReversing && video.currentTime >= video.duration - 0.05) {
                        video.pause();
                        video.currentTime = video.duration - 0.001;
                        video.src = "/src/IMG_5249.MP4";
                        video.load();
                        video.currentTime = 0;
                        video.pause();
                        isReversing = false;
                    }
                }, (video.duration * 1000 / 1.4) + 100);
            }
            
            video.addEventListener('click', function(e){
                e.stopPropagation();
                playForward();
            });
            
            document.body.addEventListener('click', function(e){
                if(e.target === video) return;
                playReverse();
            });
            
            video.addEventListener('loadeddata', function(){
                if(!isPlaying && !isReversing){
                    video.pause();
                }
            });
            
            setTimeout(function(){
                video.pause();
                video.currentTime = 0;
            }, 100);
        })();
    </script>
</body>
</html>
