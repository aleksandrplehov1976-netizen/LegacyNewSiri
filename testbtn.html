<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
</head>
<body style="margin:0; padding:0; background:#000; overflow:hidden; position:fixed; width:100%; height:100%; top:0; left:0;">
    <img id="actionButton" src="/src/animbutton.jpg" 
         style="position:fixed; bottom:16px; left:16px; width:72px; height:72px; cursor:pointer; z-index:20; -webkit-tap-highlight-color:transparent;"
         draggable="false">
    <video id="upVideo" 
           src="/src/IMG_5249.MP4" 
           style="position:fixed; bottom:16px; left:16px; width:calc(100% - 100px); max-width:280px; height:auto; z-index:15; display:none; pointer-events:none; object-fit:contain;"
           muted playsinline
           preload="auto"></video>
    <video id="downVideo" 
           src="/src/IMG_5247.MP4" 
           style="position:fixed; bottom:16px; left:16px; width:calc(100% - 100px); max-width:280px; height:auto; z-index:15; display:none; pointer-events:none; object-fit:contain;"
           muted playsinline
           preload="auto"></video>
    <script>
        (function(){
            var btn = document.getElementById('actionButton');
            var upVideo = document.getElementById('upVideo');
            var downVideo = document.getElementById('downVideo');
            var isPlaying = false;
            
            upVideo.load();
            downVideo.load();
            upVideo.playbackRate = 1.0;
            downVideo.playbackRate = 1.4;
            
            upVideo.addEventListener('canplaythrough', function(){});
            downVideo.addEventListener('canplaythrough', function(){});
            
            function resetToButton(){
                upVideo.style.display = 'none';
                downVideo.style.display = 'none';
                btn.style.display = 'block';
                upVideo.pause();
                upVideo.currentTime = 0;
                downVideo.pause();
                downVideo.currentTime = 0;
                isPlaying = false;
            }
            
            function playUpVideo(){
                if(isPlaying) return;
                btn.style.display = 'none';
                upVideo.style.display = 'block';
                downVideo.style.display = 'none';
                upVideo.currentTime = 0;
                upVideo.play().then(function(){
                    isPlaying = true;
                }).catch(function(e){});
                
                var onUpEnded = function(){
                    upVideo.removeEventListener('ended', onUpEnded);
                    if(upVideo.currentTime >= upVideo.duration - 0.05){
                        upVideo.pause();
                        upVideo.currentTime = upVideo.duration - 0.001;
                        isPlaying = false;
                    } else {
                        setTimeout(function(){
                            if(upVideo.currentTime >= upVideo.duration - 0.05){
                                upVideo.pause();
                                upVideo.currentTime = upVideo.duration - 0.001;
                                isPlaying = false;
                            }
                        }, 50);
                    }
                };
                upVideo.addEventListener('ended', onUpEnded);
                
                setTimeout(function(){
                    if(isPlaying && upVideo.currentTime >= upVideo.duration - 0.1){
                        upVideo.pause();
                        upVideo.currentTime = upVideo.duration - 0.001;
                        isPlaying = false;
                    }
                }, (upVideo.duration * 1000) + 50);
            }
            
            function playDownAndReset(){
                if(isPlaying) return;
                btn.style.display = 'none';
                upVideo.style.display = 'none';
                downVideo.style.display = 'block';
                downVideo.currentTime = 0;
                downVideo.play().then(function(){
                    isPlaying = true;
                }).catch(function(e){});
                
                var onDownEnded = function(){
                    downVideo.removeEventListener('ended', onDownEnded);
                    downVideo.pause();
                    downVideo.currentTime = downVideo.duration - 0.001;
                    resetToButton();
                };
                downVideo.addEventListener('ended', onDownEnded);
                
                setTimeout(function(){
                    if(isPlaying && downVideo.currentTime >= downVideo.duration - 0.1){
                        downVideo.pause();
                        downVideo.currentTime = downVideo.duration - 0.001;
                        resetToButton();
                        isPlaying = false;
                    }
                }, (downVideo.duration * 1000 / 1.4) + 50);
            }
            
            btn.addEventListener('click', function(e){
                e.stopPropagation();
                playUpVideo();
            });
            
            document.body.addEventListener('click', function(e){
                if(e.target === btn || e.target === upVideo || e.target === downVideo) return;
                if(upVideo.style.display === 'block' || downVideo.style.display === 'block'){
                    if(upVideo.style.display === 'block'){
                        upVideo.pause();
                        upVideo.currentTime = upVideo.duration - 0.001;
                    }
                    if(downVideo.style.display === 'block'){
                        downVideo.pause();
                        downVideo.currentTime = downVideo.duration - 0.001;
                    }
                    resetToButton();
                }
                playDownAndReset();
            });
            
            upVideo.addEventListener('click', function(e){ e.stopPropagation(); });
            downVideo.addEventListener('click', function(e){ e.stopPropagation(); });
            
            resetToButton();
            
            upVideo.addEventListener('loadeddata', function(){
                upVideo.pause();
                upVideo.currentTime = 0;
            });
            downVideo.addEventListener('loadeddata', function(){
                downVideo.pause();
                downVideo.currentTime = 0;
            });
        })();
    </script>
</body>
</html>
