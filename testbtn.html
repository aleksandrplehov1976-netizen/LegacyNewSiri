<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
</head>
<body style="margin:0; padding:0; background:#000; overflow:hidden; position:fixed; width:100%; height:100%; top:0; left:0;">
    <video id="mainVideo" 
           src="/src/IMG_5249.MP4" 
           style="position:fixed; bottom:16px; left:16px; width:120px; height:auto; cursor:pointer; display:block; user-select:none; -webkit-tap-highlight-color:transparent; z-index:10;"
           muted playsinline
           preload="auto"></video>
    <div id="upsMessage" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); color:white; font-size:24px; padding:20px 40px; border-radius:12px; display:none; z-index:100; font-family:sans-serif; pointer-events:none;">УПС, заглушка</div>
    <script>
        (function(){
            var video = document.getElementById('mainVideo');
            var upsDiv = document.getElementById('upsMessage');
            var isPlaying = false;
            var isReversing = false;
            var isExpanded = false;
            var animationId = null;
            var normalSize = 120;
            var expandedSize = 280;
            
            function setVideoSize(size) {
                video.style.width = size + 'px';
                video.style.height = 'auto';
            }
            
            video.load();
            video.currentTime = 0;
            video.pause();
            setVideoSize(normalSize);
            
            video.addEventListener('loadeddata', function(){
                video.currentTime = 0;
                video.pause();
                setVideoSize(normalSize);
            });
            
            function showUps() {
                upsDiv.style.display = 'block';
                setTimeout(function(){
                    upsDiv.style.display = 'none';
                }, 800);
            }
            
            function stopReverseAnimation() {
                if(animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
            }
            
            function playForward() {
                if(isPlaying) return;
                
                stopReverseAnimation();
                isPlaying = true;
                isReversing = false;
                isExpanded = true;
                setVideoSize(expandedSize);
                video.playbackRate = 1.0;
                
                var currentTime = video.currentTime;
                if(currentTime >= video.duration - 0.01 || currentTime <= 0.01) {
                    video.currentTime = 0;
                }
                
                var playPromise = video.play();
                if(playPromise !== undefined) {
                    playPromise.catch(function(e){});
                }
                
                var onEnded = function() {
                    video.removeEventListener('ended', onEnded);
                    video.pause();
                    video.currentTime = video.duration - 0.001;
                    isPlaying = false;
                };
                video.addEventListener('ended', onEnded);
            }
            
            function playReverse() {
                if(isPlaying) return;
                if(!isExpanded) return;
                
                stopReverseAnimation();
                isPlaying = true;
                isReversing = true;
                video.pause();
                
                var startTime = video.currentTime;
                if(startTime <= 0.01) startTime = video.duration - 0.001;
                video.currentTime = startTime;
                
                function reverseStep() {
                    if(!isReversing) {
                        animationId = null;
                        return;
                    }
                    var newTime = video.currentTime - 0.033;
                    if(newTime <= 0) {
                        video.currentTime = 0;
                        video.pause();
                        setVideoSize(normalSize);
                        isPlaying = false;
                        isReversing = false;
                        isExpanded = false;
                        animationId = null;
                        return;
                    }
                    video.currentTime = newTime;
                    animationId = requestAnimationFrame(reverseStep);
                }
                
                animationId = requestAnimationFrame(reverseStep);
            }
            
            video.addEventListener('click', function(e){
                e.stopPropagation();
                if(isPlaying) return;
                if(isExpanded) {
                    showUps();
                    return;
                }
                playForward();
            });
            
            document.body.addEventListener('click', function(e){
                if(e.target === video) return;
                if(!isExpanded) return;
                if(isPlaying) return;
                playReverse();
            });
            
            video.addEventListener('touchstart', function(e){
                e.stopPropagation();
            });
            
            document.body.addEventListener('touchstart', function(e){
                if(e.target === video) return;
                if(!isExpanded) return;
                if(isPlaying) return;
                playReverse();
            });
            
            video.addEventListener('loadedmetadata', function(){
                video.currentTime = 0;
                video.pause();
                setVideoSize(normalSize);
                isExpanded = false;
                stopReverseAnimation();
            });
            
            video.addEventListener('play', function(){
                if(!isReversing && isPlaying) {
                    video.playbackRate = 1.0;
                }
            });
        })();
    </script>
</body>
</html>
